    foot = `<div class="footbar"><div class="in">
      ${judged ? `<button class="btn primary" data-act="next">${QUIZ.i===QUIZ.ids.length-1?"完成":"下一题"}</button>`
               : `<button class="btn primary" data-act="judge" ${canJudge?"":"disabled"}>提交答案</button>`}
    </div></div>`;
  }

  return `
  <div class="topbar">
    <div class="in">
      <button class="btn sm ghost" data-act="quit">←</button>
      <h1>${QUIZ.mode==="wrong"?"错题重刷":(isMock?"模考":"练习")} · 第${q.set}套</h1>
      ${timer}
      <span class="tag">${QUIZ.i+1}/${QUIZ.ids.length}</span>
    </div>
    <div class="progress"><i style="width:${pct}%"></i></div>
  </div>
  <div class="wrap">
    ${banner}
    <div class="card">
      <div class="qmeta">
        <span class="tag b">${q.type}</span>
        <span>第 ${q.set} 套 · ${q.type}第 ${q.idx} 题</span>
        <span class="muted">原卷第 ${q.no} 题</span>
      </div>
      <div class="stem">${esc(q.stem)}</div>
      ${stmts}
      ${opts}
    </div>
    ${exp}
    ${nav}
  </div>
  ${foot}`;
}

/* ---------- 判题 ---------- */
function judgeCurrent(autoNext){
  const q = curQ();
  const pick = QUIZ.picks[q.id] || "";
  if(!pick) return;
  const ok = pick.split("").sort().join("") === q.ans.split("").sort().join("");
  QUIZ.judged[q.id] = { ok };
  const x = rec(q.id);
  x.a++; x.ts = Date.now(); x.last = pick; x.ok = ok;
  if(ok){ x.r++; x.streak++; } else { x.w++; x.streak = 0; x.out = false; }
  save();
  if(autoNext){ nextQ(); } else { render(); }
}

function nextQ(){
  if(QUIZ.i < QUIZ.ids.length-1){ QUIZ.i++; render(); window.scrollTo(0,0); }
  else { finishPractice(); }
}

function finishPractice(){
  const total = QUIZ.ids.length;
  const okc = QUIZ.ids.filter(id=>QUIZ.judged[id] && QUIZ.judged[id].ok).length;
  go("result", { mode:"practice", total, okc, ids:QUIZ?QUIZ.ids.slice():[] });
}

/* ---------- 交卷 ---------- */
function submitMock(){
  const unanswered = QUIZ.ids.filter(id=>!QUIZ.picks[id]).length;
  if(unanswered>0 && !confirm(`还有 ${unanswered} 题没作答，确定交卷？`)) return;
  let score = 0, wrong = 0;
  QUIZ.ids.forEach(id=>{
    const q = BYID[id];
    const pick = QUIZ.picks[id] || "";
    const ok = pick && pick.split("").sort().join("") === q.ans.split("").sort().join("");
    const x = rec(id);
    x.a++; x.ts = Date.now(); x.last = pick; x.ok = !!ok;
    if(ok){ x.r++; x.streak++; score += (q.type==="单选"?1:2); }
    else { x.w++; x.streak = 0; x.out = false; wrong++; }
  });
  const secs = Math.round((Date.now()-QUIZ.t0)/1000);
  DB.mocks.push({ set: QUIZ.set, ts: Date.now(), score, wrong, secs, total: QUIZ.ids.length });
  save();
  stopTimer();
  go("result", { mode:"mock", score, wrong, secs, total: QUIZ.ids.length, ids: QUIZ.ids.slice(), set: QUIZ.set });
}

/* ---------- 结果 ---------- */
function viewResult(){
  const r = ROUTE;
  const mm = String(Math.floor(r.secs/60)).padStart(2,"0"), ss = String(r.secs%60).padStart(2,"0");
  if(r.mode==="practice"){
    return `<div class="topbar"><div class="in"><button class="btn sm ghost" data-act="go" data-to="home">←</button><h1>练习完成</h1></div></div>
    <div class="wrap">
      <div class="card" style="text-align:center;padding:28px 16px">
        <div style="font-size:34px;font-weight:700">${r.okc}<span class="muted" style="font-size:16px"> / ${r.total}</span></div>
        <div class="muted">正确率 ${(r.okc/r.total*100).toFixed(0)}%</div>
      </div>
      <button class="btn primary" data-act="go" data-to="home">回首页</button>
      <div style="height:10px"></div>
      <button class="btn" data-act="startwrong">看看错题本</button>
    </div>`;
  }
  return `<div class="topbar"><div class="in"><button class="btn sm ghost" data-act="go" data-to="home">←</button><h1>第${r.set}套 模考结果</h1></div></div>
  <div class="wrap">
    <div class="card" style="text-align:center;padding:26px 16px">
      <div style="font-size:40px;font-weight:700;letter-spacing:-1px">${r.score}<span class="muted" style="font-size:16px"> / 50</span></div>
      <div class="muted">错 ${r.wrong} 题 ｜ 用时 ${mm}:${ss}</div>
      <div class="bar" style="margin-top:14px"><i style="width:${r.score/50*100}%"></i></div>
    </div>
    <div class="card">
      <h2>逐题回看</h2>
      <div class="qnav">${r.ids.map((id,ix)=>{
        const x = DB.rec[id]||{};
        const ok = x.last && x.last.split("").sort().join("")===BYID[id].ans.split("").sort().join("");
        return `<button class="${ok?"done":""}" style="${ok?"":"background:var(--bad-soft);border-color:#fee2e2;color:var(--bad)"}" data-act="review" data-id="${id}">${ix+1}</button>`;
      }).join("")}</div>
      <div class="hint" style="margin-top:10px">红色是错的，点开看解析。</div>
    </div>
    <button class="btn" data-act="startwrong">去错题本重刷</button>
  </div>`;
}

/* ---------- 单题回看 ---------- */
function viewReview(id){
  const q = BYID[id];
  const x = DB.rec[id] || {};
  const pick = x.last || "";
  const ansSet = q.ans.split("");
  const opts = q.opts.map(([k,t])=>{
    let cls = "opt";
    if(ansSet.includes(k)) cls += " ok";
    else if(pick.includes(k)) cls += " bad";
    return `<div class="${cls}"><span class="k">${k}</span><span class="t">${esc(t)}</span></div>`;
  }).join("");
  return `<div class="topbar"><div class="in"><button class="btn sm ghost" data-act="back">←</button><h1>第${q.set}套 · ${q.type}${q.idx}</h1></div></div>
  <div class="wrap">
    <div class="card">
      <div class="stem">${esc(q.stem)}</div>
      ${(q.stmts&&q.stmts.length)?`<ul class="stmts">${q.stmts.map((s,i)=>`<li>${i+1}. ${esc(s)}</li>`).join("")}</ul>`:""}
      ${opts}
    </div>
    <div class="exp">
      <div class="ans">正确答案 <b>${q.ans}</b>${pick?`　你选的是 ${pick}`:"　<span class='muted'>未作答</span>"}</div>
      <div>${fmtExp(q.exp)}</div>
    </div>
  </div>`;
}

/* ---------- 错题本 ---------- */
function viewWrong(){
  const ids = wrongIds();
  if(!ids.length){
    return `<div class="topbar"><div class="in"><button class="btn sm ghost" data-act="go" data-to="home">←</button><h1>错题本</h1></div></div>
    <div class="wrap"><div class="empty">错题本是空的<br><span class="muted">去练几套，做错的会自动进来</span></div></div>`;
  }
  const list = QUESTIONS.filter(q=>ids.includes(q.id));
  const rows = list.map(q=>{
    const x = DB.rec[q.id];
    const tag = x.guess && x.w===0 ? `<span class="tag" style="color:var(--warn);border-color:#fde68a;background:#fffbeb">蒙对</span>` : "";
    return `<button class="wlist" data-act="review" data-id="${q.id}">
      <div class="txt">
        <div class="muted" style="margin-bottom:3px">第${q.set}套 · ${q.type}${q.idx} ${tag}</div>
        <div class="stem1">${esc(q.stem)}</div>
        <div class="muted" style="margin-top:4px">连对 ${x.streak}/2${x.w>0?` ｜ 错过 ${x.w} 次`:""}</div>
      </div>
      <span class="muted">›</span>
    </button>`;
  }).join("");
  return `<div class="topbar"><div class="in"><button class="btn sm ghost" data-act="go" data-to="home">←</button><h1>错题本 · ${ids.length} 题</h1></div></div>
  <div class="wrap">
    <div class="hint" style="margin-bottom:12px">连对两次自动移出。也可以点进去手动移出。</div>
    ${rows}
    <div class="footbar"><div class="in"><button class="btn primary" data-act="startwrong">开始重刷这 ${ids.length} 题</button></div></div>
  </div>`;
}

/* ---------- 看板 ---------- */
function viewStats(){
  let rows = "";
  SETS.forEach(n=>{
    const ids = setIds(n);
    const a = acc(ids);
    const done = ids.filter(id=>DB.rec[id] && DB.rec[id].a>0).length;
    rows += `<div class="setrow" style="display:block">
      <div class="row" style="justify-content:space-between"><div style="font-weight:600;font-size:14.5px">第 ${n} 套</div>
      <div class="muted">${a?(a*100).toFixed(0)+"%":"未练"}</div></div>
      <div class="bar"><i style="width:${a*100}%;background:${a>=0.8?"var(--ok)":a>=0.6?"var(--brand)":"var(--bad)"}"></i></div>
      <div class="muted" style="margin-top:5px">已练 ${done}/33</div>
    </div>`;
  });
  const singles = QUESTIONS.filter(q=>q.type==="单选").map(q=>q.id);
  const multis = QUESTIONS.filter(q=>q.type==="多选").map(q=>q.id);
  const sa = acc(singles), ma = acc(multis);
  const cnts = {};
  QUESTIONS.forEach(q=>{ const x=DB.rec[q.id]; if(x&&x.w>0) cnts[q.id]=x.w; });
  const worst = Object.entries(cnts).sort((a,b)=>b[1]-a[1]).slice(0,8);
  const worstHtml = worst.length ? worst.map(([id,c])=>{
    const q = BYID[id];
    return `<button class="wlist" data-act="review" data-id="${id}"><div class="txt">
      <div class="muted">第${q.set}套 · ${q.type}${q.idx} ｜ 错 ${c} 次</div>
      <div class="stem1">${esc(q.stem)}</div></div><span class="muted">›</span></button>`;
  }).join("") : `<div class="empty" style="padding:24px 0">还没有错题数据</div>`;
  return `<div class="topbar"><div class="in"><button class="btn sm ghost" data-act="go" data-to="home">←</button><h1>数据看板</h1></div></div>
  <div class="wrap">
    <div class="grid2">
      <div class="stat"><div class="n">${(sa*100).toFixed(0)}%</div><div class="l">单选 16 题</div></div>
      <div class="stat"><div class="n">${(ma*100).toFixed(0)}%</div><div class="l">多选 17 题</div></div>
    </div>
    <div class="card" style="margin-top:12px"><h2>各套正确率</h2>${rows}</div>
    <div class="card"><h2>反复错的题</h2>${worstHtml}</div>
  </div>`;
}

/* ---------- 设置 ---------- */
function viewSettings(){
  const n = Object.keys(DB.rec).length;
  return `<div class="topbar"><div class="in"><button class="btn sm ghost" data-act="go" data-to="home">←</button><h1>设置</h1></div></div>
  <div class="wrap">
    <div class="card">
      <div class="kv"><span>题库</span><span class="muted">2027 肖八 8 套 · 264 题</span></div>
      <div class="kv"><span>已记录题目</span><span class="muted">${n} 题</span></div>
      <div class="kv"><span>模考记录</span><span class="muted">${DB.mocks.length} 次</span></div>
    </div>
    <button class="btn" data-act="export">导出进度（JSON 备份）</button>
    <div style="height:10px"></div>
    <button class="btn" data-act="import">从备份导入</button>
    <div style="height:10px"></div>
    <button class="btn" data-act="reset" style="color:var(--bad)">清空全部进度</button>
    <div class="hint" style="margin-top:20px">
      数据存在这台设备的浏览器本地（localStorage）。清缓存、换手机、换浏览器都不会带过去，建议偶尔导出一次备份。
    </div>
    <input type="file" id="fimp" accept=".json,application/json" style="display:none">
  </div>`;
}

/* ---------- 计时器 ---------- */
let TIMER = null;
function startTimer(){
  stopTimer();
  TIMER = setInterval(()=>{
    const el = $("#timer");
    if(!el || !QUIZ) return;
    const s = Math.round((Date.now()-QUIZ.t0)/1000);
    el.textContent = String(Math.floor(s/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0");
  }, 1000);
}
function stopTimer(){ if(TIMER){ clearInterval(TIMER); TIMER=null; } }

/* ---------- 事件 ---------- */
document.addEventListener("click", e=>{
  const el = e.target.closest("[data-act]");
  if(!el) return;
  const act = el.dataset.act;

  if(act==="go"){
    stopTimer();
    if(el.dataset.to==="picker"){ go("picker",{mode:el.dataset.mode}); }
    else { go(el.dataset.to); }
    return;
  }
  if(act==="quit"){ stopTimer(); if(QUIZ && QUIZ.mode==="mock" && !confirm("退出会丢掉这次模考记录，确定？")) return; go("home"); return; }
  if(act==="back"){ go("home"); return; }
  if(act==="tab"){ ROUTE.tab = el.dataset.tab; render(); window.scrollTo(0,0); return; }

  if(act==="start"){
    const n = +el.dataset.set, mode = el.dataset.mode;
    const ids = setIds(n);
    if(mode==="practice"){ const un = ids.filter(id=>DB.rec[id]&&DB.rec[id].a>0).length; if(un>0 && !confirm(`第${n}套已练过 ${un} 题，重做会覆盖记录，继续？`)) return; }
    startQuiz(mode, ids, n);
    return;
  }

  if(act==="startwrong"){
    const ids = wrongIds();
    if(!ids.length){ alert("错题本是空的"); return; }
    startQuiz("wrong", ids, 0);
    return;
  }

  if(act==="opt"){
    if(!QUIZ) return;
    const q = curQ();
    if(QUIZ.mode!=="mock" && QUIZ.judged[q.id]) return;
    const k = el.dataset.k;
    const cur = QUIZ.picks[q.id] || "";
    if(q.type==="单选"){ QUIZ.picks[q.id] = k; }
    else { QUIZ.picks[q.id] = cur.includes(k) ? cur.split("").filter(x=>x!==k).join("") : (cur+k).split("").sort().join(""); }
    if(QUIZ.mode!=="mock" && q.type==="单选"){ judgeCurrent(false); }
    else render();
    return;
  }

  if(act==="judge"){ if(QUIZ && QUIZ.picks[curQ().id]) judgeCurrent(false); return; }
  if(act==="next"){ if(QUIZ) nextQ(); return; }
  if(act==="prev"){ if(QUIZ && QUIZ.i>0){ QUIZ.i--; render(); window.scrollTo(0,0);} return; }
  if(act==="jump"){ if(QUIZ){ QUIZ.i = +el.dataset.ix; render(); window.scrollTo(0,0);} return; }
  if(act==="submit"){ if(QUIZ) submitMock(); return; }

  if(act==="guess"){
    const x = rec(el.dataset.id);
    x.guess = !x.guess;
    if(!x.guess && x.w===0) { /* 撤销蒙标记后若没错过，不留在错题本 */ }
    save(); render();
    return;
  }

  if(act==="review"){ const id = el.dataset.id; $("#app").innerHTML = viewReview(id); window.scrollTo(0,0); return; }

  if(act==="export"){
    const blob = new Blob([JSON.stringify(DB)], {type:"application/json"});
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "肖八刷题备份-"+new Date().toISOString().slice(0,10)+".json";
    a.click();
    setTimeout(()=>URL.revokeObjectURL(a.href), 3000);
    return;
  }
  if(act==="import"){
    const inp = $("#fimp");
    inp.onchange = ()=>{
      const f = inp.files[0];
      if(!f) return;
      const fr = new FileReader();
      fr.onload = ()=>{
        try{
          const o = JSON.parse(fr.result);
          if(!o.rec) throw new Error("格式不对");
          if(!confirm("导入会覆盖当前进度，确定？")) return;
          DB = { v:1, rec:o.rec||{}, mocks:o.mocks||[] };
          save(); render(); alert("导入成功");
        }catch(err){ alert("导入失败："+err.message); }
      };
      fr.readAsText(f);
    };
    inp.click();
    return;
  }
  if(act==="reset"){
    if(!confirm("清空所有答题记录和错题本？题库不会删。")) return;
    if(!confirm("再确认一次：这个操作没法撤销。")) return;
    DB = blank(); save(); render();
    return;
  }
});

/* 键盘：A/B/C/D 选择，Enter 提交/下一题 */
document.addEventListener("keydown", e=>{
  if(ROUTE.name!=="quiz" || !QUIZ) return;
  const k = e.key.toUpperCase();
  if("ABCD".includes(k)){
    const q = curQ();
    if(QUIZ.mode!=="mock" && QUIZ.judged[q.id]) return;
    const cur = QUIZ.picks[q.id] || "";
    if(q.type==="单选") QUIZ.picks[q.id] = k;
    else QUIZ.picks[q.id] = cur.includes(k) ? cur.split("").filter(x=>x!==k).join("") : (cur+k).split("").sort().join("");
    if(QUIZ.mode!=="mock" && q.type==="单选") judgeCurrent(false); else render();
    e.preventDefault();
  } else if(e.key==="Enter"){
    const q = curQ();
    if(QUIZ.mode==="mock"){ if(QUIZ.i<QUIZ.ids.length-1){ QUIZ.i++; render(); window.scrollTo(0,0);} }
    else if(QUIZ.judged[q.id]) nextQ();
    else if(QUIZ.picks[q.id]) judgeCurrent(false);
    e.preventDefault();
  }
});

/* 启动 */
render();
</script>
</body>
</html>
