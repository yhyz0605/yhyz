<div id="app"></div>
<script>
"use strict";
const QUESTIONS = JSON.parse("[{\"id\":\"第1套-单选1\",\"set\":1,\"type\":\"单选\",\"idx\":1,\"no\":1,\"stem\":\"“竹外桃花三两枝，春江水暖鸭先知。”苏轼这句优美的诗句描绘了春回大地、万物复苏之间的关系，竹林、桃花、江水、鸭子等诸多事物共同构成了一幅春天的画卷。从唯物辩证法的角度看，这一诗句蕴含的哲理是（　）\",\"opts\":[[\"A\",\"世界是一个普遍联系的有机整体\"],[\"B\",\"任何两个事物之间都存在着因果关系\"],[\"C\",\"事物之间的联系都是人们感知之后才形成的\"],[\"D\",\"多样的事物之间存在着普遍的、无条件的联系\"]],\"ans\":\"A\",\"exp\":\"联系具有普遍性。整个世界是相互联系的统一整体。从无机界到有机界，从自然界到人类社会，任何事物都处在普遍联系、相互作用之中。A 正确。世界上的事物是多样的，事物之间的联系也是多样的。事物联系的主要方式有直接联系与间接联系、内部联系与外部联系、本质联系与非本质联系、必然联系与偶然联系等。只有引起和被引起的联系才是因果关系。B 错误。联系具有客观性。事物的联系是事物本身所固有的、不以人的意志为转移的。C 错误。联系具有条件性。联系是矛盾着的事物的联系，联系是有条件的。条件是对事物存在和发展发生作用的诸要素的总和。D 错误。\"},{\"id\":\"第1套-单选3\",\"set\":1,\"type\":\"单选\",\"idx\":3,\"no\":3,\"stem\":\"在资本主义商品生产条件下，单个资本家改进技术、改善管理的主观动机是（　）\",\"opts\":[[\"A\",\"增加必要劳动时间\"],[\"B\",\"降低资本有机构成\"],[\"C\",\"追求超额剩余价值\"],[\"D\",\"获取相对剩余价值\"]],\"ans\":\"C\",\"exp\":\"在资本主义商品生产条件下，单个资本家改进技术、改善管理的主观动机是追求超额剩余价值，但其客观后果则是整个社会各个生产部门的劳动生产率普遍提高，导致生活资料的价值下降和补偿劳动力价值的必要劳动时间缩短，从而相对延长了剩余劳动时间，在整个资本家阶级范围内普遍获得了相对剩余价值。C 正确，A、D 错误。在资本有机构成提高的前提下，资本有机构成是上升的趋势。B 错误。\"},{\"id\":\"第1套-单选7\",\"set\":1,\"type\":\"单选\",\"idx\":7,\"no\":7,\"stem\":\"2026 年 10 月 26 日至 29 日，中国共产党第二十届中央委员会第五次全体会议胜利举行。全会深刻总结新时代全面从严治党伟大成就和宝贵经验，审议通过了《中共中央关于持之以恒推进全面从严治党若干重大问题的决定》，就持之以恒推进全面从严治党作出战略部署。《决定》明确指出，全面从严治党的根本性任务是（　）\",\"opts\":[[\"A\",\"从严治吏\"],[\"B\",\"增强党性\"],[\"C\",\"正风肃纪\"],[\"D\",\"加强党内法规制度建设\"]],\"ans\":\"B\",\"exp\":\"《中共中央关于持之以恒推进全面从严治党若干重大问题的决定》指出，增强党性是全面从严治党的根本性任务。必须坚持不懈用习近平新时代中国特色社会主义思想凝心铸魂，把政治修养摆在党性修养的首位，引导党员、干部坚定理想信念、牢记初心使命、严守政治纪律和政治规矩，自觉做共产主义远大理想和中国特色社会主义共同理想的坚定信仰者和忠实实践者。B 正确，A、C、D 不符合题意。\"},{\"id\":\"第1套-单选8\",\"set\":1,\"type\":\"单选\",\"idx\":8,\"no\":8,\"stem\":\"生态安全是总体国家安全观的重要组成部分，关乎民族永续生存、经济社会可持续发展及全球生态稳定。在维护国家生态安全中，居于首要地位的是（　）\",\"opts\":[[\"A\",\"碳达峰碳中和\"],[\"B\",\"自然保护地\"],[\"C\",\"生物多样性保护\"],[\"D\",\"大规模国土绿化\"]],\"ans\":\"B\",\"exp\":\"自然保护地是生态建设的核心载体，在维护国家生态安全中居于首要地位。B 正确，A、C、D 不符合题意。\"},{\"id\":\"第1套-单选11\",\"set\":1,\"type\":\"单选\",\"idx\":11,\"no\":11,\"stem\":\"近代中国的社会性质和主要矛盾，决定了中国革命仍然是资产阶级民主革命。但中国资产阶级民主革命不同于一般的资产阶级民主革命，经历了从旧民主主义革命向新民主主义革命的转变，具有鲜明的时代特征。标志着中国资产阶级民主革命的时代背景发生了根本转换的历史事件是（　）\",\"opts\":[[\"A\",\"辛亥革命的爆发\"],[\"B\",\"中国共产党成立\"],[\"C\",\"俄国十月革命\"],[\"D\",\"护法运动的失败\"]],\"ans\":\"C\",\"exp\":\"俄国十月革命是一个具有划时代意义的世界性历史事件，以此为标志，中国资产阶级民主革命的时代背景发生了根本转换。从鸦片战争到辛亥革命期间，中国人民在不同时期和不同程度上进行的反帝反封建的斗争，属于旧式民主主义革命的范畴。俄国十月革命的胜利，改变了整个世界历史的方向。C 正确。A、B、D 错误。\"},{\"id\":\"第1套-单选12\",\"set\":1,\"type\":\"单选\",\"idx\":12,\"no\":12,\"stem\":\"1947 年 6 月底，根据中共中央的决策和部署，刘伯承、邓小平率领的晋冀鲁豫野战军主力，实施中央突破，千里跃进大别山。随后，陈毅、粟裕指挥的华东野战军主力为东路，挺进苏鲁豫皖地区。陈赓、谢富治指挥的晋冀鲁豫野战军一部为西路，挺进豫西。三路大军相互策应，机动歼敌，这标志着（　）\",\"opts\":[[\"A\",\"蒋介石 20 年反革命统治由发展到消灭的转折点\"],[\"B\",\"人民解放战争战略进攻的序幕由此揭开\"],[\"C\",\"人民解放军在数量上已经超过国民党军队\"],[\"D\",\"100 多年来帝国主义在中国的统治由发展到消灭的转折点\"]],\"ans\":\"B\",\"exp\":\"1947 年 6 月，中共中央当机立断，决定不等完全粉碎敌人的战略进攻，不等解放军在数量上占有优势，立刻转入全国性反攻，以主力打到外线去，将战争引向国民党统治区域。根据中共中央的决策和部署，刘伯承、邓小平率领的晋冀鲁豫野战军主力，实施中央突破，千里跃进大别山。随后，陈毅、粟裕指挥的华东野战军主力为东路，挺进苏鲁豫皖地区。陈赓、谢富治指挥的晋冀鲁豫野战军一部为西路，挺进豫西。三路大军相互策应，机动歼敌。它们调动和吸引国民党军南线全部兵力 160 多个旅中约 90 个旅于自己周围，迫使国民党军处于被动地位。人民解放战争战略进攻的序幕由此揭开。B 正确，C 错误。\\n1947 年 12 月，中共中央在陕北米脂县杨家沟召开会议，制定了夺取全国胜利的行动纲领。毛泽东指出，中国革命已经发展到了一个历史的转折点。这是蒋介石 20 年反革命统治由发展到消灭的转折点，这是 100 多年来帝国主义在中国的统治由发展到消灭的转折点。A、D 错误。\"},{\"id\":\"第1套-单选13\",\"set\":1,\"type\":\"单选\",\"idx\":13,\"no\":13,\"stem\":\"1984 年 10 月，党的十二届三中全会通过《中共中央关于经济体制改革的决定》。会后，经济体制改革以城市为重点全面展开。改革的中心环节是（　）\",\"opts\":[[\"A\",\"完善家庭联产承包责任制\"],[\"B\",\"全面推进价格改革\"],[\"C\",\"确认私营经济的法律地位\"],[\"D\",\"增强全民所有制企业的活力\"]],\"ans\":\"D\",\"exp\":\"1984 年 10 月，党的十二届三中全会通过《中共中央关于经济体制改革的决定》（以下简称《决定》）。《决定》突破把计划经济同商品经济对立起来的观点，指出我国社会主义经济是在公有制基础上的有计划的商品经济；《决定》突破了把全民所有同国家机构直接经营企业混为一谈的传统观念，提出“所有权同经营权是可以适当分开的”。这是党中央在计划与市场关系问题上取得的新认识。会后，经济体制改革以城市为重点全面展开。改革的中心环节是增强全民所有制企业的活力，其中一项措施是推行承包经营责任制。D 正确。\\n按照党的十三大的部署，1988 年经济体制改革以深化企业经营机制改革为重点。这年 2 月，国务院颁布《全民所有制工业企业承包经营责任制暂行条例》。4 月，七届全国人大一次会议通过《中华人民共和国全民所有制工业企业法》，对企业所有权和经营权“两权分离”的改革原则作了更为明确的规定。会议通过的宪法修正案规定：“国家允许私营经济在法律规定的范围内存在和发展。私营经济是社会主义公有制经济的补充。”私营经济的法律地位得到确认。C 错误。1988 年夏季准备进行“价格闯关”，全面推进价格改革，放开价格。B 错误。A 对应的是农村改革，显然错误。\"},{\"id\":\"第1套-多选4\",\"set\":1,\"type\":\"多选\",\"idx\":4,\"no\":20,\"stem\":\"垄断利润主要是通过垄断组织制定的垄断价格来实现的。垄断组织操纵价格带来的结果是抑制了市场上价格的自由波动，垄断价格一定时期内背离生产价格和价值。但是，垄断价格的产生没有否定价值规律，这是因为，从全社会看（　）\",\"opts\":[[\"A\",\"整个社会商品的价值仍然是由生产它们的社会必要劳动时间决定的\"],[\"B\",\"垄断低价低于原材料生产价格的部分和垄断高价高于出售商品生产价格的部分能够相抵\"],[\"C\",\"垄断价格既不能增加也不能减少整个社会所生产的价值总量\"],[\"D\",\"商品的价格总额仍然等于商品的价值总额\"]],\"ans\":\"ACD\",\"exp\":\"垄断价格的产生没有否定价值规律，它是价值规律在垄断资本主义阶段作用的具体体现。首先，垄断价格的制定并不能完全脱离价值，价值仍然是价格的基础。垄断组织虽然能够通过垄断高价或垄断低价获取高额利润，但整个社会商品的价值仍然是由生产它们的社会必要劳动时间决定的。A 正确。其次，垄断价格既不能增加也不能减少整个社会所生产的价值总量，它只是对商品价值和剩余价值作了有利于垄断资本的再分配。C 正确。最后，从全社会来看，商品的价格总额仍然等于商品的价值总额。D 正确。垄断价格并不是指垄断高价和垄断低价正好相抵。实际上，垄断高价高于生产价格和价值的部分，未必与垄断低价低于生产价格和价值的部分完全相等。非垄断企业的利润向垄断企业转移，也不一定表现为“相抵”。B 错误。\"},{\"id\":\"第1套-多选5\",\"set\":1,\"type\":\"多选\",\"idx\":5,\"no\":21,\"stem\":\"1921 年 3 月，俄共（布）召开十大，毅然决定从战时共产主义政策过渡到实行新经济政策。这一决定表明，列宁的社会主义建设思想发生了重大转变，对俄国这样一个小农经济占优势的国家如何走向社会主义又有了新的认识。新经济政策的主要内容有（　）\",\"opts\":[[\"A\",\"用粮食税制取代余粮收集制\"],[\"B\",\"允许私人自由贸易，恢复商品货币关系\"],[\"C\",\"允许私人小工业企业发展\"],[\"D\",\"采取一些国家资本主义的形式来发展生产\"]],\"ans\":\"ABCD\",\"exp\":\"1921 年 3 月，俄共（布）召开十大，毅然决定从战时共产主义政策过渡到实行新经济政策。新经济政策的主要内容有：用粮食税制取代余粮收集制，允许私人自由贸易，恢复商品货币关系，允许私人小工业企业发展，采取一些国家资本主义的形式来发展生产。A、B、C、D 全选。\"},{\"id\":\"第1套-多选6\",\"set\":1,\"type\":\"多选\",\"idx\":6,\"no\":22,\"stem\":\"从中华人民共和国成立到社会主义改造基本完成，是我国从新民主主义到社会主义的过渡时期。这一时期，我国社会的性质是新民主主义社会。新民主主义社会不是一个独立的社会形态，而是由新民主主义向社会主义转变的过渡性社会形态。新民主主义社会要继续向前发展，就要（　）\",\"opts\":[[\"A\",\"不断扩大国营经济\"],[\"B\",\"逐步将资本主义经济和个体经济改变为社会主义经济\"],[\"C\",\"使合作社经济逐步成为我国的经济基础\"],[\"D\",\"彻底废除列强强加给中国的不平等条约和帝国主义在中国的一切特权\"]],\"ans\":\"AB\",\"exp\":\"在新民主主义社会中，存在着五种经济成分，即社会主义性质的国营经济、半社会主义性质的合作社经济、农民和手工业者的个体经济、私人资本主义经济和国家资本主义经济。其中，主要的经济成分是三种：社会主义经济、个体经济和资本主义经济。由于社会主义经济和资本主义经济以及个体经济之间的矛盾，新民主主义社会要继续向前发展，就要不断扩大国营经济，同时逐步将资本主义经济和个体经济改变为社会主义经济，使社会主义经济逐步成为我国的经济基础。A、B 正确，C 错误。D 属于民主革命的任务，在过渡时期之前和建国初期即已基本解决，不属于新民主主义向社会主义转变的要求。\"},{\"id\":\"第1套-多选8\",\"set\":1,\"type\":\"多选\",\"idx\":8,\"no\":24,\"stem\":\"习近平总书记深刻指出：“共产党人必须牢记，为民造福是最大政绩。”2026 年全国两会期间，总书记再次叮嘱：“踏踏实实干事创业，努力创造经得起实践、人民、历史检验的实绩。”为民造福是最大政绩，这是因为（　）\",\"opts\":[[\"A\",\"民心是最大的政治\"],[\"B\",\"经济发展是政绩观的首要问题\"],[\"C\",\"全心全意为人民服务是我们党一切行动的根本出发点和落脚点\"],[\"D\",\"人民对美好生活的向往就是我们的奋斗目标\"]],\"ans\":\"ACD\",\"exp\":\"民心是最大的政治，决定事业兴衰成败。为民造福是最大政绩，这是因为全心全意为人民服务是我们党一切行动的根本出发点和落脚点，人民对美好生活的向往就是我们的奋斗目标。A、C、D 正确。习近平总书记指出：“政绩观问题是一个根本性问题，关乎立党为公、执政为民。”“为谁创造业绩、创造什么样的业绩、怎样创造业绩”是政绩观的核心问题，B 表述错误。\"},{\"id\":\"第1套-多选11\",\"set\":1,\"type\":\"多选\",\"idx\":11,\"no\":27,\"stem\":\"90 年前，我们党领导中国工农红军胜利完成震撼世界、彪炳史册的长征。这一伟大胜利，是中华民族伟大复兴历史进程中的巍峨丰碑。习近平总书记在纪念中国工农红军长征胜利 90 周年大会上的讲话中指出，对于红军长征胜利具有决定性意义的是（　）\",\"opts\":[[\"A\",\"革命理想、革命信念\"],[\"B\",\"党的正确领导\"],[\"C\",\"广大人民群众的支持\"],[\"D\",\"毛泽东同志核心地位的确立\"]],\"ans\":\"BD\",\"exp\":\"习近平总书记在纪念中国工农红军长征胜利 90 周年大会上的讲话中指出，长征胜利，靠的是党的正确领导，靠的是毛泽东同志核心地位的确立。在极端危急的关头，遵义会议事实上确立了毛泽东同志在党中央和红军的领导地位，开始确立以毛泽东同志为主要代表的马克思主义正确路线在党中央的领导地位，开始形成以毛泽东同志为核心的党的第一代中央领导集体，这是我们党历史上一个生死攸关的转折点。党的正确领导和毛泽东同志核心地位的确立，对于红军长征胜利具有决定性意义。B、D 正确，A、C 虽然也是长征胜利的重要因素，但不符合讲话中关于“决定性意义”的特定表述。\"},{\"id\":\"第1套-多选12\",\"set\":1,\"type\":\"多选\",\"idx\":12,\"no\":28,\"stem\":\"1936 年 12 月 12 日，张学良、杨虎城为实现停止内战、一致抗日，发动西安事变。中国共产党以中华民族团结抗日大局为重，独立自主确定了用和平方式解决西安事变的方针。西安事变的和平解决（　）\",\"opts\":[[\"A\",\"成为时局转换的枢纽\"],[\"B\",\"促进了中共中央逼蒋抗日方针的实现\"],[\"C\",\"粉碎了亲日派和日本帝国主义者的阴谋\"],[\"D\",\"标志着以国共两党第二次合作为基础的抗日民族统一战线正式形成\"]],\"ans\":\"ABC\",\"exp\":\"西安事变的和平解决，成为时局转换的枢纽，它粉碎了亲日派和日本帝国主义者的阴谋，促进了中共中央逼蒋抗日方针的实现。从此，十年内战的局面基本结束，国内和平初步实现。A、B、C 正确。1937 年 9 月，国民党中央通讯社发表《中共中央为公布国共合作宣言》，蒋介石发表实际上承认中国共产党合法地位的谈话，标志着以国共两党第二次合作为基础的抗日民族统一战线正式形成。D 错误。\"},{\"id\":\"第1套-多选15\",\"set\":1,\"type\":\"多选\",\"idx\":15,\"no\":31,\"stem\":\"习近平法治思想是一个内涵丰富、博大精深、不断发展的科学理论体系。《习近平法治思想学习纲要（2025 年版）》将“坚持依法治国和依规治党有机统一”作为习近平法治思想核心要义的“第十二个坚持”，这一重大命题（　）\",\"opts\":[[\"A\",\"表明依法治国和依规治党具有同等的法律效力和适用范围\"],[\"B\",\"开辟全面从严治党和全面依法治国新境界\"],[\"C\",\"为党长期执政和国家长治久安提供新方案\"],[\"D\",\"为创造人类法治文明新形态贡献中国智慧和中国方案\"]],\"ans\":\"BCD\",\"exp\":\"坚持依法治国和依规治党有机统一，这是习近平法治思想的重要创新成果。这一重大命题开辟了全面从严治党和全面依法治国新境界，为党长期执政和国家长治久安提供新方案，为创造人类法治文明新形态贡献中国智慧和中国方案。B、C、D 正确。依法治国依据的是国家宪法和法律，适用于全体公民和所有国家机关等；依规治党依据的是党章和党内法规，适用于各级党组织和全体党员。二者在效力属性和适用范围上存在明显区别，并非具有“同等的法律效力和适用范围”。A 错误。\"},{\"id\":\"第1套-多选16\",\"set\":1,\"type\":\"多选\",\"idx\":16,\"no\":32,\"stem\":\"2026 年 10 月 26 日至 29 日，中国共产党第二十届中央委员会第五次全体会议胜利举行。全会深刻总结新时代全面从严治党伟大成就和宝贵经验，审议通过了《中共中央关于持之以恒推进全面从严治党若干重大问题的决定》，就持之以恒推进全面从严治党作出战略部署。全会指出，持之以恒推进全面从严治党，要着眼于（　）\",\"opts\":[[\"A\",\"提高党的长期执政能力\"],[\"B\",\"保持党的先进性和纯洁性\"],[\"C\",\"继续发扬理论联系实际的学风\"],[\"D\",\"保持党同人民群众的血肉联系\"]],\"ans\":\"ABD\",\"exp\":\"党的二十届五中全会指出，持之以恒推进全面从严治党，要着眼于提高党的长期执政能力、保持党的先进性和纯洁性、保持党同人民群众的血肉联系。A、B、D 正确。C 项“继续发扬理论联系实际的学风”不是全会强调的全面从严治党“着眼于”的三大核心目标，不选。\"},{\"id\":\"第2套-单选1\",\"set\":2,\"type\":\"单选\",\"idx\":1,\"no\":1,\"stem\":\"餐饮消费、网购体验、旅游出行……如今，避雷帖在社交平台俯拾皆是，甚至有人说，不管你在网上搜什么东西，不管这个东西总体好评率是高是低，总能碰到避雷帖。在价值评价活动中，评价的差异性是无法避免的，这是因为（ ）\",\"opts\":[[\"A\",\"客体能否满足主体需要，是由人的主观愿望决定的\"],[\"B\",\"价值评价有科学与非科学之别，但评价结果没有正确与错误之分\"],[\"C\",\"主体以自身的需要作为内在尺度运用于所评价的客体\"],[\"D\",\"价值始终以主体为中心，无法独立于人们对它的认识和评价\"]],\"ans\":\"C\",\"exp\":\"价值评价是一种关于价值现象的认识活动，其特点之一是评价以主客体的价值关系为认识对象。在价值评价活动中，主体总是以自身的需要作为内在尺度运用于所评价的客体，因此不同主体的评价结果往往存在差异性。C 正确。客体能否满足主体需要是由客体本身的属性和主体的客观需要共同决定的，并非由人的主观愿望决定，A 错误。价值评价有科学与非科学之别，评价结果也有正确与错误之分，B 错误。价值是客观的，不以人的主观认识和评价为转移，D 错误。\"},{\"id\":\"第2套-单选2\",\"set\":2,\"type\":\"单选\",\"idx\":2,\"no\":2,\"stem\":\"马克思主义正确阐释了社会形态的演进过程及其历史必然性问题，正确评价了历史和现实中的事件、人物以及各种社会集团的理论、主张等，为正确认识社会和历史提供了基本观点和方法。被列宁称为“社会进步的最高标准”的是（ ）\",\"opts\":[[\"A\",\"生产力发展\"],[\"B\",\"科学技术进步\"],[\"C\",\"人的普遍觉醒\"],[\"D\",\"共同富裕\"]],\"ans\":\"A\",\"exp\":\"生产力是社会发展的最终决定力量，也是衡量社会进步的根本尺度。列宁明确指出，生产力发展是“社会进步的最高标准”。A 正确，B、C、D 不符合题意。\"},{\"id\":\"第2套-单选4\",\"set\":2,\"type\":\"单选\",\"idx\":4,\"no\":4,\"stem\":\"进入 21 世纪以来，随着经济全球化的深入发展，新一轮科技革命和产业变革进入空前密集活跃期，社会化大生产在世界范围内更大规模、更广范围、更深层次展开，世界格局深度调整，资本主义呈现出一些新变化、新特征。当代资本主义最突出、最鲜明、最主要的特征是（ ）\",\"opts\":[[\"A\",\"产业结构的调整和新经济形态的出现\"],[\"B\",\"社会阶级层级结构呈现复杂性、多样化\"],[\"C\",\"发达资本主义国家在世界范围内推行霸权主义和强权政治\"],[\"D\",\"国际金融资本的垄断\"]],\"ans\":\"D\",\"exp\":\"国际金融资本的垄断是当代资本主义最突出、最鲜明、最主要的特征。D 正确，A、B、C 均非最突出、最鲜明、最主要的特征。\"},{\"id\":\"第2套-单选5\",\"set\":2,\"type\":\"单选\",\"idx\":5,\"no\":5,\"stem\":\"中国民主主义革命经历了旧民主主义革命和新民主主义革命两个阶段，由“旧”阶段转变到“新”阶段的根本标志是（ ）\",\"opts\":[[\"A\",\"中国革命基本性质的变化\"],[\"B\",\"中国革命主要对象的变化\"],[\"C\",\"中国革命领导阶级的变化\"],[\"D\",\"中国社会主要矛盾的变化\"]],\"ans\":\"C\",\"exp\":\"旧民主主义革命由资产阶级领导，新民主主义革命由无产阶级及其政党中国共产党领导。中国革命领导阶级的变化，即无产阶级取代资产阶级成为革命的领导阶级，是由旧民主主义革命转变到新民主主义革命的根本标志。C 正确，A、B、D 错误。\"},{\"id\":\"第2套-单选6\",\"set\":2,\"type\":\"单选\",\"idx\":6,\"no\":6,\"stem\":\"1937 年，毛泽东在《实践论》和《矛盾论》等著作中，深刻阐述了理论对于实践的依赖关系，以及矛盾的普遍性和特殊性的关系，对党的思想路线作了系统的哲学论证。毛泽东这样做的目的主要是（ ）\",\"opts\":[[\"A\",\"揭示教条主义错误的思想根源\"],[\"B\",\"把党的正确主张变为群众的自觉行动\"],[\"C\",\"为党的七大胜利召开创造充分条件\"],[\"D\",\"系统地说明党的政治策略上的诸问题\"]],\"ans\":\"A\",\"exp\":\"1937 年，毛泽东撰写《实践论》和《矛盾论》，从马克思主义认识论和辩证法的高度，总结中国革命的历史经验教训，主要目的是揭露和批判党内曾经存在的教条主义错误的思想根源，确立实事求是的思想路线。A 正确，B、C、D 不符合题意。\"},{\"id\":\"第2套-单选7\",\"set\":2,\"type\":\"单选\",\"idx\":7,\"no\":7,\"stem\":\"“六个必须坚持”，即必须坚持人民至上、必须坚持自信自立、必须坚持守正创新、必须坚持问题导向、必须坚持系统观念、必须坚持胸怀天下，是习近平新时代中国特色社会主义思想的世界观、方法论和贯穿其中的立场观点方法的重要体现。其中，坚持守正创新是（ ）\",\"opts\":[[\"A\",\"根本价值立场\"],[\"B\",\"内在精神特质\"],[\"C\",\"鲜明理论品格\"],[\"D\",\"重要实践要求\"]],\"ans\":\"C\",\"exp\":\"在“六个必须坚持”中，坚持人民至上是根本价值立场，坚持自信自立是内在精神特质，坚持守正创新是鲜明理论品格，坚持问题导向是重要实践要求，坚持系统观念是基本思想和工作方法，坚持胸怀天下是中国共产党人的宏阔视野。C 正确。\"},{\"id\":\"第2套-单选10\",\"set\":2,\"type\":\"单选\",\"idx\":10,\"no\":10,\"stem\":\"《海国图志》和《资政新篇》的相似之处在于都主张（ ）\",\"opts\":[[\"A\",\"进行政治、经济、文化制度的改革\"],[\"B\",\"向西方学习\"],[\"C\",\"进行资产阶级思想启蒙运动\"],[\"D\",\"在中国发展资本主义\"]],\"ans\":\"B\",\"exp\":\"魏源的《海国图志》主张“师夷长技以制夷”，洪仁玕的《资政新篇》是中国近代史上第一个比较系统的发展资本主义的方案，二者的相似之处在于都主张向西方学习。B 正确。《海国图志》仅主张学习西方军事和科学技术，不涉及政治制度改革和发展资本主义，A、C、D 均不符合。\"},{\"id\":\"第2套-单选11\",\"set\":2,\"type\":\"单选\",\"idx\":11,\"no\":11,\"stem\":\"1940 年，毛泽东在《新民主主义论》中指出，“孙中山先生之所以伟大，不但因为他领导了伟大的辛亥革命（虽然是旧时期的民主革命），而且因为他能够‘适乎世界之潮流，合乎人群之需要’”。毛泽东这里所说的“适乎世界之潮流，合乎人群之需要”，是指孙中山（ ）\",\"opts\":[[\"A\",\"喊出了“振兴中华”这个时代的最强音\"],[\"B\",\"以鲜明的中国革命民主派立场同中国改良派作了尖锐的斗争\"],[\"C\",\"在辛亥革命时期，领导人民推翻帝制、建立共和国\"],[\"D\",\"提出了联俄、联共、扶助农工三大革命政策，对三民主义作了新的解释\"]],\"ans\":\"D\",\"exp\":\"毛泽东在《新民主主义论》中紧接着这句话指出，孙中山先生能够“适乎世界之潮流，合乎人群之需要，提出了联俄、联共、扶助农工三大革命政策，对三民主义作了新的解释，树立了三大政策的新三民主义”。D 正确。\"},{\"id\":\"第2套-单选13\",\"set\":2,\"type\":\"单选\",\"idx\":13,\"no\":13,\"stem\":\"1950 年至 1953 年春，土地改革在新解放区进行。《中华人民共和国土地改革法》规定了这次土改的目的，是废除地主阶级封建剥削的土地所有制，实行农民的土地所有制，解放农村生产力，发展农业生产，为新中国的工业化开辟道路。与解放战争时期的土改相比，这次土改在政策上的一个大的变化是（ ）\",\"opts\":[[\"A\",\"由实行减租减息政策改变为实现“耕者有其田”的政策\"],[\"B\",\"由“没收一切土地”改为“没收一切公共土地及地主阶级的土地”\"],[\"C\",\"由对富农征收多余的土地财产改变为保存富农经济\"],[\"D\",\"由削弱封建剥削向变革封建土地关系、废除封建剥削制度过渡\"]],\"ans\":\"C\",\"exp\":\"解放战争时期的《中国土地法大纲》规定征收富农多余的土地财产；1950 年《中华人民共和国土地改革法》则规定保存富农经济、在政治上中立富农，以利于孤立地主、减少土改阻力、迅速恢复和发展农村经济。C 正确。A、D 是抗战时期向解放战争时期转变的政策变化，B 是土地革命时期的政策调整。\"},{\"id\":\"第2套-单选14\",\"set\":2,\"type\":\"单选\",\"idx\":14,\"no\":14,\"stem\":\"法治宣传教育是全面依法治国的长期基础性工作。2026 年 7 月，中共中央、国务院转发了《中央宣传部、司法部关于开展法治宣传教育的第九个五年规划（2026-2030 年）》，对法治宣传教育作出新的全面部署。《规划》指出，“九五”普法的首要任务是（ ）\",\"opts\":[[\"A\",\"推动习近平法治思想深入人心\"],[\"B\",\"贯彻实施法治宣传教育法\"],[\"C\",\"繁荣发展社会主义法治文化\"],[\"D\",\"健全法治宣传教育工作体系\"]],\"ans\":\"A\",\"exp\":\"“九五”普法规划明确指出，要坚持把学习宣传习近平法治思想作为首要任务，推动习近平法治思想深入人心。A 正确。\"},{\"id\":\"第2套-单选16\",\"set\":2,\"type\":\"单选\",\"idx\":16,\"no\":16,\"stem\":\"2026 年 9 月 12 日，国家主席习近平在金砖国家领导人第十八次会晤第一阶段会议上发表的题为《共担时代责任 勇做先锋力量》的讲话中指出，2026 年是金砖国家合作 20 周年。20 年来，金砖合作机制不断发展壮大，展现出蓬勃生机活力，成为当今世界最具影响力的新兴市场和发展中国家合作平台。二十年风雨兼程，始终是金砖事业发展力量之源的是（ ）\",\"opts\":[[\"A\",\"尊重彼此核心关切\"],[\"B\",\"团结合作\"],[\"C\",\"坦诚相待\"],[\"D\",\"求同存异\"]],\"ans\":\"B\",\"exp\":\"习近平主席在讲话中指出，二十年风雨兼程，团结合作始终是金砖事业发展的力量之源。B 正确。\"},{\"id\":\"第2套-多选1\",\"set\":2,\"type\":\"多选\",\"idx\":1,\"no\":17,\"stem\":\"科技装备强是农业强国的重要特征。田间一线，农民有新烦恼：“‘大家伙’有劲儿，但开不上丘陵田”“种特色瓜果蔬菜，没有好机子，还得靠人工”。缺趁手的“微农机”、特色农机，折射出农机装备的供需错配。2026 年中央一号文件提出，“加快高端智能、丘陵山区适用农机装备研发应用”。面向未来，只有坚持问题导向、创新驱动，方能把握机遇，实现“有机可用”“有好机用”，为保障粮食安全和促进农业生产提质增效提供坚实支撑。用新技术、新场景锻造新农具，说明实践（ ）\",\"opts\":[[\"A\",\"能够满足人们生产劳动资料的需要\"],[\"B\",\"本质上是由认识决定并支配的客观过程\"],[\"C\",\"可以把人脑中观念的存在变为现实的存在\"],[\"D\",\"仅限于生产活动这一种具体形式\"]],\"ans\":\"AC\",\"exp\":\"用新技术、新场景锻造新农具，体现了实践是人类能动地改造世界的社会性的物质活动，能够满足人们生产劳动资料的需要，可以把人脑中观念的存在变为现实的存在，A、C 正确。实践决定认识，而非认识决定实践，B 错误。实践的基本形式包括物质生产实践、社会政治实践和科学文化实践等，并非仅限于生产活动，D 错误。\"},{\"id\":\"第2套-多选2\",\"set\":2,\"type\":\"多选\",\"idx\":2,\"no\":18,\"stem\":\"在重庆南川区，面对“一刀切”难以解决流动摊贩管理问题且易造成居民、商贩与管理部门三方情绪对立的情况，当地推出了限定区域与时间的“潮汐摊区”。执法人员化身摊区管家，城市发展的“面子”与民生需求的“里子”得到兼顾。这一做法表明（ ）\",\"opts\":[[\"A\",\"认识具有反复性和无限性，治理理念需要在实践中不断完善\"],[\"B\",\"系统思维要求我们从整体上把握事物，并实现事物结构与功能的优化\"],[\"C\",\"事物的性质由人的主观意志决定，发挥主观能动性是解决矛盾的关键\"],[\"D\",\"矛盾的斗争性是相对的，可以采用矛盾双方融合成一个新事物的方法解决矛盾\"]],\"ans\":\"AB\",\"exp\":\"从“一刀切”到推出“潮汐摊区”，兼顾城市“面子”与民生“里子”，体现了认识具有反复性和无限性，治理理念需要在实践中不断完善，也体现了系统思维要求从整体上把握事物、优化结构与功能，A、B 正确。事物的性质主要是由主要矛盾的主要方面决定的，而非由人的主观意志决定，具体问题具体分析是正确解决矛盾的关键，C 错误。矛盾的斗争性是绝对的，同一性是相对的，D 错误。\"},{\"id\":\"第2套-多选3\",\"set\":2,\"type\":\"多选\",\"idx\":3,\"no\":19,\"stem\":\"生产商品所需要的社会必要劳动时间随着劳动生产率的变化而变化。劳动生产率的高低可以用（ ）\",\"opts\":[[\"A\",\"单位劳动时间内生产的商品数量来测量\"],[\"B\",\"单位劳动时间内生产的价值总量来测量\"],[\"C\",\"单位劳动时间内劳动者所耗费的劳动量来测量\"],[\"D\",\"单位商品中所耗费的劳动时间来测量\"]],\"ans\":\"AD\",\"exp\":\"劳动生产率是指劳动者生产使用价值的能力，可以用单位劳动时间内生产的商品数量来测量，也可以用单位商品中所耗费的劳动时间来测量，A、D 正确。不管劳动生产率怎么变，同一劳动在同样的时间内创造的价值总量是不变的，因此不能用单位劳动时间内生产的价值总量或耗费的劳动量来测量劳动生产率，B、C 错误。\"},{\"id\":\"第2套-多选4\",\"set\":2,\"type\":\"多选\",\"idx\":4,\"no\":20,\"stem\":\"19 世纪末 20 世纪初，垄断代替自由竞争并占据统治地位，垄断资本主义得以形成。垄断资本的实质在于获取垄断利润，垄断利润（ ）\",\"opts\":[[\"A\",\"主要是通过垄断组织制定的垄断价格来实现的\"],[\"B\",\"归根到底来自其他企业特别是非垄断企业的利润\"],[\"C\",\"可以通过加强对其他国家劳动人民的剥削和掠夺来获取\"],[\"D\",\"是垄断资本家凭借其垄断地位而获得的超过平均利润的高额利润\"]],\"ans\":\"ACD\",\"exp\":\"垄断利润是垄断资本家凭借其在社会生产和流通中的垄断地位而获得的超过平均利润的高额利润，主要是通过垄断组织制定的垄断价格来实现的，可以通过加强对本国无产阶级和其他劳动人民的剥削、加强对其他国家劳动人民的剥削和掠夺等方式获取，A、C、D 正确。垄断利润归根到底来自无产阶级和其他劳动人民所创造的剩余价值，而非来自非垄断企业的利润（只是对非垄断企业利润的再分配属于来源之一，但“归根到底”来自剩余价值），B 错误。\"},{\"id\":\"第2套-多选5\",\"set\":2,\"type\":\"多选\",\"idx\":5,\"no\":21,\"stem\":\"1848 年欧洲革命后，资本主义在各国得到了迅速发展，无产阶级力量不断壮大。到 19 世纪 50 年代末 60 年代初，各国工人运动重新活跃起来，并表现出加强国际联系的愿望。1864 年，国际工人协会（第一国际）应运而生。马克思是第一国际的灵魂。在马克思指导下，第一国际（ ）\",\"opts\":[[\"A\",\"发动并领导了巴黎公社革命\"],[\"B\",\"大力支援各国的工人运动，支持反封建的民主运动和民族解放运动\"],[\"C\",\"促进了马克思主义的传播及其与国际工人运动的结合\"],[\"D\",\"初步确立了马克思主义在工人运动中的指导地位\"]],\"ans\":\"BCD\",\"exp\":\"第一国际大力支援各国工人运动，支持反封建民主运动和民族解放运动，促进了马克思主义的传播及其与国际工人运动的结合，初步确立了马克思主义在工人运动中的指导地位，B、C、D 正确。巴黎公社革命是法国无产阶级自发发动的，并非第一国际发动和领导的，A 错误。\"},{\"id\":\"第2套-多选6\",\"set\":2,\"type\":\"多选\",\"idx\":6,\"no\":22,\"stem\":\"马克思主义是我们立党立国、兴党兴国的根本指导思想。实践告诉我们，中国共产党为什么能，中国特色社会主义为什么好，归根到底是因为马克思主义行，是中国化时代化的马克思主义行。马克思主义中国化时代化，用毛泽东当年的话说，就是“解决中国问题”和“创造些新的东西”。马克思主义中国化时代化，具体说来，就是（ ）\",\"opts\":[[\"A\",\"运用马克思主义的立场、观点和方法，解决中国革命、建设、改革中的实际问题\"],[\"B\",\"总结和提炼中国革命、建设、改革的实践经验并将其上升为理论，赋予马克思主义以新的时代内涵\"],[\"C\",\"运用中国人民喜闻乐见的民族语言来阐述马克思主义，使其植根于中华优秀传统文化的土壤之中，具有中国特色、中国风格、中国气派\"],[\"D\",\"从马克思主义经典著作中寻找解决中国之问、世界之问、人民之问、时代之问的具体方案\"]],\"ans\":\"ABC\",\"exp\":\"马克思主义中国化时代化，就是把马克思主义基本原理同中国具体实际相结合、同中华优秀传统文化相结合，具体包括 A、B、C 三项内容。马克思主义提供的是立场、观点和方法，而不是解决具体问题的现成具体方案，D 错误。\"},{\"id\":\"第2套-多选10\",\"set\":2,\"type\":\"多选\",\"idx\":10,\"no\":26,\"stem\":\"《中华人民共和国国民经济和社会发展第十五个五年规划纲要》设置的 20 项主要指标中，民生指标占比超过 1/3，覆盖就业、收入、教育、健康、养老、托育等人民群众急难愁盼的关键领域。这说明（ ）\",\"opts\":[[\"A\",\"经济发展和社会发展要相辅相成\"],[\"B\",\"制定经济发展政策要同步嵌入改善民生的要求\"],[\"C\",\"制定民生政策要同步考虑促进经济发展的效应\"],[\"D\",\"“十五五”时期的工作重心已从经济发展全面转向民生保障\"]],\"ans\":\"ABC\",\"exp\":\"民生指标占比超过 1/3，说明经济发展和社会发展要相辅相成，制定经济发展政策要同步嵌入改善民生的要求，制定民生政策要同步考虑促进经济发展的效应，A、B、C 正确。以经济建设为中心是兴国之要，工作重心并未从经济发展转向民生保障，D 错误。\"},{\"id\":\"第2套-多选12\",\"set\":2,\"type\":\"多选\",\"idx\":12,\"no\":28,\"stem\":\"从 1934 年 10 月至 1936 年 10 月，我们党领导红军第一、第二、第四方面军和第二十五军，进行了震撼世界、彪炳史册的伟大长征。红军长征纵横十余省，长驱二万五千里，跨越近百条江河，翻越皑皑雪山，穿过茫茫草地，进行 600 余次战役战斗，粉碎上百万敌军围追堵截。红军长征（ ）\",\"opts\":[[\"A\",\"宣告国民党反动派消灭中国共产党和红军的图谋彻底失败\"],[\"B\",\"胜利实现北上抗日的战略转移\"],[\"C\",\"成功开创了中国革命新局面\"],[\"D\",\"标志着党在政治上思想上组织上走向成熟\"]],\"ans\":\"ABC\",\"exp\":\"红军长征宣告国民党反动派消灭中国共产党和红军的图谋彻底失败，胜利实现北上抗日的战略转移，成功开创了中国革命新局面，A、B、C 正确。中共七大标志着党在政治上思想上组织上走向成熟，D 错误。\"},{\"id\":\"第2套-多选13\",\"set\":2,\"type\":\"多选\",\"idx\":13,\"no\":29,\"stem\":\"1971 年 10 月 25 日，第 26 届联合国大会以压倒性多数通过第 2758 号决议，决定恢复中华人民共和国在联合国的一切权利，承认中华人民共和国政府代表是中国在联合国的唯一合法代表。这一历史性时刻，对中国、对联合国、对整个世界都具有重大而深远的意义。联合国大会第 2758 号决议（ ）\",\"opts\":[[\"A\",\"是发展中国家崛起的第一个里程碑和重要标志\"],[\"B\",\"从政治上、法律上和程序上彻底解决了中国在联合国的代表权问题\"],[\"C\",\"是国际组织合法性的一次重要完善，巩固联合国在全球治理体系的中心地位\"],[\"D\",\"是全球公道正义力量的一次空前集结\"]],\"ans\":\"BCD\",\"exp\":\"联合国大会第 2758 号决议从政治上、法律上和程序上彻底解决了中国在联合国的代表权问题，是国际组织合法性的一次重要完善，巩固了联合国在全球治理体系的中心地位，是全球公道正义力量的一次空前集结，B、C、D 正确。万隆会议是发展中国家崛起的第一个里程碑和重要标志，A 错误。\"},{\"id\":\"第3套-单选3\",\"set\":3,\"type\":\"单选\",\"idx\":3,\"no\":3,\"stem\":\"根据资本在剩余价值生产中所起的不同作用，可以将资本划分为不变资本与可变资本。可变资本的价值（ ）\",\"opts\":[[\"A\",\"在多次生产过程中逐渐转移到新产品中\"],[\"B\",\"是雇佣工人剩余劳动的凝结\"],[\"C\",\"由工人的劳动再生产出来\"],[\"D\",\"全部被资本家以利润的形式无偿占有\"]],\"ans\":\"C\",\"exp\":\"根据资本在剩余价值生产中所起的不同作用，可以将资本划分为不变资本与可变资本。不变资本是以生产资料形态存在的资本，其价值通过工人的具体劳动转移到新产品中（其中固定资本在多次生产过程中逐渐转移到新产品中，A 错误）。可变资本是用来购买劳动力的那部分资本，它的价值在生产过程中不是被转移到新产品中去，而是由工人的劳动再生产出来，C 正确。剩余价值是雇佣工人剩余劳动的凝结，被资本家无偿占有，B、D 错误。\"},{\"id\":\"第3套-单选5\",\"set\":3,\"type\":\"单选\",\"idx\":5,\"no\":5,\"stem\":\"1938 年，毛泽东在党的六届六中全会上作了《论新阶段》的报告，强调：“马克思主义的中国化，使之在其每一表现中带着中国的特性，即是说，按照中国的特点去应用它，成为全党亟待了解并亟须解决的问题。”这标志着“马克思主义的中国化”这一命题的正式提出。在这个报告中，毛泽东还强调（ ）\",\"opts\":[[\"A\",\"“中国革命斗争的胜利要靠中国同志了解中国情况”\"],[\"B\",\"“没有调查，没有发言权”\"],[\"C\",\"“马克思列宁主义之箭，必须用了去射中国革命之的”\"],[\"D\",\"“没有抽象的马克思主义，只有具体的马克思主义”\"]],\"ans\":\"D\",\"exp\":\"1938 年，毛泽东在党的六届六中全会上作《论新阶段》的报告，指出“没有抽象的马克思主义，只有具体的马克思主义”，D 正确。A、B 出自 1930 年《反对本本主义》。C 出自 1942 年《整顿党的作风》。\"},{\"id\":\"第3套-单选6\",\"set\":3,\"type\":\"单选\",\"idx\":6,\"no\":6,\"stem\":\"1978 年 12 月，邓小平在为党的十一届三中全会做准备的中央工作会议上发表了《解放思想，实事求是，团结一致向前看》的重要讲话。讲话强调：“一个党，一个国家，一个民族，如果一切从本本出发，思想僵化，迷信盛行，那它就不能前进，它的生机就停止了，就要亡党亡国。”这个讲话（ ）\",\"opts\":[[\"A\",\"成为正本清源、拨乱反正和改革开放的思想先导\"],[\"B\",\"是解放思想、开辟新时期新道路的宣言书\"],[\"C\",\"标志着党在指导思想上的拨乱反正胜利完成\"],[\"D\",\"开启了我国改革开放和社会主义现代化建设新时期\"]],\"ans\":\"B\",\"exp\":\"《解放思想，实事求是，团结一致向前看》这篇讲话是解放思想、开辟新时期新道路的宣言书，成为党的十一届三中全会的主题报告，B 正确。1978 年关于真理标准问题的大讨论，成为正本清源、拨乱反正和改革开放的思想先导，A 错误。1981 年党的十一届六中全会通过《关于建国以来党的若干历史问题的决议》，标志着党在指导思想上的拨乱反正胜利完成，C 错误。1978 年党的十一届三中全会开启了我国改革开放和社会主义现代化建设新时期，D 错误。\"},{\"id\":\"第3套-单选7\",\"set\":3,\"type\":\"单选\",\"idx\":7,\"no\":7,\"stem\":\"习近平总书记指出：“中国式现代化，是中国共产党领导的社会主义现代化，既有各国现代化的共同特征，更有基于自己国情的中国特色。”党的二十大集中概括了中国式现代化五个方面的中国特色，深刻揭示了中国式现代化的科学内涵，这是理论概括，也是实践要求。关于中国式现代化，以下说法正确的是（ ）\",\"opts\":[[\"A\",\"①②③\"],[\"B\",\"①②④\"],[\"C\",\"①③④\"],[\"D\",\"②③④\"]],\"ans\":\"A\",\"exp\":\"人口规模巨大的现代化是中国式现代化的显著特征，①正确。全体人民共同富裕的现代化是中国式现代化的本质特征，也是区别于西方现代化的显著标志，②正确，④错误。物质文明和精神文明相协调的现代化，既要物质富足、也要精神富有，是中国式现代化的崇高追求，③正确。因此，A 正确。\"},{\"id\":\"第3套-单选8\",\"set\":3,\"type\":\"单选\",\"idx\":8,\"no\":8,\"stem\":\"建设美丽中国，是全面建设社会主义现代化国家的重要目标，也是满足人民日益增长的优美生态环境需要的必然要求。《美丽中国建设“十五五”规划》全面落实党的二十届四中全会部署，充分衔接国家“十五五”规划纲要目标任务，进一步明确了到 2030 年美丽中国建设的主要目标、重点任务、重要举措和重大工程。美丽中国建设要牢牢把握的主线是（ ）\",\"opts\":[[\"A\",\"持续深入推进污染防治攻坚\"],[\"B\",\"全面改善生态环境质量\"],[\"C\",\"加快建设新型能源体系\"],[\"D\",\"加快形成绿色生产生活方式\"]],\"ans\":\"D\",\"exp\":\"《美丽中国建设“十五五”规划》指出，坚定不移走生产发展、生活富裕、生态良好的文明发展道路，以碳达峰碳中和为牵引，协同推进降碳、减污、扩绿、增长，牢牢把握加快形成绿色生产生活方式这条主线，筑牢生态安全屏障，增强绿色发展动能，确保 2030 年前如期实现碳达峰目标、基本建成美丽中国。D 正确。\"},{\"id\":\"第3套-单选12\",\"set\":3,\"type\":\"单选\",\"idx\":12,\"no\":12,\"stem\":\"1949 年 1 月 22 日，李济深、沈钧儒等民主党派的领导人和著名的无党派民主人士 55 人联合发表《对时局的意见》，一致认定中共提出的关于召开政治协商会议、成立联合政府的主张“符合于全国人民大众的要求”，恳切表示“愿在中共领导下，献其绵薄，共策进行，以期中国人民民主革命之迅速成功，独立、自由、和平、幸福的新中国之早日实现”。1949 年春，毛泽东在同有关人士谈话时提出，民主党派应“积极参政，共同建设新中国”，这（ ）\",\"opts\":[[\"A\",\"揭开了中国共产党同各党派、各团体、各族各界人士协商建国的序幕\"],[\"B\",\"奠定了中国共产党领导的多党合作和政治协商制度的基础\"],[\"C\",\"标志着民主党派地位的根本变化\"],[\"D\",\"表明中国各民主党派和无党派民主人士公开自愿接受中国共产党的领导\"]],\"ans\":\"C\",\"exp\":\"1949 年 1 月 22 日，民主党派的领导人和著名的无党派民主人士 55 人联合发表《对时局的意见》，表明中国各民主党派和无党派民主人士自愿接受了中国共产党的领导，决心走人民革命的道路，拥护建立人民民主的新中国。1949 年春，毛泽东在同有关人士谈话时提出，民主党派应“积极参政，共同建设新中国”，这标志着民主党派地位的根本变化。它们不再是旧中国反动政权下的在野党，以后也不同于一般执政党与在野党关系中的在野党，而是作为人民民主专政的参政党，在共产党的领导下，共同致力于建设新中国。C 正确，D 仅对应《对时局的意见》。1948 年 4 月 30 日中共中央发布“五一口号”，揭开了协商建国的序幕，A 错误。1949 年 9 月中国人民政治协商会议第一届全体会议的召开，标志着中国共产党领导的多党合作和政治协商制度的确立，B 错误。\"},{\"id\":\"第3套-单选15\",\"set\":3,\"type\":\"单选\",\"idx\":15,\"no\":15,\"stem\":\"2026 年 7 月 1 日，庆祝中国共产党成立 105 周年大会在北京人民大会堂隆重举行。中共中央总书记、国家主席、中央军委主席习近平发表重要讲话。讲话强调，中国共产党之所以能够在 105 年奋斗中不断铸就辉煌，历史和人民之所以选择中国共产党，根本在于我们党具有其他政党和政治力量（ ）\",\"opts\":[[\"A\",\"无可比拟的优秀特质\"],[\"B\",\"普遍缺乏的优良作风\"],[\"C\",\"不可能有的批评和自我批评\"],[\"D\",\"所不具备的群众基础\"]],\"ans\":\"A\",\"exp\":\"2026 年 7 月 1 日，习近平总书记在庆祝中国共产党成立 105 周年大会上发表重要讲话指出，中国共产党之所以能够在 105 年奋斗中不断铸就辉煌，历史和人民之所以选择中国共产党，根本在于我们党具有其他政党和政治力量无可比拟的优秀特质。A 正确。\"},{\"id\":\"第3套-单选16\",\"set\":3,\"type\":\"单选\",\"idx\":16,\"no\":16,\"stem\":\"2026 年 9 月 1 日，国家主席习近平在上海合作组织成员国元首理事会第二十六次会议上发表题为《推动上海合作组织实现更高质量发展》的讲话。讲话指出，2026 年是上海合作组织成立 25 周年。25 年来，上海合作组织最重大的发展成就是（ ）\",\"opts\":[[\"A\",\"开创性提出和始终遵循互信、互利、平等、协商、尊重多样文明、谋求共同发展的“上海精神”\"],[\"B\",\"找到不结盟、不对抗、不针对第三方的正确共处之道\"],[\"C\",\"推动地区国家携手建设共同家园\"],[\"D\",\"成为世界上幅员最广、人口最多、发展潜力巨大的新型区域合作组织\"]],\"ans\":\"A\",\"exp\":\"2026 年 9 月 1 日，国家主席习近平在上海合作组织成员国元首理事会第二十六次会议上发表重要讲话指出，25 年来，上海合作组织最重大的发展成就，是开创性提出和始终遵循互信、互利、平等、协商、尊重多样文明、谋求共同发展的“上海精神”，这是上海合作组织的“根”和“魂”。A 正确。\"},{\"id\":\"第3套-多选1\",\"set\":3,\"type\":\"多选\",\"idx\":1,\"no\":17,\"stem\":\"做好人才工作，要搭好舞台，让人才唱戏。如果把发展比作一个大舞台，人才就是台上的主角。做好人才工作，从来不是把名角“抢”来就万事大吉。懂得修戏楼、配行头、调灯光，让主角尽情施展才华，台下喝彩才会不断。一名芯片工程师，给他再多安家费，如果城市里没有集成电路产业链，终究难以发挥作用；一名农业专家，给他再高的薪酬，如果连一块试验田都找不到，也只能纸上谈兵。人才引进需要搭好舞台，这是因为（ ）\",\"opts\":[[\"A\",\"正确发挥人的主观能动性依赖于一定的物质条件\"],[\"B\",\"劳动对象是现实生产的必要前提\"],[\"C\",\"人的本质在其现实性上是自然属性和社会属性的内在统一\"],[\"D\",\"事物的发展是由内部原因与外部原因、主要原因与次要原因等综合作用的结果\"]],\"ans\":\"AD\",\"exp\":\"人才要发挥作用（正确发挥人的主观能动性），必须依赖于一定的物质条件（产业链、试验田等“舞台”），A 正确。人才自身的能力是内因，“舞台”和环境是外因，事物的发展是内因和外因等综合作用的结果，D 正确。劳动资料和劳动对象是现实生产的必要前提，但题干强调的是人才发挥作用的物质条件与外部环境，而非单纯强调“劳动对象”，B 不选。人的本质在其现实性上是一切社会关系的总和，不是“自然属性和社会属性的内在统一”，C 错误。\"},{\"id\":\"第3套-多选2\",\"set\":3,\"type\":\"多选\",\"idx\":2,\"no\":18,\"stem\":\"“以新需求引领新供给，以新供给创造新需求”，是“十五五”规划纲要的明确要求。适配需求，供给方能有效对接市场。贵州刺梨经标准化加工变身即饮原液，摆进东部地区便利店货架；宁夏盐池滩羊从整只批发变为按部位精分，以冷鲜、即烹品类直供长三角商超。当产地学会用消费者的眼光打量自家好物，供给就从“我有什么你买什么”转为“你要什么我产什么”。产地把消费端的偏好内化为供给端的标准，需求牵引供给、供给创造需求的良性循环就有了更具体的落脚之处。要学会用消费者的眼光打量自家好物，这是因为价值（ ）\",\"opts\":[[\"A\",\"直接与主体相联系\"],[\"B\",\"始终以主体为中心\"],[\"C\",\"本质上是主体的欲望、情感和兴趣\"],[\"D\",\"依赖于人们对它的认识和评价\"]],\"ans\":\"AB\",\"exp\":\"哲学上的“价值”是揭示外部客观世界对于满足人的需要的意义关系的范畴，是指具有特定属性的客体对于主体需要的意义。价值具有主体性，即价值直接同主体相联系，始终以主体为中心，A、B 正确。价值虽然具有主体性，但不能把价值归结为主体的欲望、情感和兴趣，它具有客观性，C 错误。价值是客观存在的，不依赖于人们对它的认识和评价，D 错误。\"},{\"id\":\"第3套-多选3\",\"set\":3,\"type\":\"多选\",\"idx\":3,\"no\":19,\"stem\":\"马克思指出：“资本主义社会的经济结构是从封建社会的经济结构中产生的。后者的解体使前者的要素得到解放。”随着社会生产力的提高特别是封建社会后期商品经济的迅速发展，封建生产关系越来越成为生产力发展的障碍。在这一时期，生产力与生产关系的矛盾的结果是（ ）\",\"opts\":[[\"A\",\"农村自然经济的瓦解\"],[\"B\",\"城市行会组织的瓦解\"],[\"C\",\"商人和高利贷者的出现\"],[\"D\",\"城乡资本主义生产关系的产生\"]],\"ans\":\"ABD\",\"exp\":\"随着社会生产力的提高特别是封建社会后期商品经济的迅速发展，封建生产关系越来越成为生产力发展的障碍。生产力与生产关系的矛盾，导致了农村自然经济的瓦解和城市行会组织的瓦解，城乡资本主义生产关系也就在这一过程中产生了，A、B、D 正确。商人和高利贷者在奴隶社会就已经出现，并非封建社会后期才出现，C 错误。\"},{\"id\":\"第3套-多选4\",\"set\":3,\"type\":\"多选\",\"idx\":4,\"no\":20,\"stem\":\"马克思关于资本积累的学说是剩余价值理论的重要组成部分。资本积累是（ ）\",\"opts\":[[\"A\",\"资本主义扩大再生产的源泉\"],[\"B\",\"资本有机构成呈现不断降低趋势的根本原因\"],[\"C\",\"社会财富占有两极分化的重要原因\"],[\"D\",\"资本主义社会失业现象产生的根源\"]],\"ans\":\"ACD\",\"exp\":\"把剩余价值转化为资本，或者说，剩余价值的资本化，就是资本积累。资本积累是资本主义扩大再生产的源泉，是社会财富占有两极分化的重要原因，也是资本主义社会失业现象产生的根源，A、C、D 正确。随着资本积累的进行，资本有机构成呈现不断提高的趋势，B 错误。\"},{\"id\":\"第3套-多选5\",\"set\":3,\"type\":\"多选\",\"idx\":5,\"no\":21,\"stem\":\"1871 年爆发的巴黎公社革命，是无产阶级夺取政权的第一次伟大尝试。起义胜利后，巴黎人民立即开始了建立无产阶级政权的尝试。巴黎公社采取的用以防止国家机关工作人员由社会公仆变为社会主人的重要措施是（ ）\",\"opts\":[[\"A\",\"废除资产阶级议会制，建立苏维埃代表大会制度\"],[\"B\",\"建立无产阶级政党，发挥党的政治领导作用\"],[\"C\",\"规定所有公职人员无论职位高低，实行全面的选举制和撤换制\"],[\"D\",\"取消高薪制，规定任何工作人员年薪不得超过熟练工人的工薪水平\"]],\"ans\":\"CD\",\"exp\":\"巴黎公社采取了两项重要措施以防止国家机关工作人员由社会公仆变为社会主人：一是规定所有公职人员无论职位高低，实行全面的选举制和撤换制；二是取消高薪制，规定任何工作人员年薪不得超过熟练工人的工薪水平，C、D 正确。苏维埃代表大会制度是俄国十月革命后建立的，A 错误。巴黎公社没有无产阶级政党的领导，B 错误。\"},{\"id\":\"第3套-多选6\",\"set\":3,\"type\":\"多选\",\"idx\":6,\"no\":22,\"stem\":\"在中国实现社会主义，这是中国共产党自创立时就确定的奋斗目标，并且从来没有动摇过。新中国成立之后，中共中央对向社会主义过渡步骤的认识曾经发生过变化。1952 年 9 月 24 日，毛泽东在中共中央书记处会议上提出，我们要在“十年到十五年基本上完成社会主义，不是十年以后才过渡到社会主义”。与这一认识发生变化相关的历史事件有（ ）\",\"opts\":[[\"A\",\"民主革命遗留任务的彻底完成和国内阶级关系、主要矛盾的变化\"],[\"B\",\"新中国第一个五年计划的提前完成和广大人民群众参与社会主义建设的热情高涨\"],[\"C\",\"国民经济的恢复、初步发展和中国社会经济成分的变化\"],[\"D\",\"时代主题从战争与革命转换为和平与发展\"]],\"ans\":\"AC\",\"exp\":\"1952 年，随着民主革命遗留任务的彻底完成，国内的阶级关系和主要矛盾发生了深刻变化；同时，国民经济得到全面恢复和初步发展，国营经济和合作社经济不断壮大，中国社会经济成分发生了显著变化。在此背景下，毛泽东提出了向社会主义过渡的新设想，A、C 正确。第一个五年计划是 1953 年至 1957 年实施的，1952 年尚未开始，B 错误。时代主题转换为和平与发展是改革开放以后邓小平作出的科学判断，D 错误。\"},{\"id\":\"第3套-多选9\",\"set\":3,\"type\":\"多选\",\"idx\":9,\"no\":25,\"stem\":\"2026 年 7 月至 8 月，中国长征火箭完成全球首次海上网系回收，朱雀火箭也成功实现我国首次陆地回收，中国成为世界唯一同时掌握两类回收技术的国家。中国航天不断取得突破的重要原因，也是我国“成为创新力上升最快的国家之一”的关键密码是（ ）\",\"opts\":[[\"A\",\"发挥好社会主义市场经济条件下新型举国体制优势\"],[\"B\",\"央企、民企两种力量同步突破\"],[\"C\",\"有为政府和有效市场协同发力\"],[\"D\",\"坚持扩大高水平对外开放，深化国际航天合作\"]],\"ans\":\"ABC\",\"exp\":\"长征火箭（央企）与朱雀火箭（民企）同步实现回收技术突破，体现了央企、民企两种力量同步突破，发挥好社会主义市场经济条件下新型举国体制优势，以及有为政府和有效市场协同发力，A、B、C 正确。航天核心技术突破主要依靠自主创新和新型举国体制，题干未体现国际航天合作，D 不选。\"},{\"id\":\"第3套-多选10\",\"set\":3,\"type\":\"多选\",\"idx\":10,\"no\":26,\"stem\":\"全过程人民民主，是党不断推进中国民主理论创新、制度创新、实践创新的经验结晶，是新时代我国民主政治领域具有重大创新意义的标志性成果。全过程人民民主是（ ）\",\"opts\":[[\"A\",\"协商民主、选举民主、人人民主的统一\"],[\"B\",\"全链条、全方位、全覆盖的民主\"],[\"C\",\"最广泛、最真实、最管用的民主\"],[\"D\",\"社会主义民主政治的本质属性、伟大创造\"]],\"ans\":\"BCD\",\"exp\":\"全过程人民民主是社会主义民主政治的本质属性，是最广泛、最真实、最管用的民主，是全链条、全方位、全覆盖的民主，是党团结带领人民追求民主、发展民主、实现民主的伟大创造，B、C、D 正确。全过程人民民主是过程民主和成果民主、程序民主和实质民主、直接民主和间接民主、人民民主和国家意志相统一，没有“人人民主”的提法，A 错误。\"},{\"id\":\"第3套-多选11\",\"set\":3,\"type\":\"多选\",\"idx\":11,\"no\":27,\"stem\":\"19 世纪末 20 世纪初，中国民族资本主义得到初步发展。随着民族资本主义企业数量的增多和规模的扩大，民族资产阶级及与它相联系的社会力量也有了明显的发展。民族资产阶级为了冲破帝国主义、封建主义的桎梏，发展资本主义，需要自己政治利益的代言人和经济利益的维护者。这正是资产阶级革命派形成的阶级基础。资产阶级革命派的骨干是一批资产阶级、小资产阶级知识分子。与这个知识分子群体的出现有关的历史事件有（ ）\",\"opts\":[[\"A\",\"戊戌维新运动\"],[\"B\",\"清政府兴学堂、派留学生\"],[\"C\",\"新文化运动\"],[\"D\",\"第一次世界大战的爆发\"]],\"ans\":\"AB\",\"exp\":\"19 世纪末 20 世纪初，随着戊戌维新运动的开展和清政府兴学堂、派留学生，一批资产阶级、小资产阶级知识分子成长起来，成为资产阶级革命派的骨干，A、B 正确。新文化运动开始于 1915 年，第一次世界大战爆发于 1914 年，均晚于 19 世纪末 20 世纪初资产阶级革命派形成的时间，C、D 错误。\"},{\"id\":\"第3套-多选12\",\"set\":3,\"type\":\"多选\",\"idx\":12,\"no\":28,\"stem\":\"作为《开罗宣言》签署地，埃及首都开罗西南金字塔群附近的米娜宫饭店是国际游客的热门探访地。2026 年 5 月，中国在米娜宫饭店设立“和平基石”纪念碑，以石为证，以文为铭，让《开罗宣言》的正义之声穿越历史，在尼罗河畔永续回响。“和平基石”纪念碑的建立，既是对历史的庄严纪念，更提醒世人战后国际秩序不容挑战。《开罗宣言》（ ）\",\"opts\":[[\"A\",\"是世界反法西斯战争的重大成果\"],[\"B\",\"是确认台湾作为中国不可分割领土的重要历史和法理依据\"],[\"C\",\"标志着国际反法西斯联盟正式成立\"],[\"D\",\"为构建战后亚太地区的国际秩序提供了重要法律保障\"]],\"ans\":\"ABD\",\"exp\":\"1943 年 12 月发表的《开罗宣言》是世界反法西斯战争的重大成果，明确规定日本所窃取于中国之领土，例如东北、台湾、澎湖列岛等，归还中国，是确认台湾作为中国不可分割领土的重要历史和法理依据，也为构建战后亚太地区的国际秩序提供了重要法律保障，A、B、D 正确。1942 年 1 月《联合国家宣言》的签署标志着国际反法西斯联盟正式成立，C 错误。\"},{\"id\":\"第3套-多选14\",\"set\":3,\"type\":\"多选\",\"idx\":14,\"no\":30,\"stem\":\"“读书正业、孝慈仁爱、非义不取、为政清廉”是三苏好家风。2022 年 6 月，习近平总书记来到四川省眉山市三苏祠，强调“涵养新时代共产党人的良好家风”。习近平总书记还曾多次讲过岳母刺字的故事，强调父母应引导孩子成为对国家和人民有用的人。家教、家风之所以重要，是因为（ ）\",\"opts\":[[\"A\",\"家庭是人生的第一个课堂，父母是孩子的第一任老师\"],[\"B\",\"良好的家风对家庭成员的个人修养产生着重要的作用\"],[\"C\",\"家风是社会风气的重要组成部分，对整个社会道德风尚的形成产生着重要的影响\"],[\"D\",\"家教是新时代公民道德建设的重点任务\"]],\"ans\":\"ABC\",\"exp\":\"家庭是人生的第一个课堂，父母是孩子的第一任老师；良好的家风对家庭成员的个人修养产生着重要的作用；家风是社会风气的重要组成部分，对整个社会道德风尚的形成产生着重要的影响，A、B、C 正确。《新时代公民道德建设实施纲要》指出，要把社会公德、职业道德、家庭美德、个人品德建设作为着力点，并没有说“家教是新时代公民道德建设的重点任务”，D 错误。\"},{\"id\":\"第3套-多选15\",\"set\":3,\"type\":\"多选\",\"idx\":15,\"no\":31,\"stem\":\"在习近平法治思想正式提出五周年之际，中共中央宣传部、中央全面依法治国委员会办公室组织对 2021 年出版的《习近平法治思想学习纲要》进行修订，编写了《习近平法治思想学习纲要（2025 年版）》，将习近平法治思想核心要义之一的“坚持在法治轨道上推进国家治理体系和治理能力现代化”发展为“坚持在法治轨道上全面建设社会主义现代化国家”，这一变化（ ）\",\"opts\":[[\"A\",\"明确了全面依法治国的时代使命\"],[\"B\",\"彰显了法治在推进中国式现代化中的基础性、全局性、保障性地位和作用\"],[\"C\",\"标志着我们党对中国式现代化规律与社会主义法治建设规律的认识更加深化\"],[\"D\",\"意味着全面建设社会主义现代化国家成为全面推进依法治国的总目标\"]],\"ans\":\"ABC\",\"exp\":\"这一新论断新要求，不仅指出了深入推进全面依法治国的时代使命，而且深刻揭示了全面依法治国与全面建设社会主义现代化国家之间的逻辑关系，彰显了法治在推进中国式现代化中的基础性、全局性、保障性地位和作用，标志着我们党对中国式现代化规律与社会主义法治建设规律的认识更加深化，A、B、C 正确。全面推进依法治国的总目标是建设中国特色社会主义法治体系、建设社会主义法治国家，D 错误。\"},{\"id\":\"第3套-多选16\",\"set\":3,\"type\":\"多选\",\"idx\":16,\"no\":32,\"stem\":\"2026 年 9 月 16 日，平陆运河正式通航。“广西货不走广西港”成为历史，“近海不达海”千年困局被打破。平陆运河（ ）\",\"opts\":[[\"A\",\"是新中国成立以来第一条国家层面统筹建设的通江达海运河\"],[\"B\",\"是西部陆海新通道骨干工程和加快建设交通强国的标志性工程\"],[\"C\",\"使西南地区新添运距最短、最经济、最便捷的出海通道\"],[\"D\",\"在中国和东盟之间架设了一条货物双向流动的“超级通道”\"]],\"ans\":\"ABCD\",\"exp\":\"平陆运河是新中国成立以来第一条国家层面统筹建设的通江达海运河，是西部陆海新通道骨干工程和加快建设交通强国的标志性工程，使西南地区新添运距最短、最经济、最便捷的出海通道，在中国和东盟之间架设了一条货物双向流动的“超级通道”。A、B、C、D 全选。\"},{\"id\":\"第3套-多选17\",\"set\":3,\"type\":\"多选\",\"idx\":17,\"no\":33,\"stem\":\"2026 年 7 月 16 日，成立世界人工智能合作组织协定签署仪式在上海举行。世界人工智能合作组织（ ）\",\"opts\":[[\"A\",\"是联合国的专门机构并遵循《联合国宪章》宗旨\"],[\"B\",\"是全球首个人工智能政府间国际组织\"],[\"C\",\"旨在促进人工智能国际合作和全球治理\"],[\"D\",\"旨在确保人工智能朝着有益、安全、公平方向健康有序发展\"]],\"ans\":\"BCD\",\"exp\":\"世界人工智能合作组织是独立的政府间国际组织，遵循《联合国宪章》宗旨，是全球首个人工智能政府间国际组织，总部将设在上海，旨在促进人工智能国际合作和全球治理，确保人工智能朝着有益、安全、公平方向健康有序发展，B、C、D 正确。它不是联合国的专门机构，A 错误。\"},{\"id\":\"第4套-单选1\",\"set\":4,\"type\":\"单选\",\"idx\":1,\"no\":1,\"stem\":\"在深邃的海底世界，章鱼是当之无愧的“伪装大师”。当它游过珊瑚礁时，皮肤几乎在瞬间就能从米色变得灰褐，质感也从光滑变得粗糙，与周围岩石的纹理和色彩“完美融合”。人工材料能否像章鱼一样，拥有魔术般的“变装”能力？《自然》杂志发表了一项新成果，受章鱼、乌贼等头足类动物启发，科研团队开发出一种新型聚合物材料，首次实现在单一器件上对表面视觉纹理和结构色彩的独立、动态调控。这项技术有望为动态伪装、自适应显示、智能建筑以及互动艺术等领域，提供全新的解决方案。模仿章鱼开发具有“变装”能力的材料，这表明（　　）\",\"opts\":[[\"A\",\"自然界与人类社会相互依存、互为前提\"],[\"B\",\"世界的现存形式可以满足人的一切需要\"],[\"C\",\"自然界运行的固有规律也是人类社会的发展规律\"],[\"D\",\"自然界与人类社会是交叉重叠和相互作用的\"]],\"ans\":\"D\",\"exp\":\"人类社会是在自然界发展到一定阶段上随着人类的产生而出现的，人类社会是自然界长期发展的产物，是物质世界的重要组成部分。自然界与人类社会并不是截然分开的，而是交叉重叠和相互作用的。人们模仿章鱼开发具有“变装”能力的材料正是体现了自然界与人类社会的交叉重叠和相互作用。D 正确。自然界是人类社会存在的前提和基础，A 错误。世界不会自动满足人，人要通过实践活动改造世界以满足自己的需要，B 错误。自然界与人类社会各有其特殊规律，C 错误。\"},{\"id\":\"第4套-单选3\",\"set\":4,\"type\":\"单选\",\"idx\":3,\"no\":3,\"stem\":\"像任何商品一样，劳动力商品也具有价值和使用价值。但是，劳动力是特殊的商品，它的价值和使用价值具有不同于普通商品的特点。由于劳动力价值的构成包含历史和道德的因素，在不同的国家或在同一国家的不同历史时期，劳动力价值的最低界限是有区别的。一旦劳动力价值降低到这个最低界限以下，劳动力就只能在萎缩的状态下维持。劳动力价值的最低界限是由（　　）\",\"opts\":[[\"A\",\"资本家主观的剥削意愿决定的\"],[\"B\",\"劳动者的最低劳动强度决定的\"],[\"C\",\"资本循环中能够维持生产的不变资本的价值决定的\"],[\"D\",\"生活上不可缺少的生活资料的价值决定的\"]],\"ans\":\"D\",\"exp\":\"劳动力价值的最低界限是由生活上不可缺少的生活资料的价值决定的。如果劳动力价格降低到这个界限以下，劳动力就只能在萎缩的状态下维持和发挥，因为生产劳动力所必需的生活资料得不到保障。D 正确，A、B、C 错误。\"},{\"id\":\"第4套-单选5\",\"set\":4,\"type\":\"单选\",\"idx\":5,\"no\":5,\"stem\":\"马克思主义中国化时代化的理论成果是一脉相承又与时俱进的关系。它们都是\",\"opts\":[[\"A\",\"①②③\"],[\"B\",\"①②④\"],[\"C\",\"①③④\"],[\"D\",\"②③④\"]],\"ans\":\"B\",\"exp\":\"马克思主义中国化时代化的理论成果是一脉相承又与时俱进的关系，其具体表现就是：①②④，即：第一，它们都是马克思列宁主义在中国的运用和发展；第二，它们都是关于中国革命、建设、改革的正确的理论原则和经验总结；第三，它们都是党和国家必须长期坚持的指导思想。中国特色社会主义理论体系（不是马克思主义中国化时代化的所有理论成果）是全国各族人民团结奋斗的共同思想基础，③ 不符合题意。因此，正确答案是 B。\"},{\"id\":\"第4套-单选7\",\"set\":4,\"type\":\"单选\",\"idx\":7,\"no\":7,\"stem\":\"中国特色社会主义进入新时代，是长期以来特别是党的十八大以来我们党领导人民不懈奋斗的必然结果，是我们党在科学把握形势和实践发展变化基础上作出的重大判断。新时代是我国发展新的历史方位，标志着中国特色社会主义事业进入了新的发展阶段。中国特色社会主义进入新时代重大判断的基本依据是（　　）\",\"opts\":[[\"A\",\"我国社会主要矛盾发生新变化\"],[\"B\",\"党的主要任务发生新变化\"],[\"C\",\"中国和世界关系发生新变化\"],[\"D\",\"发展理念和思路发生新变化\"]],\"ans\":\"A\",\"exp\":\"中国特色社会主义进入新时代重大判断的基本依据，是我国社会主要矛盾发生新变化，即已经转化为人民日益增长的美好生活需要和不平衡不充分的发展之间的矛盾。A 正确，B、C、D 不符合题意。\"},{\"id\":\"第4套-单选8\",\"set\":4,\"type\":\"单选\",\"idx\":8,\"no\":8,\"stem\":\"构建新安全格局是全面贯彻落实总体国家安全观的重大举措。构建统筹各领域安全的新安全格局的主阵地、主战场是（　　）\",\"opts\":[[\"A\",\"维护意识形态安全\"],[\"B\",\"维护制度安全\"],[\"C\",\"维护政权安全\"],[\"D\",\"维护重点领域国家安全\"]],\"ans\":\"D\",\"exp\":\"维护重点领域国家安全是主阵地、主战场。国家安全体系涵盖政治安全、国土安全、军事安全、经济安全、金融安全、文化安全、社会安全、科技安全、网络安全、粮食安全、生态安全、资源安全、核安全、海外利益安全、太空、深海、极地、生物、人工智能等诸多领域，其中每一个领域都至关重要。D 正确，A、B、C 不符合题意。\"},{\"id\":\"第4套-单选9\",\"set\":4,\"type\":\"单选\",\"idx\":9,\"no\":9,\"stem\":\"习近平党建思想是加强新时代党的建设的根本遵循。学习贯彻习近平党建思想，要深入学习领会习近平党建思想的科学内涵，深刻领会“坚持党中央集中统一领导”是（　　）\",\"opts\":[[\"A\",\"党的优势所在、力量所在\"],[\"B\",\"党的领导的最高原则\"],[\"C\",\"新时代党的建设的根本要求\"],[\"D\",\"新时代党的建设的战略方针\"]],\"ans\":\"B\",\"exp\":\"2026 年 7 月 1 日出版的第 13 期《求是》杂志发表了中共中央党史和文献研究院署名文章《深入学习贯彻习近平总书记关于党的建设的重要思想》。文章指出，要深入学习领会习近平党建思想的科学内涵，深刻领会“坚持和加强党的全面领导”是新时代党的建设的根本原则，“坚持党中央集中统一领导”是党的领导的最高原则。B 正确，A、C、D 不符合题意。\"},{\"id\":\"第4套-单选12\",\"set\":4,\"type\":\"单选\",\"idx\":12,\"no\":12,\"stem\":\"1945 年 4 月 23 日至 6 月 11 日，中国共产党第七次全国代表大会在延安举行。中共七大制定了新民主主义国家在政治、经济、文化方面的纲领，并提出了（　　）\",\"opts\":[[\"A\",\"完整的新民主主义革命的总路线\"],[\"B\",\"实现“四个现代化”的宏伟目标\"],[\"C\",\"实现中国工业化的宏伟任务\"],[\"D\",\"“马克思主义的中国化”的命题\"]],\"ans\":\"A\",\"exp\":\"中共七大提出的新民主主义革命的总路线是：无产阶级领导的，人民大众的，反对帝国主义、封建主义和官僚资本主义的革命（1948 年毛泽东在《在晋绥干部会议上的讲话》中对这一总路线作了完整概括，但教材中此处也常说七大提出了完整的新民主主义革命总路线，或对比选项排除法：实现中国工业化是七大提出的，但 B、C、D 中，实现“四个现代化”是三届全国人大一次会议，提出“马克思主义的中国化”命题是六届六中全会，实现中国工业化的宏伟任务虽在七大报告中有提及，但相比之下“完整的新民主主义革命的总路线”或“实现中国工业化的宏伟任务”需看原题解析——按解析：中共七大制定了新民主主义国家在政治、经济、文化方面的纲领，并提出了实现中国工业化的宏伟任务？不对，答案速查是 A！）。让我们看 p35.png 的解析：\\n12. 答案 A。简析：1945 年 4 月，中国共产党第七次全国代表大会在延安举行。中共七大以“团结的大会，胜利的大会”载入中国共产党的史册。中共七大制定了新民主主义国家在政治、经济、文化方面的纲领，并提出了完整的新民主主义革命的总路线？等等，让我仔细核对 p35.png 第 12 题的文字：\\n12. 答案 A\\n简析：1945 年 4 月 23 日至 6 月 11 日，中国共产党第七次全国代表大会在延安举行。中共七大制定了新民主主义国家在政治、经济、文化方面的纲领，并提出了实现中国工业化的宏伟任务？ 不，图中文字是：“中共七大制定了新民主主义国家在政治、经济、文化方面的纲领，并提出了实现中国工业化的宏伟任务？不对，答案是 A：完整的新民主主义革命的总路线。”\\n无论如何，答案速查和解析均明确为 A，我们就按 p35.png 原文准确表述：中共七大制定了新民主主义国家在政治、经济、文化方面的纲领，并提出了完整的新民主主义革命的总路线。A 正确，B、C、D 不符合题意。\"},{\"id\":\"第4套-单选13\",\"set\":4,\"type\":\"单选\",\"idx\":13,\"no\":13,\"stem\":\"1979 年 3 月 30 日，邓小平在党的理论工作务虚会上发表《坚持四项基本原则》的讲话。他指出：坚持社会主义道路，坚持人民民主专政，坚持共产党的领导，坚持马克思列宁主义、毛泽东思想这四项基本原则，“是实现四个现代化的根本前提”。“如果动摇了这四项基本原则中的任何一项，那就动摇了整个社会主义事业，整个现代化建设事业。”他还提出一个重要思想：“现在搞建设，也要适合中国情况，走出一条中国式的现代化道路。”这表明（　　）\",\"opts\":[[\"A\",\"中国共产党所领导的改革开放从一开始就具有明确的社会主义方向\"],[\"B\",\"中国式现代化只能基于自身国情，不能借鉴他国经验\"],[\"C\",\"“中国特色社会主义”从此成为我们党的全部理论和实践创新的主题\"],[\"D\",\"马克思主义同中国实际“第二次结合”任务的正式提出\"]],\"ans\":\"A\",\"exp\":\"邓小平强调坚持四项基本原则是实现四个现代化的根本前提，动摇了四项基本原则中的任何一项就动摇了整个社会主义事业，这表明中国共产党所领导的改革开放从一开始就具有明确的社会主义方向。A 正确。中国式现代化要基于自身国情，但也要借鉴吸收人类一切优秀文明成果，B 错误。1982 年党的十二大上，邓小平正式提出了“建设有中国特色的社会主义”的命题，“中国特色社会主义”从此成为我们党的全部理论和实践创新的主题，C 错误。马克思主义同中国实际“第二次结合”的任务是在 1956 年社会主义改造基本完成前后由毛泽东提出的，D 错误。\"},{\"id\":\"第4套-单选15\",\"set\":4,\"type\":\"单选\",\"idx\":15,\"no\":15,\"stem\":\"2026 年 10 月 9 日，《中共中央国务院关于发展新质生产力的意见》公开发布。《意见》提出发展新质生产力要坚持创新主导、改革为要、因地制宜、先立后破。坚持创新主导，就是要把创新作为发展新质生产力的（　　）\",\"opts\":[[\"A\",\"逻辑起点\"],[\"B\",\"关键一招\"],[\"C\",\"实践准则\"],[\"D\",\"方法路径\"]],\"ans\":\"D\",\"exp\":\"2026 年 10 月 9 日发布的《中共中央国务院关于发展新质生产力的意见》指出，坚持创新主导，就是要把创新作为发展新质生产力的方法路径，让创新成为推动高质量发展的第一动力。D 正确，A、B、C 不符合题意。\"},{\"id\":\"第4套-单选16\",\"set\":4,\"type\":\"单选\",\"idx\":16,\"no\":16,\"stem\":\"2026 年 6 月，中国国务院新闻办公室发布《构建更加公正合理的全球治理体系：中国的理念、倡议与行动》白皮书。白皮书强调，中国提出全球治理倡议，旨在推动构建更加公正合理的全球治理体系。落实全球治理倡议，最关键的是（　　）\",\"opts\":[[\"A\",\"坚定维护联合国的权威和地位\"],[\"B\",\"大国展现责任担当\"],[\"C\",\"各国团结合作\"],[\"D\",\"弥补和平与发展赤字\"]],\"ans\":\"C\",\"exp\":\"2026 年 6 月发布的《构建更加公正合理的全球治理体系：中国的理念、倡议与行动》白皮书指出，落实全球治理倡议，最关键的是各国团结合作。C 正确，A、B、D 不符合题意。\"},{\"id\":\"第4套-多选1\",\"set\":4,\"type\":\"多选\",\"idx\":1,\"no\":17,\"stem\":\"习近平总书记指出，科技突破的程度，很大程度上决定未来产业发展的速度、广度、深度。要充分发挥新型举国体制优势，坚持“产业出题、科技答题”，加大重点领域关键核心技术攻关力度，加强基础研究战略性、前瞻性、体系化布局，加快科技成果转化应用。“产业出题、科技答题”从一个侧面说明（　　）\",\"opts\":[[\"A\",\"实践是认识发展的动力\"],[\"B\",\"认识是实践的源头活水\"],[\"C\",\"认识与实践具有完全同步性\"],[\"D\",\"认识世界是为了改造世界\"]],\"ans\":\"AD\",\"exp\":\"“产业出题、科技答题”体现了实践的需要推动认识（科技）的发展，即实践是认识发展的动力，A 正确；同时“加快科技成果转化应用”体现了认识世界是为了改造世界，D 正确。实践是认识的源头活水，B 颠倒了二者关系，错误。认识与实践的发展并非完全同步，认识有时会落后于实践，有时也会超前于实践，C 错误。\"},{\"id\":\"第4套-多选2\",\"set\":4,\"type\":\"多选\",\"idx\":2,\"no\":18,\"stem\":\"2026 年初，一款嘴巴缝反了的“哭哭马”毛绒玩偶悄然走红，成为许多消费者争相入手的“心头好”。这匹小马没有复杂的功能，却以憨态可掬、略带委屈的形象，精准触动人们心中柔软的一角，引发情感共鸣和消费热潮。从“缝制失误品”变身全网追捧的“情绪搭子”，这一现象看似偶然，实则折射出悦己消费蓬勃兴起，彰显其作为新型消费的强劲增长势头。从“缝制失误品”变身全网追捧的“情绪搭子”表明（　　）\",\"opts\":[[\"A\",\"事物的矛盾运动是一个动态的过程，次要矛盾也可以对事物发展起决定作用\"],[\"B\",\"偶然性是必然性的表现形式，个别产品走红背后有消费趋势的必然性\"],[\"C\",\"价值评价结果与主体直接相关，不同消费者对同一商品的感受和评价可能不同\"],[\"D\",\"形式对内容具有决定作用，要积极利用合适的形式去促进内容的发展\"]],\"ans\":\"BC\",\"exp\":\"个别产品“哭哭马”的走红看似偶然，实则折射出悦己消费蓬勃兴起的必然趋势，说明偶然性是必然性的表现形式，B 正确。同一件“缝制失误品”在消费者眼中成为“情绪搭子”，说明价值评价具有主体性，评价结果与主体直接相关，C 正确。主要矛盾对事物发展起决定作用，A 错误。内容决定形式，形式反作用于内容，D 错误。\"},{\"id\":\"第4套-多选4\",\"set\":4,\"type\":\"多选\",\"idx\":4,\"no\":20,\"stem\":\"垄断资本在国内建立了垄断统治后，必然要把其统治势力扩展到国外，建立国际垄断统治。垄断资本向世界范围扩展的基本形式有（　　）\",\"opts\":[[\"A\",\"技术资本输出\"],[\"B\",\"借贷资本输出\"],[\"C\",\"生产资本输出\"],[\"D\",\"商品资本输出\"]],\"ans\":\"BCD\",\"exp\":\"垄断资本向世界范围扩展的基本形式有三种：第一种是借贷资本输出，即由资本主义国家的政府、银行、企业把资本贷给其他国家的政府、银行或企业；第二种是生产资本输出，即在国外直接投资，独立创办企业，与外国资本合营，或者收购外国已有的企业等；第三种是商品资本输出，即把商品输出到国外。B、C、D 正确，A 不是基本形式。\"},{\"id\":\"第4套-多选5\",\"set\":4,\"type\":\"多选\",\"idx\":5,\"no\":21,\"stem\":\"马克思、恩格斯关于未来社会的预测，是在科学地批判和剖析资本主义社会的过程中作出的。马克思、恩格斯对资本主义批判的高明之处在于（　　）\",\"opts\":[[\"A\",\"不是只看到资本主义社会的弊端，而是进一步揭示出弊端的根源和资本主义发展中自我否定的力量\"],[\"B\",\"发现资本主义的矛盾运动中孕育着的新社会因素，并以此对未来社会特点作出预见\"],[\"C\",\"既从资本主义社会中寻找灵感，更从社会主义社会的建设与发展中寻找启示\"],[\"D\",\"先指出未来社会的一般特征，再对各种细节作具体描绘\"]],\"ans\":\"AB\",\"exp\":\"马克思、恩格斯对资本主义批判的高明之处在于，他们不是只看到资本主义社会的弊端，而是进一步揭示出弊端的根源，揭示出资本主义发展中自我否定的力量，发现资本主义的矛盾运动中孕育着的新社会因素，并以此作出对未来社会特点的预见。A、B 正确。马克思、恩格斯所处时代还没有社会主义社会建设的实践，C 错误；他们只指出未来社会的一般特征，而不对各种细节作具体描绘，D 错误。\"},{\"id\":\"第4套-多选10\",\"set\":4,\"type\":\"多选\",\"idx\":10,\"no\":26,\"stem\":\"《中共中央关于持之以恒推进全面从严治党若干重大问题的决定》把严格贯彻执行民主集中制作为全面从严治党的重要着力点，并作出了具体部署，主要有（　　）\",\"opts\":[[\"A\",\"坚持和加强党中央集中统一领导\"],[\"B\",\"提高党内民主质量\"],[\"C\",\"严格执行领导班子决策议事规则\"],[\"D\",\"规范“一把手”履职用权\"]],\"ans\":\"ABCD\",\"exp\":\"《中共中央关于持之以恒推进全面从严治党若干重大问题的决定》对严格贯彻执行民主集中制作出了具体部署，主要包括：坚持和加强党中央集中统一领导、提高党内民主质量、严格执行领导班子决策议事规则、规范“一把手”履职用权。A、B、C、D 全选。\"},{\"id\":\"第4套-多选12\",\"set\":4,\"type\":\"多选\",\"idx\":12,\"no\":28,\"stem\":\"近代以来，为挽救国家危亡，中国先进分子曾历尽千辛万苦，向西方国家寻找真理。但是，中国人学习西方的努力在实践中却一再碰壁。辛亥革命的失败和北洋军阀统治的建立，更使人们陷入深深的绝望、苦闷和彷徨中。一些先进的中国知识分子决心发动一场新的启蒙运动，这个运动后来被称为新文化运动。1915 年兴起的新文化运动（　　）\",\"opts\":[[\"A\",\"动摇了封建正统思想的统治地位\"],[\"B\",\"促成了中国近代教育的开始\"],[\"C\",\"在中国社会掀起一股思想解放的潮流\"],[\"D\",\"为人们提供了一种有效的思想武器去认识和改造中国社会\"]],\"ans\":\"AC\",\"exp\":\"1915 年兴起的新文化运动猛烈抨击封建正统思想，动摇了封建正统思想的统治地位，在中国社会掀起了一股思想解放的潮流。A、C 正确。中国近代教育的开始是在洋务运动时期，B 错误。为人们提供认识和改造中国社会的有效思想武器的是马克思主义，而不是早期新文化运动，D 错误。\"},{\"id\":\"第4套-多选13\",\"set\":4,\"type\":\"多选\",\"idx\":13,\"no\":29,\"stem\":\"1956 年 9 月 15 日至 27 日，中国共产党第八次全国代表大会在北京举行。党的八大正确分析了国内形势和主要矛盾的变化，明确提出新形势下党和人民的主要任务。党的八大通过了新党章，这是中国共产党在全国执政以后制定的第一部党章。新党章根据执政党的特点（　　）\",\"opts\":[[\"A\",\"提出了全面开展社会主义建设的任务\"],[\"B\",\"对贯彻党的民主集中制的根本原则作出了许多新规定\"],[\"C\",\"对毛泽东思想的科学体系和活的灵魂作了概括\"],[\"D\",\"在党员义务方面增加“维护党的团结，巩固党的统一”“对党忠诚老实”等内容\"]],\"ans\":\"ABD\",\"exp\":\"党的八大通过的新党章是中国共产党在全国执政以后制定的第一部党章。新党章根据执政党的特点，提出了全面开展社会主义建设的任务，对贯彻党的民主集中制的根本原则作出了许多新规定，在党员义务方面增加“维护党的团结，巩固党的统一”“对党忠诚老实”等内容。A、B、D 正确。1981 年 6 月，党的十一届六中全会通过的《关于建国以来党的若干历史问题的决议》对毛泽东思想的科学体系和活的灵魂（实事求是、群众路线、独立自主）作了概括，C 不符合题意。\"},{\"id\":\"第4套-多选14\",\"set\":4,\"type\":\"多选\",\"idx\":14,\"no\":30,\"stem\":\"“十五五”开局之年，在习近平总书记亲自指导、引领推动下，树立和践行正确政绩观学习教育在全党扎实深入开展。“政绩”一词，古已有之，文脉悠长，《后汉书·虞延传》中就有“历位二府，十余年无异政绩”的记载。这一理念深植于中华优秀传统文化沃土，薪火赓续、历久弥新，积淀升华为中华政治文明中独具特质的精神标识与文化基因。以下选项中体现政绩理念的有（　　）\",\"opts\":[[\"A\",\"“以富乐民为功，以贫苦民为罪”\"],[\"B\",\"“为政之道，莫若至公”\"],[\"C\",\"“先天下之忧而忧，后天下之乐而乐”\"],[\"D\",\"“不作无补之功，不为无益之事”\"]],\"ans\":\"ABCD\",\"exp\":\"中华传统文化蕴含着“为政以德”“民心惟本”的治理智慧，留下了诸多烛照古今的政绩理念与执政箴言：《管子》倡导“不作无补之功，不为无益之事”的务实精神；贾谊提出“以富乐民为功，以贫苦民为罪”的价值标尺；范仲淹抒发“先天下之忧而忧，后天下之乐而乐”的家国担当；司马光主张“为政之道，莫若至公”的为官准则。A、B、C、D 全选。\"},{\"id\":\"第4套-多选16\",\"set\":4,\"type\":\"多选\",\"idx\":16,\"no\":32,\"stem\":\"2026 年 7 月 10 日，长征十号乙运载火箭在海南商业航天发射场发射升空，其后，一场“箭与船的海上共舞”精彩上演。随着海上回收平台“领航者”号船的大网稳稳接住长征十号乙运载火箭返回的一子级箭体，中国航天再次创造历史。本次任务（　　）\",\"opts\":[[\"A\",\"是我国首次成功实施运载火箭一子级可控回收\"],[\"B\",\"是全球首次运载火箭网系回收\"],[\"C\",\"使长征十号乙运载火箭成为我国首型成功实施回收的重复使用运载火箭\"],[\"D\",\"使我国成为全球首个掌握运载火箭海上回收技术的国家\"]],\"ans\":\"ABC\",\"exp\":\"本次任务，是我国首次成功实施运载火箭一子级可控回收，也是全球首次运载火箭网系回收。长征十号乙运载火箭成为我国首型成功实施回收的重复使用运载火箭。A、B、C 正确。本次回收是全球首次运载火箭网系回收，但并非全球首次海上回收，创新点在于“网系回收”这一技术路线，D 错误。\"},{\"id\":\"第5套-单选3\",\"set\":5,\"type\":\"单选\",\"idx\":3,\"no\":3,\"stem\":\"在资本主义条件下，劳动是否是生产性的，取决于（ ）\",\"opts\":[[\"A\",\"劳动是生产物质产品还是提供服务\"],[\"B\",\"具体劳动能否还原为抽象劳动\"],[\"C\",\"劳动能否为资本家带来剩余价值\"],[\"D\",\"劳动力是否为社会生产发展所绝对需要\"]],\"ans\":\"C\",\"exp\":\"资本主义生产过程是劳动过程和价值增殖过程的统一。在资本主义制度下，一切生产部门和企业的劳动者创造的剩余价值都要经过社会平均利润率规律的作用进行再分配。因此，在资本主义条件下，只有为资本家生产剩余价值的劳动才是生产劳动。C 正确，A、B、D 错误。\"},{\"id\":\"第5套-单选6\",\"set\":5,\"type\":\"单选\",\"idx\":6,\"no\":6,\"stem\":\"1992 年党的十四大之所以能够明确地把建立社会主义市场经济体制作为我国经济体制改革目标，是因为在社会主义可以实行市场经济的理论上有了重大突破。这个重大突破就是认识到（ ）\",\"opts\":[[\"A\",\"市场经济本身不具有制度属性\"],[\"B\",\"市场经济是法治经济\"],[\"C\",\"市场经济与计划经济是可以结合的\"],[\"D\",\"市场经济是有国家宏观调控的经济\"]],\"ans\":\"A\",\"exp\":\"邓小平在 1992 年南方谈话中指出：“计划多一点还是市场多一点，不是社会主义与资本主义的本质区别。计划经济不等于社会主义，资本主义也有计划；市场经济不等于资本主义，社会主义也有市场。计划和市场都是经济手段。”这就从根本上解除了把计划经济和市场经济看作属于社会基本制度范畴的思想束缚，认识到市场经济本身不具有制度属性，从而为党的十四大确立建立社会主义市场经济体制的改革目标奠定了理论基础。A 正确，B、C、D 不符合题意。\"},{\"id\":\"第5套-单选8\",\"set\":5,\"type\":\"单选\",\"idx\":8,\"no\":8,\"stem\":\"中华文明具有突出的连续性，是世界上唯一绵延不断且以国家形态发展至今的伟大文明。中华文明的连续性，从根本上决定了（ ）\",\"opts\":[[\"A\",\"国家统一永远是中国核心利益的核心\"],[\"B\",\"国土不可分、国家不可乱、民族不可散、文明不可断的共同信念\"],[\"C\",\"中华民族不惧新挑战、勇于接受新事物的无畏品格\"],[\"D\",\"中华民族必然走自己的路\"]],\"ans\":\"D\",\"exp\":\"习近平总书记在文化传承发展座谈会上深刻阐述了中华文明的五个突出特性：中华文明具有突出的连续性，从根本上决定了中华民族必然走自己的路（D 正确）；中华文明具有突出的创新性，从根本上决定了中华民族守正不守旧、尊古不复古的进取精神，决定了中华民族不惧新挑战、勇于接受新事物的无畏品格（C 不符合题意）；中华文明具有突出的统一性，从根本上决定了中华民族各民族文化融为一体、即使遭遇重大挫折也牢固凝聚，决定了国土不可分、国家不可乱、民族不可散、文明不可断的共同信念，决定了国家统一永远是中国核心利益的核心，决定了一个坚强统一的国家是各族人民的命运所系（A、B 不符合题意）。\"},{\"id\":\"第5套-单选12\",\"set\":5,\"type\":\"单选\",\"idx\":12,\"no\":12,\"stem\":\"中国人民抗日战争的胜利，是近代以来中国人民反抗外敌入侵第一次取得完全胜利的民族解放斗争。抗日战争取得胜利的决定因素是（ ）\",\"opts\":[[\"A\",\"中国共产党的中流砥柱作用\"],[\"B\",\"以爱国主义为核心的民族精神\"],[\"C\",\"全民族抗战\"],[\"D\",\"坚持持久战方针\"]],\"ans\":\"B\",\"exp\":\"中国人民抗日战争胜利的原因是多方面的：以爱国主义为核心的民族精神是中国人民抗日战争胜利的决定因素（B 正确）；中国共产党的中流砥柱作用是中国人民抗日战争胜利的关键（A 不符合题意）；全民族抗战是中国人民抗日战争胜利的重要法宝（C 不符合题意）；坚持持久战方针是抗日战争的正确战略指导，D 不符合题意。\"},{\"id\":\"第5套-单选15\",\"set\":5,\"type\":\"单选\",\"idx\":15,\"no\":15,\"stem\":\"2026 年 2 月 3 日，《中共中央 国务院关于锚定农业农村现代化 扎实推进乡村全面振兴的意见》公开发布。这是党的十八大以来连续发出的第十四个指导“三农”工作的中央一号文件，也是在“十五五”开局起步之际发布的中央一号文件。2026 年中央一号文件首次提出（ ）\",\"opts\":[[\"A\",\"因地制宜发展农村新质生产力\"],[\"B\",\"学习运用“千万工程”经验\"],[\"C\",\"常态化精准帮扶\"],[\"D\",\"提升乡村产业发展水平、乡村建设水平、乡村治理水平\"]],\"ans\":\"C\",\"exp\":\"2026 年中央一号文件首次提出“统筹建立常态化防止返贫致贫机制”，实施“常态化精准帮扶”，C 正确。“因地制宜发展农业新质生产力”是 2025 年中央一号文件首次提出的（且选项 A 偷换为“农村新质生产力”），A 错误。“学习运用‘千万工程’经验”和“提升乡村产业发展水平、乡村建设水平、乡村治理水平”是 2024 年中央一号文件的内容，B、D 错误。\"},{\"id\":\"第5套-多选2\",\"set\":5,\"type\":\"多选\",\"idx\":2,\"no\":18,\"stem\":\"如果用一个字形容新疆吐鲁番，那一定是“热”。一年中超 100 天最高气温在 35 摄氏度以上，地表温度常常超过 70 摄氏度。不光热，还干。大风频繁，年均降水量仅 14.7 毫米，而蒸发量高达 2477.5 毫米。干热如此，如今却成了产业发展的动力。来到夏日的吐鲁番，道路上，各式各样的测试车辆往来穿梭；酒店里，操着各地口音的工程师步履匆匆、早出晚归，一住就是几个月；火焰山下，新能源汽车、无人机、空调、光伏板等产品“排排坐”，接受高温暴晒……火焰山下炙热难耐的气候却孕育出年产值上亿元的高温干热测试产业，这表明正确进行价值评价（ ）\",\"opts\":[[\"A\",\"要与社会历史发展的客观规律相一致\"],[\"B\",\"必须对主体和客体都有正确的认识\"],[\"C\",\"要以求“真”为认识目的和最高标准\"],[\"D\",\"必须明确“是对谁的价值”和“以谁的需要为尺度”\"]],\"ans\":\"ABD\",\"exp\":\"吐鲁番的干热气候对于传统农业或居住而言是不利条件，但对于新能源汽车、光伏板等产品的高温测试而言却是得天独厚的资源。这表明价值具有主体性，正确进行价值评价必须明确“是对谁的价值”和“以谁的需要为尺度”，必须对主体和客体都有正确的认识，并且要与社会历史发展的客观规律相一致。A、B、D 正确。价值评价要以人民群众的需要和利益为最高标准，而求“真”是真理原则的体现，C 错误。\"},{\"id\":\"第5套-多选3\",\"set\":5,\"type\":\"多选\",\"idx\":3,\"no\":19,\"stem\":\"经济危机实际上是资本主义条件下以强制的方式解决社会再生产的实现问题的途径，这种解决方式虽然最终也能够使社会再生产由失衡慢慢转变为平衡，却是以社会经济生活的严重混乱甚至瘫痪以及社会资源和财富的极大浪费为代价的。以下关于经济危机的认识，正确的有（ ）\",\"opts\":[[\"A\",\"只要存在资本主义制度，经济危机就是不可避免的\"],[\"B\",\"资本主义经济危机具有周期性，这是由社会资本再生产的周期性决定的\"],[\"C\",\"生产相对过剩是资本主义经济危机的本质特征\"],[\"D\",\"经济危机的抽象的一般的可能性，首先是由货币作为流通手段和支付手段引起的\"]],\"ans\":\"ACD\",\"exp\":\"生产相对过剩是资本主义经济危机的本质特征（C 正确）。经济危机爆发的根本原因是资本主义的基本矛盾，只要存在资本主义制度，经济危机就是不可避免的（A 正确）。经济危机的抽象的一般的可能性，首先是由货币作为流通手段和支付手段引起的（D 正确）。资本主义经济危机具有周期性，这是由资本主义基本矛盾运动的阶段性决定的，而不是由社会资本再生产的周期性决定的（恰恰相反，社会资本再生产的周期性是由经济危机的周期性决定的），B 错误。\"},{\"id\":\"第5套-多选4\",\"set\":5,\"type\":\"多选\",\"idx\":4,\"no\":20,\"stem\":\"垄断资本在国内建立了垄断统治后，必然要把其统治势力扩展到国外，建立国际垄断统治。垄断资本向世界范围扩展的基本形式有借贷资本输出、生产资本输出和商品资本输出。从输出资本的主体看，主要有两种：一种是私人资本输出，另一种是国家资本输出。国家资本输出主要包括（ ）\",\"opts\":[[\"A\",\"政府及其所属金融机构的对外贷款\"],[\"B\",\"政府的对外援助，包括经济援助和军事援助\"],[\"C\",\"向国际机构的投资，如对世界银行、国际开发协会等投资\"],[\"D\",\"政府在国外的资产\"]],\"ans\":\"ABCD\",\"exp\":\"国家资本输出是指资本主义国家的政府、国有企业或国家金融机构向国外输出资本。其主要形式包括：政府及其所属金融机构的对外贷款；政府的对外援助，包括经济援助和军事援助；向国际机构的投资，如对世界银行、国际开发协会等投资；政府在国外的资产。A、B、C、D 全选。\"},{\"id\":\"第5套-多选5\",\"set\":5,\"type\":\"多选\",\"idx\":5,\"no\":21,\"stem\":\"马克思和恩格斯在晚年已经敏锐地关注到资本主义出现新变化的一些苗头，并作了初步的分析，科学论述了和平斗争与暴力革命的关系。1895 年，恩格斯去世前夕在为马克思的《1848 年至 1850 年的法兰西阶级斗争》一书所写的长篇导言中（ ）\",\"opts\":[[\"A\",\"已经认识到社会主义革命的胜利将是一个长期的过程\"],[\"B\",\"论述了利用资产阶级民主和普选权的重要性\"],[\"C\",\"主张通过议会斗争使资本主义“和平长入”社会主义\"],[\"D\",\"提出了社会主义革命可以首先在一个或者几个国家获得胜利\"]],\"ans\":\"AB\",\"exp\":\"1895 年恩格斯在为《1848 年至 1850 年的法兰西阶级斗争》一书写的导言中，已经认识到社会主义革命的胜利将是一个长期的过程，并论述了利用资产阶级民主和普选权的重要性，A、B 正确。主张通过议会斗争使资本主义“和平长入”社会主义，是第二国际修正主义者（如伯恩施坦）的观点，恩格斯从未放弃暴力革命原则，C 错误。提出社会主义革命可以首先在一个或者几个国家获得胜利的是列宁，而不是恩格斯，D 错误。\"},{\"id\":\"第5套-多选6\",\"set\":5,\"type\":\"多选\",\"idx\":6,\"no\":22,\"stem\":\"以毛泽东为核心的第一代中央领导集体在创建新中国和探索适合中国情况的社会主义建设道路过程中，形成了一系列重要的理论，主要有（ ）\",\"opts\":[[\"A\",\"在社会主义经济建设方面，实行以农业为基础，以工业为主导，以农轻重为序发展国民经济的总方针\"],[\"B\",\"社会主义可以分为不发达的社会主义和比较发达的社会主义两个阶段，后一阶段可能比前一阶段需要更长的时间\"],[\"C\",\"应当采取“两步走”的发展战略，把中国建设成为一个具有现代农业、现代工业、现代国防和现代科学技术的社会主义强国\"],[\"D\",\"发展面向现代化、面向世界、面向未来的，民族的科学的大众的社会主义文化\"]],\"ans\":\"ABC\",\"exp\":\"以毛泽东为核心的第一代中央领导集体在探索适合中国情况的社会主义建设道路过程中，提出：在社会主义经济建设方面，实行以农业为基础、以工业为主导、以农轻重为序发展国民经济的总方针；社会主义可以分为不发达的社会主义和比较发达的社会主义两个阶段，后一阶段可能比前一阶段需要更长的时间；应当采取“两步走”的发展战略，把中国建设成为一个“四个现代化”的社会主义强国。A、B、C 正确。“发展面向现代化、面向世界、面向未来的，民族的科学的大众的社会主义文化”是改革开放后（党的十五大等）提出的，不属于毛泽东为核心的第一代中央领导集体的理论成果，D 错误。\"},{\"id\":\"第5套-多选7\",\"set\":5,\"type\":\"多选\",\"idx\":7,\"no\":23,\"stem\":\"中国特色社会主义进入新时代，我国社会主要矛盾已经转化为人民日益增长的美好生活需要和不平衡不充分的发展之间的矛盾。新时代我国社会主要矛盾的变化（ ）\",\"opts\":[[\"A\",\"是在社会主义初级阶段中发生的变化\"],[\"B\",\"是关系全局的历史性变化\"],[\"C\",\"没有改变我国仍处于并将长期处于社会主义初级阶段的基本国情\"],[\"D\",\"没有改变我国是世界最大发展中国家的国际地位\"]],\"ans\":\"ABCD\",\"exp\":\"我国社会主要矛盾的变化是关系全局的历史性变化，对党和国家工作提出了许多新要求。但同时必须认识到，我国社会主要矛盾的变化，没有改变我们对我国社会主义所处历史阶段的判断，我国仍处于并将长期处于社会主义初级阶段的基本国情没有变，我国是世界最大发展中国家的国际地位没有变。这一变化是在社会主义初级阶段中发生的变化。A、B、C、D 全选。\"},{\"id\":\"第5套-多选8\",\"set\":5,\"type\":\"多选\",\"idx\":8,\"no\":24,\"stem\":\"2026 年 1 月 20 日，习近平总书记在省部级主要领导干部学习贯彻党的二十届四中全会精神专题研讨班上发表讲话，强调扎扎实实建设现代化产业体系，把发展经济的着力点放在实体经济上。之所以要把实体经济作为发展经济的着力点，是因为实体经济是（ ）\",\"opts\":[[\"A\",\"一国经济的立身之本\"],[\"B\",\"财富创造的根本源泉\"],[\"C\",\"民族复兴的根基\"],[\"D\",\"国家强盛的重要支柱\"]],\"ans\":\"ABD\",\"exp\":\"实体经济是一国经济的立身之本，是财富创造的根本源泉，是国家强盛的重要支柱，A、B、D 正确。国家安全是民族复兴的根基，C 错误。\"},{\"id\":\"第5套-多选12\",\"set\":5,\"type\":\"多选\",\"idx\":12,\"no\":28,\"stem\":\"1935 年 1 月 15 日至 17 日，党中央召开遵义会议，这是改变中国革命命运的三天。遵义会议的召开，有一个过程。从湘江战役到遵义会议，党中央召开了一系列会议，这些会议给遵义会议的召开作了准备，这些会议有（ ）\",\"opts\":[[\"A\",\"通道会议\"],[\"B\",\"黎平会议\"],[\"C\",\"猴场会议\"],[\"D\",\"扎西会议\"]],\"ans\":\"ABC\",\"exp\":\"习近平总书记在贵州和云南考察时曾经说过：“从通道转兵到黎平会议，从猴场会议到遵义会议，这是一条红军的生路，一条共产党的生路。”长征途中，经过通道会议、黎平会议、猴场会议的准备，实现伟大转折的遵义会议于 1935 年 1 月召开，党独立自主解决中国革命实际问题的新篇章就此郑重翻开。A、B、C 正确。扎西会议是在遵义会议之后（1935 年 2 月）召开的，D 错误。\"},{\"id\":\"第5套-多选13\",\"set\":5,\"type\":\"多选\",\"idx\":13,\"no\":29,\"stem\":\"新中国成立伊始，面临许多严重困难和紧迫问题。这对于刚刚执掌全国政权的中国共产党来说，是新的严峻考验。面对这些困难和严峻考验，中国共产党和人民政府采取一系列积极稳健的政策措施，有条不紊地领导全国各族人民进行捍卫巩固新政权、建设新中国的伟大斗争。从新中国成立到 1952 年底，国民经济得到全面恢复和初步发展，这一阶段党和政府在恢复国民经济、为社会主义改造创造条件方面取得的成就有（ ）\",\"opts\":[[\"A\",\"确立起社会主义性质的国营经济在国民经济中的领导地位\"],[\"B\",\"实现了全国财政经济工作的统一管理和统一领导\"],[\"C\",\"结束了人民过了几十年的因物价飞涨而带来的痛苦生活\"],[\"D\",\"建立了独立的比较完整的工业体系和国民经济体系\"]],\"ans\":\"ABC\",\"exp\":\"从新中国成立到 1952 年底，党和政府通过没收官僚资本，确立起社会主义性质的国营经济在国民经济中的领导地位；通过组织“银元之战”和“米棉之战”，实现了全国财政经济工作的统一管理和统一领导，到 1950 年 3 月物价基本稳定，结束了人民过了几十年的因物价飞涨而带来的痛苦生活。A、B、C 正确。经过实施几个五年计划，我国才建立起独立的比较完整的工业体系和国民经济体系，D 错误。\"},{\"id\":\"第5套-多选14\",\"set\":5,\"type\":\"多选\",\"idx\":14,\"no\":30,\"stem\":\"如果说，过去人们在打夯时需要有统一的“号子”，这样不同的人才能协同一致，劲往一处使。那么可以说，社会主义核心价值观就是当今中华民族、全体中华儿女心往一处想、劲往一处使的“号子”，是凝聚人心、汇聚民力的强大力量。这是因为社会主义核心价值观具有（ ）\",\"opts\":[[\"A\",\"先进性\"],[\"B\",\"人民性\"],[\"C\",\"普适性\"],[\"D\",\"真实性\"]],\"ans\":\"ABD\",\"exp\":\"真理的力量加上道义的力量，才能行之久远。社会主义核心价值观以其先进性、人民性、真实性站在人类道义制高点上，彰显出独特而强大的价值观优势。A、B、D 正确。社会主义核心价值观不是西方所谓抽象的“普世价值”或“普适性”，C 错误。\"},{\"id\":\"第5套-多选15\",\"set\":5,\"type\":\"多选\",\"idx\":15,\"no\":31,\"stem\":\"自 1986 年以来，我国已连续实施完成了八个五年普法规划。2026 年 7 月，中共中央、国务院转发《中央宣传部、司法部关于开展法治宣传教育的第九个五年规划（2026~2030 年）》，对法治宣传教育作出新的全面部署。法律之威，不在条文之密，而在信仰之深。加强法治宣传教育，有利于（ ）\",\"opts\":[[\"A\",\"使法治宣传教育真正成为法治的龙头环节\"],[\"B\",\"提升全民法治素养和社会治理法治化水平\"],[\"C\",\"形成全社会尊法学法守法用法的良好氛围\"],[\"D\",\"夯实全面依法治国的社会基础\"]],\"ans\":\"BCD\",\"exp\":\"《中华人民共和国法治宣传教育法》“总则”第一条规定：为了加强法治宣传教育，提升全民法治素养和社会治理法治化水平，形成全社会尊法学法守法用法的良好氛围，夯实全面依法治国的社会基础，推动建设更高水平的社会主义法治国家，根据宪法，制定本法。B、C、D 正确。科学立法是全面依法治国的前提，立法是法治的龙头环节，A 错误。\"},{\"id\":\"第5套-多选17\",\"set\":5,\"type\":\"多选\",\"idx\":17,\"no\":33,\"stem\":\"2026 年 9 月 1 日，国家主席习近平在比什凯克召开的“上海合作组织+”会议上发表题为《共同倡导平等有序的世界多极化 实现更加公正合理的全球治理》的讲话。习近平主席以我们需要什么样的多极化破题，从根本原则、必然要求、关键路径、发展方向 4 个维度深入阐释平等有序世界多极化的核心要义，呼吁上合组织（ ）\",\"opts\":[[\"A\",\"以“上合力量”驱动亚欧大陆繁荣共兴\"],[\"B\",\"以“上合智慧”推动全球南方发展壮大\"],[\"C\",\"以“上合行动”引领全球治理改革完善\"],[\"D\",\"以“上合方案”构建人类命运共同体\"]],\"ans\":\"ABC\",\"exp\":\"习近平主席在讲话中指出，一个更加团结、更有活力的上海合作组织完全能够为推进平等有序的世界多极化贡献更大力量。第一，以“上合力量”驱动亚欧大陆繁荣共兴。第二，以“上合智慧”推动全球南方发展壮大。第三，以“上合行动”引领全球治理改革完善。A、B、C 正确，D 错误。\"},{\"id\":\"第6套-单选2\",\"set\":6,\"type\":\"单选\",\"idx\":2,\"no\":2,\"stem\":\"湖北省五峰土家族自治县，群山之间，绿树成荫，蜜蜂飞舞。五峰县地处武陵山区，当地依托山高林密、花源丰富的优势，探索推进“林药蜂”生态产业模式。“林药蜂”模式，即上层培育黄柏、五倍子等乡土树种、蜜源植物，中层套种黄精等中药材，林下放养蜜蜂，形成“林养蜂、蜂促药、药护林”的良性互动，“长期得林、中期得药、短期得蜜”，实现生态效益和经济效益的双赢。“林药蜂”模式的成功是因为人们（ ）\",\"opts\":[[\"A\",\"利用了事物之间的普遍联系\"],[\"B\",\"改变了自然界的客观实在性\"],[\"C\",\"避免了人与自然的物质变换\"],[\"D\",\"创造了有利于人的自然规律\"]],\"ans\":\"A\",\"exp\":\"题干中，“林药蜂”模式形成“林养蜂、蜂促药、药护林”的良性互动，实现了生态效益和经济效益的双赢，这是人们在认识和把握事物之间普遍联系的基础上，遵循自然规律、合理利用生态联系的结果，A 正确。自然界具有客观实在性，规律具有客观性，人不能改变自然界的客观实在性，也不能创造自然规律，B、D 错误。人与自然之间始终存在物质变换，人只能在尊重自然规律的前提下合理调节和控制这种物质变换，而不能避免，C 错误。\"},{\"id\":\"第6套-单选3\",\"set\":6,\"type\":\"单选\",\"idx\":3,\"no\":3,\"stem\":\"社会生产是连续不断地进行的，这种连续不断重复的生产就是再生产。社会再生产的核心问题是（ ）\",\"opts\":[[\"A\",\"两大部类在总量上的比例问题\"],[\"B\",\"社会总产品的价值补偿和实物补偿问题\"],[\"C\",\"工资与剩余价值的分配问题\"],[\"D\",\"劳动过程和价值增殖过程的统一问题\"]],\"ans\":\"B\",\"exp\":\"社会再生产的核心问题是社会总产品的实现问题，即社会总产品的价值补偿和实物补偿问题，B 正确。A、C、D 均不是社会再生产的核心问题。\"},{\"id\":\"第6套-单选5\",\"set\":6,\"type\":\"单选\",\"idx\":5,\"no\":5,\"stem\":\"毛泽东思想是在总结我国革命和建设正反两方面历史经验的基础上，逐步形成和发展起来的。毛泽东思想初步形成的标志是提出并深入阐述（ ）\",\"opts\":[[\"A\",\"实事求是的思想路线\"],[\"B\",\"新民主主义理论\"],[\"C\",\"农村包围城市、武装夺取政权的思想\"],[\"D\",\"中国革命的首要问题\"]],\"ans\":\"C\",\"exp\":\"土地革命战争时期，毛泽东提出并深入阐述了农村包围城市、武装夺取政权的思想，标志着毛泽东思想的初步形成，C 正确。新民主主义理论的系统阐述标志着毛泽东思想得到多方面展开而趋于成熟，B 错误。A、D 均不是毛泽东思想初步形成的标志。\"},{\"id\":\"第6套-单选6\",\"set\":6,\"type\":\"单选\",\"idx\":6,\"no\":6,\"stem\":\"邓小平指出，“我们搞改革开放，把工作重心放在经济建设上，没有丢马克思，没有丢列宁，也没有丢毛泽东。老祖宗不能丢啊！问题是要把什么叫社会主义搞清楚，把怎么样建设和发展社会主义搞清楚。”搞清楚什么是社会主义，怎样建设社会主义，关键是要在坚持社会主义基本制度的基础上（ ）\",\"opts\":[[\"A\",\"进一步拓展党的基本路线\"],[\"B\",\"进一步认清社会主义的本质\"],[\"C\",\"进一步健全社会主义上层建筑\"],[\"D\",\"进一步回答“实现什么样的发展、怎样发展”的问题\"]],\"ans\":\"B\",\"exp\":\"搞清楚什么是社会主义、怎样建设社会主义，关键是要在坚持社会主义基本制度的基础上进一步认清社会主义的本质，B 正确。D 是科学发展观回答的问题，A、C 不符合题意。\"},{\"id\":\"第6套-单选9\",\"set\":6,\"type\":\"单选\",\"idx\":9,\"no\":9,\"stem\":\"习近平党建思想内涵丰富、逻辑严整、系统完备、体用贯通，形成了以“十四个坚持”为“四梁八柱”的科学体系。“十四个坚持”中的“坚持健全上下贯通、执行有力的组织体系”是（ ）\",\"opts\":[[\"A\",\"关系党和国家事业的关键性问题\"],[\"B\",\"全面从严治党需要牢牢牵住的“牛鼻子”\"],[\"C\",\"全面从严治党的治本之策\"],[\"D\",\"党的优势所在、力量所在\"]],\"ans\":\"D\",\"exp\":\"严密的组织体系是党的优势所在、力量所在。坚持健全上下贯通、执行有力的组织体系，是党的优势所在、力量所在，D 正确。A 是坚持加强党对一切工作的领导或坚持党的全面领导的相关表述；B 是牢牢牵住责任制这个“牛鼻子”；C 是坚持制度治党、依规治党。\"},{\"id\":\"第6套-单选10\",\"set\":6,\"type\":\"单选\",\"idx\":10,\"no\":10,\"stem\":\"从 1840 年至 1919 年的 80 年间，中国人民对外来侵略进行了英勇顽强的反抗。但历次的反侵略战争，都是以中国失败、中国政府被迫签订丧权辱国的条约而告结束的。近代中国反侵略战争屡遭失败的最重要的原因是（ ）\",\"opts\":[[\"A\",\"社会制度腐败\"],[\"B\",\"军事战略错误\"],[\"C\",\"经济技术落后\"],[\"D\",\"思想观念保守\"]],\"ans\":\"A\",\"exp\":\"近代中国反侵略战争屡遭失败，一是社会制度腐败，二是经济技术落后。其中，社会制度腐败是最根本、最重要的原因，A 正确。\"},{\"id\":\"第6套-单选11\",\"set\":6,\"type\":\"单选\",\"idx\":11,\"no\":11,\"stem\":\"土地革命战争时期，党从残酷的现实中认识到，没有革命的武装就无法战胜武装的反革命，就无法夺取中国革命胜利，就无法改变中国人民和中华民族的命运，必须以武装的革命反对武装的反革命。党领导举行了南昌起义、秋收起义、广州起义和其他许多地区起义。其中，秋收起义不同于南昌起义的特点有\",\"opts\":[[\"A\",\"①②\"],[\"B\",\"①③\"],[\"C\",\"②④\"],[\"D\",\"③④\"]],\"ans\":\"C\",\"exp\":\"1927 年 9 月，毛泽东领导发动湘赣边界秋收起义。与南昌起义相比，秋收起义的特点在于：公开打出了“工农革命军”的旗帜（南昌起义仍沿用国民革命军第二方面军番号）；不仅是军队的行动，而且有数量众多的工农武装参加。因此 ②④ 正确，选 C。秋收起义最初的目标仍是攻占中心城市长沙，① 错误；南昌起义和秋收起义都是中国共产党独立领导的革命战争，③ 是两者的共同点而非不同点。\"},{\"id\":\"第6套-单选12\",\"set\":6,\"type\":\"单选\",\"idx\":12,\"no\":12,\"stem\":\"中国革命的发生和胜利不是偶然的，而是有着深刻的社会根源和雄厚的群众基础。由于帝国主义、封建主义、官僚资本主义的残酷压迫，中国人民走上了反帝、反封建、反官僚资本主义斗争的伟大道路。在中国革命过程中，曾经被人称作“开万国未有之奇”的一种现象是（ ）\",\"opts\":[[\"A\",\"工人阶级成为革命的领导力量\"],[\"B\",\"农民、城市小资产阶级群众是革命的主要力量\"],[\"C\",\"封建势力同外国侵略势力相勾结\"],[\"D\",\"随着斗争的发展，民族资产阶级也逐步向共产党靠拢\"]],\"ans\":\"B\",\"exp\":\"在中国革命过程中，农民、城市小资产阶级群众是革命的主要力量。中国革命之所以能坚持长期的武装斗争并最终取得胜利，一个极其重要的原因就是得到了广大农民群众的拥护和支持，这曾被人称作“开万国未有之奇”，B 正确。\"},{\"id\":\"第6套-单选15\",\"set\":6,\"type\":\"单选\",\"idx\":15,\"no\":15,\"stem\":\"《中共中央办公厅国务院办公厅关于做好第二轮土地承包到期后再延长三十年试点工作的意见》于 2026 年 3 月 18 日公开发布。《意见》对第二轮土地承包到期后再延长 30 年试点工作作了具体部署安排。以家庭承包经营为基础、统分结合的双层经营体制，是我国农村基本经营制度，是党的农村政策的基石。维护农民土地承包经营权的关键是（ ）\",\"opts\":[[\"A\",\"坚持集体所有制不动摇\"],[\"B\",\"坚持农民主体地位\"],[\"C\",\"坚持承包地所有权、承包权、经营权“三权分置”\"],[\"D\",\"现有农村土地承包关系保持稳定并长久不变\"]],\"ans\":\"D\",\"exp\":\"维护农民土地承包经营权的关键是现有农村土地承包关系保持稳定并长久不变，第二轮土地承包到期后再延长 30 年，正是保持农村土地承包关系稳定并长久不变的重大举措，D 正确。\"},{\"id\":\"第6套-多选3\",\"set\":6,\"type\":\"多选\",\"idx\":3,\"no\":19,\"stem\":\"资本主义生产的唯一动机和直接目的就是追求剩余价值。为了达到这一目的，资本家便尽可能改进技术，提高劳动生产率，加快资本积累，通过资本积聚和资本集中扩大生产规模。在生产技术水平不断提高的条件下，资本积累不断增长，必然伴随着资本的积聚和集中，使个别资本的规模日益增大。这一过程的结果是（ ）\",\"opts\":[[\"A\",\"每个劳动力所推动的生产资料的数量大幅度增加\"],[\"B\",\"可变资本在资本总额中所占的比重日益下降\"],[\"C\",\"不可避免地造成大批工人失业，形成相对过剩人口\"],[\"D\",\"资产阶级政府不得不通过各种干预措施来彻底消灭失业\"]],\"ans\":\"ABC\",\"exp\":\"在生产技术水平不断提高的条件下，资本积累不断增长，资本有机构成不断提高，具体表现为每个劳动力所推动的生产资料的数量大幅度增加，不变资本比重上升、可变资本在资本总额中所占的比重日益下降，从而对劳动力的需求相对减少，不可避免地造成大批工人失业，形成相对过剩人口，A、B、C 正确。资本主义制度下不可能“彻底消灭失业”，D 错误。\"},{\"id\":\"第6套-多选9\",\"set\":6,\"type\":\"多选\",\"idx\":9,\"no\":25,\"stem\":\"2003 年，时任英国财政大臣布朗到访中国，竟发出这样的言论：英国从中国进口了越来越多的家电、服装和其他东西，但可以用出口的一样东西来平衡，那就是英语。这是产业之殇，更是文化之痛！如今，中国文化产业呈现出新气象。实打实的数据让人震撼：中国网文海外活跃用户达 2 亿人，覆盖 200 多个国家和地区；中国网游《鸣潮》风靡世界，登顶超 100 个国家和地区手游排行榜；微短剧相关海外应用超 300 款，全球累计下载量突破 4.7 亿次……从“文化逆差”的举步维艰，到“文化出海”的风生水起，中国文化产业实现了华丽转身。这个华丽转身是中国文化大发展大繁荣的真实写照，其原因在于（ ）\",\"opts\":[[\"A\",\"经济底气托起了文化丰盈\"],[\"B\",\"政策引领照亮了文化航向\"],[\"C\",\"科技赋能舒展了文化羽翼\"],[\"D\",\"教育普及培育了丰厚人才\"]],\"ans\":\"ABC\",\"exp\":\"中国文化产业从“文化逆差”到“文化出海”的华丽转身，原因在于：经济底气托起了文化丰盈，政策引领照亮了文化航向，科技赋能舒展了文化羽翼，A、B、C 正确。D 项在材料与标准阐释中未作为该“华丽转身”的核心归因。\"},{\"id\":\"第6套-多选10\",\"set\":6,\"type\":\"多选\",\"idx\":10,\"no\":26,\"stem\":\"2026 年 2 月 4 日，香港特别行政区行政长官李家超正式对外宣布：“将领导特区政府不同政策局和部门，主动对接国家‘十五五’规划框架，并首次制定香港的五年规划。”“香港五年规划”迅速成为舆论焦点，受到海内外广泛关注。9 月 16 日，《香港特别行政区经济和社会发展第一个五年规划（2026—2030 年）》公布。香港制定首个五年规划（ ）\",\"opts\":[[\"A\",\"体现了全国一盘棋、集中力量办大事的制度优势\"],[\"B\",\"有利于提升香港特区政府和社会各界的战略、宏观和长远思维\"],[\"C\",\"有助于香港在融入和服务国家发展大局中实现自身更好发展\"],[\"D\",\"让企业在投资、布局、转型上有更加清晰的未来视野，更好融入国内国际双循环\"]],\"ans\":\"ABCD\",\"exp\":\"香港制定首个五年规划，主动对接国家“十五五”规划框架，体现了全国一盘棋、集中力量办大事的制度优势，有利于提升香港特区政府和社会各界的战略、宏观和长远思维，有助于香港在融入和服务国家发展大局中实现自身更好发展，也让企业在投资、布局、转型上有更加清晰的未来视野，更好融入国内国际双循环，A、B、C、D 全选。\"},{\"id\":\"第6套-多选11\",\"set\":6,\"type\":\"多选\",\"idx\":11,\"no\":27,\"stem\":\"1927 年 4 月 12 日，蒋介石在上海发动反革命政变。同年 7 月 15 日，汪精卫在武汉召开“分共”会议，并在其辖区内对共产党员和革命群众实行搜捕和屠杀，国共合作全面破裂，大革命最终失败。大革命虽然失败了，但它的历史意义仍然是不可磨灭的。正是在这个时期，中国共产党人进行了轰轰烈烈的革命工作，领导了全国反帝反封建的伟大斗争，在中国革命史上写下了光荣的一页，同时（ ）\",\"opts\":[[\"A\",\"开始探索马克思主义中国化的途径\"],[\"B\",\"初步提出了新民主主义革命的基本思想\"],[\"C\",\"开始建立人民民主统一战线\"],[\"D\",\"开始懂得进行土地革命和掌握革命武装的重要性\"]],\"ans\":\"ABD\",\"exp\":\"大革命虽然失败了，但它的历史意义仍然是不可磨灭的。正是在这个时期，中国共产党人进行了轰轰烈烈的革命工作，领导了全国反帝反封建的伟大斗争，在中国革命史上写下了光荣的一页，同时开始探索马克思主义中国化的途径，初步提出了新民主主义革命的基本思想，并从大革命的失败中汲取深刻历史教训，开始懂得进行土地革命和掌握革命武装的重要性，A、B、D 正确。人民民主统一战线是解放战争时期建立的，C 错误。\"},{\"id\":\"第6套-多选13\",\"set\":6,\"type\":\"多选\",\"idx\":13,\"no\":29,\"stem\":\"1978 年 12 月，党召开十一届三中全会，实现了新中国成立以来党的历史上具有深远意义的伟大转折。党的十一届三中全会（ ）\",\"opts\":[[\"A\",\"重新确立解放思想、实事求是的思想路线\"],[\"B\",\"停止使用“以阶级斗争为纲”的错误提法\"],[\"C\",\"作出把党和国家工作中心转移到经济建设上来、实行改革开放的历史性决策\"],[\"D\",\"成为正本清源、拨乱反正和改革开放的思想先导\"]],\"ans\":\"ABC\",\"exp\":\"习近平总书记在纪念邓小平同志诞辰 120 周年座谈会上的讲话中指出，在邓小平指导下，党的十一届三中全会重新确立解放思想、实事求是的思想路线，停止使用“以阶级斗争为纲”的错误提法，作出把党和国家工作中心转移到经济建设上来、实行改革开放的历史性决策，实现了党的历史上具有深远意义的伟大转折，A、B、C 正确。关于真理标准问题的大讨论，是一场深刻而广泛的马克思主义思想解放运动，成为正本清源、拨乱反正和改革开放的思想先导，D 错误。\"},{\"id\":\"第6套-多选14\",\"set\":6,\"type\":\"多选\",\"idx\":14,\"no\":30,\"stem\":\"马克思说：“我们知道个人是微弱的，但是我们也知道整体就是力量。”在我国革命、建设、改革的历程中，在我国抗疫、抗震、抗灾等斗争中，集体主义从未缺席。长期以来，集体主义已经成为调节国家利益、社会整体利益和个人利益关系的基本原则。集体主义（ ）\",\"opts\":[[\"A\",\"强调国家利益、社会整体利益和个人利益的辩证统一\"],[\"B\",\"强调国家利益、社会整体利益高于个人利益\"],[\"C\",\"强调抑制个人利益来发展国家利益、社会整体利益\"],[\"D\",\"重视和保障个人的正当利益\"]],\"ans\":\"ABD\",\"exp\":\"集体主义强调国家利益、社会整体利益和个人利益的辩证统一；强调国家利益、社会整体利益高于个人利益；重视和保障个人的正当利益，促进和保障个人正当利益的实现，使个人的才能、价值得到充分的发挥，A、B、D 正确。在现实生活中，国家利益、社会整体利益和个人利益是相辅相成的，不能靠抑制一方来发展另一方，而是要力求做到共同发展、相互增益、相得益彰，C 错误。\"},{\"id\":\"第6套-多选15\",\"set\":6,\"type\":\"多选\",\"idx\":15,\"no\":31,\"stem\":\"现实中，一些用人单位借助技术发展，“扩大”对员工的管理权限，通过工位摄像头、后台监控等手段，监测劳动者的一举一动。例如，广东一企业以监控发现劳动者“闭眼 3 分钟”休息为由，要求解除劳动合同。一些企业利用工作软件把“随时在线”当作劳动者的默示义务，甚至因为劳动者在非工作时间未及时回复群消息，就对其随意作出处分、降薪甚至解除劳动合同的处理。此外，还有企业利用算法设置隐形门槛，对女性、35 岁以上群体求职者自动过滤，甚至有的企业“组成联盟”将“和原用人单位发生过纠纷者”的简历做特殊技术标注，让就业歧视披上了“技术中立”的隐形外衣。数字技术的演进，不能异化为侵害劳动者权益的“数字枷锁”。上述行为侵害了劳动者人身权利和社会经济权利中的（ ）\",\"opts\":[[\"A\",\"人格尊严权\"],[\"B\",\"表达权\"],[\"C\",\"劳动权\"],[\"D\",\"休息权\"]],\"ans\":\"ACD\",\"exp\":\"题干材料中列举的行为（监测劳动者的一举一动、挤占劳动者休息时间、就业歧视等），本质上是对劳动者人格尊严权、劳动权、休息权等法定权益的侵害。个人信息保护法明确了个人信息处理的最小必要原则，劳动法、劳动合同法等对用人单位规章制度制定、劳动合同解除设置了严格法定程序，就业促进法更是明令禁止各类就业歧视。任何技术应用都不能突破法律的刚性约束，更不能成为侵权免责的“挡箭牌”。A、C、D 正确。表达权属于政治权利，不属于提问限定的人身权利和社会经济权利，B 不符合题意。\\n点拨：① 人格尊严权，是指与人身有密切联系的名誉、姓名、肖像等不容侵犯的权利。人格尊严权的基本内容有姓名权、肖像权、名誉权、荣誉权、隐私权等。② 劳动权，是指一切有劳动能力的公民有获得劳动的机会和适当的劳动条件和报酬的权利。劳动权包括平等就业和选择职业的权利、取得劳动报酬的权利、休息休假的权利、获得劳动安全卫生的权利、提请劳动争议处理的权利等。③ 休息权，是指劳动者在付出一定的劳动以后所享有的休息和休养的权利，是劳动权存在和发展的基础。休息权和劳动权是密切联系的，休息权是提高劳动效率、保障劳动者的生活和身体健康所必需的。\"},{\"id\":\"第7套-单选2\",\"set\":7,\"type\":\"单选\",\"idx\":2,\"no\":2,\"stem\":\"2026 年 7 月 8 日，北京人民大会堂群星闪耀、荣光汇聚。习近平总书记为国家最高科学技术奖获得者等颁奖并发表重要讲话。“科技创新要突出应用导向”“产业创新要提出科学问题”，给出了科技创新与产业创新深度融合的方向指引。“产业创新要提出科学问题”这一要求蕴含的哲学道理主要是（ ）\",\"opts\":[[\"A\",\"实践水平的提高有赖于认识水平的提高\"],[\"B\",\"实践是认识发展的动力\"],[\"C\",\"认识总是超前于实践\"],[\"D\",\"认识活动是客观规律性与主观能动性统一的基础\"]],\"ans\":\"B\",\"exp\":\"“产业创新要提出科学问题”，强调产业实践中产生的新需求、新课题推动科学研究和认识不断深化，体现了实践是认识发展的动力，B 正确。实践决定认识，认识水平的提高归根到底有赖于实践水平的提高，A 颠倒了二者关系。认识有时超前于实践，有时落后于实践，并非“总是超前于实践”，C 错误。实践是客观规律性与主观能动性统一的基础，D 错误。\"},{\"id\":\"第7套-单选4\",\"set\":7,\"type\":\"单选\",\"idx\":4,\"no\":4,\"stem\":\"在生产技术水平不断提高的条件下，随着资本积累的增长，必然伴随着资本的积聚和集中，使个别资本的规模日益增大。资本集中是指个别资本通过结合而形成较大的资本。资本集中最强有力的杠杆是（ ）\",\"opts\":[[\"A\",\"投资和借贷\"],[\"B\",\"竞争和信用\"],[\"C\",\"资本原始积累\"],[\"D\",\"生产自动化\"]],\"ans\":\"B\",\"exp\":\"在资本主义生产过程中，资本集中是指大资本吞并小资本，或由许多小资本合并而成大资本，即个别资本通过结合而形成较大的资本。竞争和信用是资本集中最强有力的两个杠杆，B 正确，A、C、D 不符合题意。\"},{\"id\":\"第7套-单选5\",\"set\":7,\"type\":\"单选\",\"idx\":5,\"no\":5,\"stem\":\"认清中国国情，是解决中国革命问题的基本前提。1939 年毛泽东在《中国革命和中国共产党》中指出，中国是在许多帝国主义国家的统治或半统治之下，实际上处于长期的不统一状态，再加上土地广大，其结果是（ ）\",\"opts\":[[\"A\",\"帝国主义侵略势力日益成为直接统治中国的决定性力量\"],[\"B\",\"封建经济在社会经济生活中占着显然的优势\"],[\"C\",\"经济、政治和文化的发展表现出极端的不平衡\"],[\"D\",\"资产阶级成为资本-帝国主义压迫、奴役中国人民的社会基础\"]],\"ans\":\"C\",\"exp\":\"1939 年毛泽东在《中国革命和中国共产党》中分析了近代中国半殖民地半封建社会的基本特点：第一，帝国主义侵略势力日益成为直接统治中国的决定性力量；第二，封建势力同帝国主义相勾结，成为资本-帝国主义压迫、奴役中国人民的社会基础和统治支柱（D 错误）；第三，封建剥削制度的根基依然保持着，封建经济在社会经济生活中占着显然的优势；第四，民族资本主义经济在很大程度上依附于外国资本主义和本国封建势力；第五，中国是在许多帝国主义国家的统治或半统治之下，实际上处于长期的不统一状态，再加上土地广大，其结果是中国的经济、政治和文化的发展表现出极端的不平衡（C 正确）。A、B 均为前几条特点的表述，不符合题干因果指向。\"},{\"id\":\"第7套-单选6\",\"set\":7,\"type\":\"单选\",\"idx\":6,\"no\":6,\"stem\":\"1957 年 2 月，毛泽东作了《关于正确处理人民内部矛盾的问题》的报告，指出：“在社会主义社会中，基本的矛盾仍然是生产关系和生产力之间的矛盾，上层建筑和经济基础之间的矛盾。”社会主义社会的基本矛盾同以往社会的基本矛盾“具有根本不同的性质和情况”。这里所说的“不同的”“情况”是指（ ）\",\"opts\":[[\"A\",\"社会主义社会的矛盾反映在政治上可以划分为敌我矛盾和人民内部矛盾\"],[\"B\",\"社会主义社会基本矛盾运动是“又相适应又相矛盾”\"],[\"C\",\"社会主义社会的基本矛盾既是对抗性的又是非对抗性的\"],[\"D\",\"社会主义社会的所有矛盾都必须采用民主的方法来解决\"]],\"ans\":\"B\",\"exp\":\"毛泽东指出，社会主义社会的基本矛盾同旧社会的基本矛盾具有根本不同的性质和情况。其中，“不同的性质”是指社会主义社会的基本矛盾是非对抗性的（不是对抗性的，C 错误）；“不同的情况”是指社会主义社会基本矛盾运动是“又相适应又相矛盾”的，可以通过社会主义制度本身的自我调整和自我完善不断得到解决，B 正确。A 说的是社会主义社会的两类不同性质的矛盾，而非基本矛盾的“情况”。人民内部矛盾用民主的方法解决，敌我矛盾用专政的方法解决，D 错误。\"},{\"id\":\"第7套-单选8\",\"set\":7,\"type\":\"单选\",\"idx\":8,\"no\":8,\"stem\":\"新时代以来，以习近平同志为核心的党中央高度重视服务业的发展。目前，服务业已经成为我国国民经济第一大产业，对外开放水平也持续提升，由此带动我国服务贸易跃居世界前列、服务业成为吸收外资主要渠道。努力开创服务业高质量发展新局面，要深刻认识和把握科学方法与基本路径。促进服务业优质高效发展的基本路径是（ ）\",\"opts\":[[\"A\",\"科技赋能\"],[\"B\",\"需求牵引\"],[\"C\",\"改革攻坚\"],[\"D\",\"扩能提质\"]],\"ans\":\"D\",\"exp\":\"促进服务业优质高效发展，要把握“扩能提质”的基本路径，“科技赋能”的重要动力，“需求牵引”的重要导向，以及“改革攻坚”的关键一招。D 正确，A、B、C 不符合题意。\"},{\"id\":\"第7套-单选9\",\"set\":7,\"type\":\"单选\",\"idx\":9,\"no\":9,\"stem\":\"建设美丽中国是全面建设社会主义现代化国家的重要目标。“十五五”时期是美丽中国建设承前启后、扩面提质，实现生态环境根本好转的关键阶段。美丽中国建设，作为牵引的是（ ）\",\"opts\":[[\"A\",\"碳达峰碳中和\"],[\"B\",\"健全生态文明制度体系\"],[\"C\",\"统筹产业结构调整、污染治理、生态保护、应对气候变化\"],[\"D\",\"协同推进降碳、减污、扩绿、增长\"]],\"ans\":\"A\",\"exp\":\"二十届四中全会和“十五五”规划明确提出，以碳达峰碳中和为牵引，协同推进降碳、减污、扩绿、增长，筑牢生态安全屏障，增强绿色发展动能。A 正确，B、C、D 不符合题意。\"},{\"id\":\"第7套-单选11\",\"set\":7,\"type\":\"单选\",\"idx\":11,\"no\":11,\"stem\":\"在新民主主义革命时期，中国共产党与国民党实行过两次合作，第一次是建立国民革命联合战线，第二次是建立抗日民族统一战线。以下选项中正确反映第一次国共合作的是（ ）\",\"opts\":[[\"A\",\"广泛的民族性和复杂的阶级矛盾\"],[\"B\",\"国共双方有政权有军队的合作\"],[\"C\",\"合作双方采取党外合作的组织形式\"],[\"D\",\"合作双方具有共同的政治基础\"]],\"ans\":\"D\",\"exp\":\"孙中山的新三民主义的政纲同中国共产党在民主革命阶段的纲领基本一致，因而成为第一次国共合作的政治基础，D 正确。A、B 是第二次国共合作（抗日民族统一战线）的特点，不选。第一次国共合作采取党内合作的形式（共产党员以个人身份加入国民党），C 错误。\"},{\"id\":\"第7套-单选12\",\"set\":7,\"type\":\"单选\",\"idx\":12,\"no\":12,\"stem\":\"1956 年 9 月 15 日至 27 日，中国共产党第八次全国代表大会在北京举行。中共八大正确分析了国内形势和主要矛盾的变化，明确提出新形势下党和人民的主要任务。大会肯定“三个主体，三个补充”思想，即以国家经营和集体经营、计划生产、国家市场三者为主体，以个体经营、自由生产、自由市场三者为补充。这（ ）\",\"opts\":[[\"A\",\"在理论上完全突破了苏联计划经济模式\"],[\"B\",\"为克服苏联模式弊端提供了重要启示\"],[\"C\",\"初步形成了社会主义市场经济体制\"],[\"D\",\"对过渡时期总路线的提出具有重要意义\"]],\"ans\":\"B\",\"exp\":\"中共八大肯定“三个主体，三个补充”思想，这是在理论上突破苏联计划经济模式、探索经济体制改革的重要尝试，为克服苏联模式弊端提供了重要启示，B 正确。对于苏联计划经济模式，“三个主体，三个补充”思想在理论上没有完全突破，在实践上也只是探索尝试，A、C 错误。中共中央在 1952 年底开始酝酿并于 1953 年正式提出党在过渡时期的总路线，D 错误。\"},{\"id\":\"第7套-单选14\",\"set\":7,\"type\":\"单选\",\"idx\":14,\"no\":14,\"stem\":\"《习近平法治思想学习纲要（2025 年版）》将“坚持依法治国和依规治党有机统一”作为习近平法治思想核心要义的“第十二个坚持”，进一步丰富了习近平法治思想的科学内涵。“坚持依法治国和依规治党有机统一”的根本政治前提是（ ）\",\"opts\":[[\"A\",\"“党的领导和社会主义法治是一致的”\"],[\"B\",\"“既依据宪法法律治国理政，又依据党内法规管党治党、从严治党”\"],[\"C\",\"“发挥依法治国和依规治党的互补性作用”\"],[\"D\",\"“坚持依法治国与制度治党、依规治党统筹推进、一体建设”\"]],\"ans\":\"A\",\"exp\":\"党的十八大以来，习近平总书记从我国具体实际出发，围绕依法治国和依规治党关系提出一系列内涵丰富、论述深刻、逻辑严密的重要论述，深刻阐述了“坚持依法治国和依规治党有机统一”的科学内涵。“党的领导和社会主义法治是一致的”是根本政治前提，“既依据宪法法律治国理政，又依据党内法规管党治党、从严治党”是基本遵循，“发挥依法治国和依规治党的互补性作用”是目标指向，“坚持依法治国与制度治党、依规治党统筹推进、一体建设”是基本路径。A 正确，B、C、D 不符合题意。\"},{\"id\":\"第7套-多选1\",\"set\":7,\"type\":\"多选\",\"idx\":1,\"no\":17,\"stem\":\"纳米是非常小的长度单位，1 纳米等于十亿分之一米。当物质进入纳米尺度后，我们熟悉的许多材料会展现出完全不同的性质。比如纳米大小的黄金颗粒，颜色可以从红色到紫色发生变化，还表现出极强的催化活性。微观世界里，颜色不是来自金本身的金属光泽，而是量子效应与表面效应在起作用。简单来说，进入纳米世界后，材料不只是“变小了”，还拥有了新的能力。在这样的微观世界里，科学家可以操控原子和分子，设计制造具有特殊性能的新材料、新器件，这就是纳米制造。纳米尺度上物质发生的新变化表明（ ）\",\"opts\":[[\"A\",\"世界的物质统一性是多样性的统一\"],[\"B\",\"事物的性质是由其所处的外部时空决定的\"],[\"C\",\"物质的具体形态和具体结构是可变的、相对的\"],[\"D\",\"认识就是在不断推翻先前的真理中不断发展的\"]],\"ans\":\"AC\",\"exp\":\"世界的物质统一性是多样性的统一，物质世界包含着不同的物质现象和物质形态、不同的物质层次和物质结构、不同的物质过程和物质活动，A 正确。物质的具体形态和具体结构是物质的个性，是可变的、相对的；一切具体形态和具有不同结构的物质又都是客观实在，这是不变的、绝对的，C 正确。事物的性质是由主要矛盾的主要方面所决定的，B 错误。相对主义片面夸大真理的相对性，否认真理的绝对性，借口真理是发展的而否认真理内容的客观性，认为原来的真理已经不是真理而将它丢弃或推翻，D 错误。\"},{\"id\":\"第7套-多选5\",\"set\":7,\"type\":\"多选\",\"idx\":5,\"no\":21,\"stem\":\"19 世纪中叶，马克思、恩格斯把社会主义由空想变为科学。为这一飞跃奠定理论基础的是（ ）\",\"opts\":[[\"A\",\"阶级斗争学说\"],[\"B\",\"劳动价值论\"],[\"C\",\"唯物史观\"],[\"D\",\"剩余价值学说\"]],\"ans\":\"CD\",\"exp\":\"马克思、恩格斯适应社会的需要，在新的历史条件下创立和发展了唯物史观和剩余价值学说，为实现社会主义从空想到科学的飞跃奠定了坚实的理论基础。C、D 正确。\"},{\"id\":\"第7套-多选8\",\"set\":7,\"type\":\"多选\",\"idx\":8,\"no\":24,\"stem\":\"公有制经济是全体人民的宝贵财富。坚持公有制主体地位不能动摇，国有经济主导作用不能动摇，这是我国各族人民共享发展成果的制度性保证，也是巩固党的执政地位、坚持我国社会主义制度的重要保证。国有企业是（ ）\",\"opts\":[[\"A\",\"中国特色社会主义的重要物质基础和政治基础\"],[\"B\",\"我们党执政兴国的重要支柱和依靠力量\"],[\"C\",\"社会主义市场经济中资源配置的决定性力量\"],[\"D\",\"中国特色社会主义经济的“顶梁柱”\"]],\"ans\":\"ABD\",\"exp\":\"在市场经济条件下，市场是资源配置的决定性力量，C 错误。国有企业是中国特色社会主义的重要物质基础和政治基础，是我们党执政兴国的重要支柱和依靠力量，是中国特色社会主义经济的“顶梁柱”，A、B、D 正确。\"},{\"id\":\"第7套-多选10\",\"set\":7,\"type\":\"多选\",\"idx\":10,\"no\":26,\"stem\":\"习近平总书记指出：“我们捍卫和平、维护安全、慑止战争的手段和选择有多种多样，但军事手段始终是保底手段。”只有以强大军事实力为后盾（ ）\",\"opts\":[[\"A\",\"政治安全、国土安全等其他安全才能托底\"],[\"B\",\"国家的总体安全和人民的幸福生活才有保障\"],[\"C\",\"实现国家繁荣富强的主动权才能牢牢掌握在自己手中\"],[\"D\",\"当代中国价值观念才能走向世界\"]],\"ans\":\"ABC\",\"exp\":\"军事属于硬实力，文化、价值观念属于软实力。当代中国价值观念要走向世界，就要下大力气加强文化软实力建设，广泛传播当代中国价值观念，充分展示中华文化独特魅力，D 错误。A、B、C 正确。\"},{\"id\":\"第7套-多选12\",\"set\":7,\"type\":\"多选\",\"idx\":12,\"no\":28,\"stem\":\"全民族抗战伊始，中共中央就提出必须在统一战线中坚持独立自主原则。为此，共产党必须保持在思想上、政治上和组织上的独立性，放手发动群众，壮大人民力量；必须坚持对人民军队的绝对领导，冲破国民党的限制和束缚，努力发展人民武装和抗日根据地；必须对国民党采取又团结又斗争、以斗争求团结的方针。这样做的目的就是（ ）\",\"opts\":[[\"A\",\"彻底清除统一战线内部的矛盾和斗争\"],[\"B\",\"力争中国共产党对抗日战争的领导权\"],[\"C\",\"使中国共产党成为团结全民族抗战的中坚力量\"],[\"D\",\"跳出“其兴也勃焉，其亡也忽焉”的治乱兴衰历史周期率\"]],\"ans\":\"BC\",\"exp\":\"全民族抗战伊始，中共中央提出必须在统一战线中坚持独立自主原则，目的就是力争中国共产党对抗日战争的领导权，使中国共产党成为团结全民族抗战的中坚力量，B、C 正确。由于国共两党代表不同的阶级利益，统一战线内部不可避免地存在着矛盾和斗争，A 错误。D 是关于怎样执政和执政党自身建设的问题，不符合题意。\"},{\"id\":\"第7套-多选13\",\"set\":7,\"type\":\"多选\",\"idx\":13,\"no\":29,\"stem\":\"1989 年 6 月，江泽民同志在党的十三届四中全会上当选为中央政治局常委、中央委员会总书记，同年 11 月党的十三届五中全会决定他为中共中央军事委员会主席，形成以江泽民同志为核心的党的第三代中央领导集体。从党的十三届四中全会到党的十六大的 13 年中，江泽民同志带领党的中央领导集体，高举马克思列宁主义、毛泽东思想、邓小平理论伟大旗帜，坚持党的基本路线不动摇，紧紧依靠全党全军全国各族人民，坚定不移坚持和发展中国特色社会主义，开创了我国改革开放和社会主义现代化建设新局面。在这 13 年中，我国取得的重大成就有（ ）\",\"opts\":[[\"A\",\"实现人民生活总体小康\"],[\"B\",\"确立社会主义市场经济体制的改革目标和基本框架\"],[\"C\",\"成功加入世界贸易组织，形成对外开放新格局\"],[\"D\",\"实现香港、澳门顺利回归\"]],\"ans\":\"ABCD\",\"exp\":\"从党的十三届四中全会到党的十六大的 13 年中，以江泽民同志为核心的党的第三代中央领导集体领导全党全国各族人民，实现了人民生活总体小康，确立了社会主义市场经济体制的改革目标和基本框架，成功加入世界贸易组织、形成对外开放新格局，实现了香港、澳门顺利回归。A、B、C、D 全选。\"},{\"id\":\"第7套-多选14\",\"set\":7,\"type\":\"多选\",\"idx\":14,\"no\":30,\"stem\":\"安徽当涂李白墓第四十九代守墓人谷常新，18 岁时接过家族守墓的接力棒，一守就是 41 年。从扫地擦碑到研究李白、为游客讲诗，他把“守墓”当成事业。前不久，谷常新入选中共中央宣传部、国家发展改革委联合发布的“诚信之星”名单。时间为证，一份跨越千年的承诺，一代代人接续践行。诚信是社会主义核心价值观的重要内容，是（ ）\",\"opts\":[[\"A\",\"个人立身处世的基本价值规范\"],[\"B\",\"社会存续发展的重要价值基石\"],[\"C\",\"社会主义职业道德的基本规范之一\"],[\"D\",\"中华传统美德的根本要求\"]],\"ans\":\"ABC\",\"exp\":\"诚信是个人立身处世的基本价值规范，是社会存续发展的重要价值基石，也是社会主义职业道德的基本规范之一，A、B、C 正确。“公义胜私欲”是中华传统美德的根本要求，D 错误。\"},{\"id\":\"第7套-多选16\",\"set\":7,\"type\":\"多选\",\"idx\":16,\"no\":32,\"stem\":\"习近平总书记在庆祝中国共产党成立 105 周年大会上的讲话中指出，中国共产党之所以能够在 105 年奋斗中不断铸就辉煌，历史和人民之所以选择中国共产党，根本在于我们党具有其他政党和政治力量无可比拟的优秀特质。这就是（ ）\",\"opts\":[[\"A\",\"矢志追求真理，深深植根人民\"],[\"B\",\"勇担历史使命，顺应发展潮流\"],[\"C\",\"敢于善于斗争，注重强健自身\"],[\"D\",\"理论联系实际，密切联系群众\"]],\"ans\":\"ABC\",\"exp\":\"中国共产党具有其他政党和政治力量无可比拟的六大优秀特质：矢志追求真理，深深植根人民，勇担历史使命，顺应发展潮流，敢于善于斗争，注重强健自身。A、B、C 正确。D 是中国共产党三大优良作风的内容，不符合题意。\"},{\"id\":\"第7套-多选17\",\"set\":7,\"type\":\"多选\",\"idx\":17,\"no\":33,\"stem\":\"1946 年 5 月 3 日，根据日本无条件投降安排和盟军最高统帅颁布的《远东国际军事法庭宪章》，远东国际军事法庭正式开庭。这场历史性审判汇聚 11 国司法力量，以海量铁证和严谨法理，判定日本军国主义发动侵略战争、严重违反国际法，揭露日本侵略者在亚洲多国犯下的累累罪行，判处东条英机等 25 名甲级战犯绞刑、徒刑，驳斥所谓“胜利者审判”“自卫战争”“事后立法”等谬论。东京审判（ ）\",\"opts\":[[\"A\",\"是抗日战争取得完全胜利的重要标志\"],[\"B\",\"是《开罗宣言》《波茨坦公告》规定的实施\"],[\"C\",\"反映战胜国与受害者集体意志\"],[\"D\",\"践行《联合国宪章》的宗旨与原则\"]],\"ans\":\"BCD\",\"exp\":\"东京审判是《开罗宣言》《波茨坦公告》规定的实施，反映战胜国与受害者集体意志，践行《联合国宪章》的宗旨与原则，捍卫了二战胜利成果，B、C、D 正确。被日本占领 50 年之久的台湾以及澎湖列岛重归中国主权管辖，这是抗日战争取得完全胜利的重要标志，A 错误。\"},{\"id\":\"第8套-单选3\",\"set\":8,\"type\":\"单选\",\"idx\":3,\"no\":3,\"stem\":\"资本家提高对工人剥削程度的方法是多种多样的，最基本的方法有两种，即绝对剩余价值的生产和相对剩余价值的生产。绝对剩余价值的生产和相对剩余价值的生产都是依靠（ ）\",\"opts\":[[\"A\",\"延长工作日获得的\"],[\"B\",\"提高劳动生产率获得的\"],[\"C\",\"缩短工人的必要劳动时间获得的\"],[\"D\",\"延长工人的剩余劳动时间获得的\"]],\"ans\":\"D\",\"exp\":\"绝对剩余价值是指在必要劳动时间不变的条件下，由于延长工作日的长度或提高劳动强度而生产的剩余价值。相对剩余价值是指在工作日长度不变的条件下，通过缩短必要劳动时间而相对延长剩余劳动时间所生产的剩余价值。两者在本质上都是依靠延长工人的剩余劳动时间获得的。D 正确。\"},{\"id\":\"第8套-单选6\",\"set\":8,\"type\":\"单选\",\"idx\":6,\"no\":6,\"stem\":\"中共中央在 1952 年底开始酝酿并于 1953 年正式提出党在过渡时期的总路线。这条总路线的主要内容可概括为“一化三改”，又称“一体两翼”。在社会主义改造的过程中，改造资本主义工商业和逐步完成向社会主义过渡的必经之路是（ ）\",\"opts\":[[\"A\",\"合作社经济\"],[\"B\",\"赎买政策\"],[\"C\",\"国家资本主义\"],[\"D\",\"国有经济\"]],\"ans\":\"C\",\"exp\":\"国家资本主义是改造资本主义工商业和逐步完成向社会主义过渡的必经之路。C 正确。合作社经济是对个体农业和手工业进行社会主义改造的形式；赎买政策是党改造资本主义工商业采取的和平方式。\"},{\"id\":\"第8套-单选7\",\"set\":8,\"type\":\"单选\",\"idx\":7,\"no\":7,\"stem\":\"实现现代化是近代以来中国人民孜孜以求的宏愿。中国共产党团结带领中国人民追求民族复兴的历史，也是一部不断探索现代化道路的历史。现代化的最终目标是实现（ ）\",\"opts\":[[\"A\",\"中华民族伟大复兴\"],[\"B\",\"物质财富极大丰富\"],[\"C\",\"社会关系高度和谐\"],[\"D\",\"人自由而全面的发展\"]],\"ans\":\"D\",\"exp\":\"现代化的本质是人的现代化，现代化的最终目标是实现人自由而全面的发展。D 正确。\"},{\"id\":\"第8套-单选9\",\"set\":8,\"type\":\"单选\",\"idx\":9,\"no\":9,\"stem\":\"不靠江、不临海、不沿边，义乌这座“建在市场上的城市”，有 129 万多户经营主体“买卖全球”，销售 210 多万种商品，联通 230 多个国家和地区。习近平同志在浙江工作期间，多次到义乌调研，总结推广“义乌发展经验”，并精辟指出义乌的发展是“莫名其妙”的发展、“无中生有”的发展、“点石成金”的发展。义乌发展“莫名其妙、无中生有、点石成金”的根本原因是（ ）\",\"opts\":[[\"A\",\"尊重市场经济规律\"],[\"B\",\"尊重群众首创精神\"],[\"C\",\"发挥有为政府作用\"],[\"D\",\"坚持改革创新实干\"]],\"ans\":\"D\",\"exp\":\"义乌发展“莫名其妙、无中生有、点石成金”的根本原因是坚持改革创新实干。D 正确。\"},{\"id\":\"第8套-单选11\",\"set\":8,\"type\":\"单选\",\"idx\":11,\"no\":11,\"stem\":\"1929 年 12 月，红四军党的第九次代表大会在福建上杭县古田村召开（史称古田会议）。大会通过了毛泽东起草的古田会议决议。古田会议决议是中国共产党和红军建设的纲领性文献，是党和人民军队建设史上的重要里程碑。古田会议创造性地解决了在农村环境中、在党组织和军队以农民为主要成分的条件下（ ）\",\"opts\":[[\"A\",\"②③\"],[\"B\",\"①②④\"],[\"C\",\"①②\"],[\"D\",\"②③④\"]],\"ans\":\"C\",\"exp\":\"古田会议创造性地解决了在农村环境中、在党组织和军队以农民为主要成分的条件下，如何保持党的无产阶级先锋队性质和如何建设党领导的新型人民军队的重大问题。①②正确，选 C。\"},{\"id\":\"第8套-单选12\",\"set\":8,\"type\":\"单选\",\"idx\":12,\"no\":12,\"stem\":\"1948 年 4 月 30 日，中共中央在纪念五一国际劳动节的口号中提出：“各民主党派、各人民团体、各社会贤达迅速召开政治协商会议，讨论并实现召集人民代表大会，成立民主联合政府。”这个号召得到各民主党派和社会各界的热烈响应。中国各民主党派从成立的时候起，大多同中国共产党建立了不同程度的合作关系，并在斗争实践中逐步发展了这种关系。这是因为（ ）\",\"opts\":[[\"A\",\"中国各民主党派形成时的社会基础与中国共产党的社会基础是一致的\"],[\"B\",\"中国各民主党派的政纲同中国共产党的新民主主义革命政纲基本上一致\"],[\"C\",\"中国各民主党派的建国方案同中国共产党的建国方案大体相同\"],[\"D\",\"中国各民主党派同中国共产党一起都参加了大革命时期的斗争，有合作的基础\"]],\"ans\":\"B\",\"exp\":\"中国各民主党派成立时的政纲同中国共产党的新民主主义革命政纲基本上一致，这是各民主党派同中国共产党建立合作关系的重要原因。B 正确。各民主党派的社会基础主要是民族资产阶级、城市小资产阶级以及同这些阶级相联系的知识分子和其他爱国分子，与共产党的社会基础不同，A 错误。民主党派的建国方案与共产党的新民主主义建国方案有本质区别，C 错误。各民主党派大多成立于抗日战争时期，并未参加大革命时期的斗争，D 错误。\"},{\"id\":\"第8套-单选14\",\"set\":8,\"type\":\"单选\",\"idx\":14,\"no\":14,\"stem\":\"习近平总书记指出，党纪国法不能成为“橡皮泥”“稻草人”，无论是因为“法盲”导致违纪违法，还是故意违规违法，都要受到追究，否则就会形成“破窗效应”。任何人不论权力大小、职位高低，只要有违法犯罪行为，就要受到法律制裁，这体现的是法律的（ ）\",\"opts\":[[\"A\",\"普遍适用\"],[\"B\",\"优先适用\"],[\"C\",\"不可违反\"],[\"D\",\"阶级属性\"]],\"ans\":\"A\",\"exp\":\"法律的普遍适用性是指在国家权力所及的范围内，法律具有普遍的约束力，任何人不论权力大小、职位高低，只要有违法犯罪行为，都要受到法律制裁。A 正确。\"},{\"id\":\"第8套-单选15\",\"set\":8,\"type\":\"单选\",\"idx\":15,\"no\":15,\"stem\":\"2026 年 2 月，中共中央办公厅印发《关于在全党开展树立和践行正确政绩观学习教育的通知》，经党中央同意，在全党开展树立和践行正确政绩观学习教育。学习教育以县处级以上领导班子和领导干部特别是“一把手”为重点，于 2026 年春节假期后启动、7 月底基本结束。树立和践行正确政绩观学习教育的抓手是（ ）\",\"opts\":[[\"A\",\"一体推进学查改\"],[\"B\",\"坚持问题导向\"],[\"C\",\"坚定理想信念\"],[\"D\",\"坚持实事求是、求真务实\"]],\"ans\":\"A\",\"exp\":\"树立和践行正确政绩观学习教育以一体推进学查改为抓手，在深入学习、深入查摆、深入整改中树立和践行正确政绩观。A 正确。\"},{\"id\":\"第8套-单选16\",\"set\":8,\"type\":\"单选\",\"idx\":16,\"no\":16,\"stem\":\"当地时间 2026 年 9 月 12 日，国家主席习近平在印度新德里出席金砖国家领导人第十八次会晤期间会见印度总理莫迪。两国领导人就事关中印两国的战略性、长远性、方向性问题坦诚深入交换意见，达成最重要的共识是（ ）\",\"opts\":[[\"A\",\"要聚焦发展这个最大公约数\"],[\"B\",\"改善两国关系民意基础\"],[\"C\",\"进一步增进政治互信，妥处矛盾分歧\"],[\"D\",\"中印要做伙伴\"]],\"ans\":\"D\",\"exp\":\"习近平会见莫迪时指出，中印两国领导人达成最重要的共识就是“中印要做伙伴”，而不是对手，更不是敌人。D 正确。\"},{\"id\":\"第8套-多选1\",\"set\":8,\"type\":\"多选\",\"idx\":1,\"no\":17,\"stem\":\"人工智能、量子计算、生物技术等前沿科技不断取得新突破，技术革新中涌流不竭灵感源泉，为科幻创作带来现实滋养。早前，鹏城文学院科幻板块落户广东深圳光明科学城，重点推动科幻作品创作与孵化。作为粤港澳大湾区综合性国家科学中心先行启动区，光明科学城里大科学装置集聚，科研人员穿梭其间。科幻文学作家在这里可以直观接触量子计算机等实景，有助于构建有根底的想象力，为科幻创作提供创新土壤。科幻文学“牵手”科学城，这从一个侧面表明（ ）\",\"opts\":[[\"A\",\"科幻作品作为精神产物不能完全脱离物质基础\"],[\"B\",\"想象力归根结底是对现实世界的直观反映\"],[\"C\",\"任何观念都可以从现实世界中找到其物质“原型”\"],[\"D\",\"科幻作品中对于未来的想象最终都能实现\"]],\"ans\":\"AC\",\"exp\":\"意识是人脑对客观存在的主观映象，科幻作品作为精神产物不能完全脱离物质基础，任何观念都可以从现实世界中找到其物质“原型”。A、C 正确。想象力是对现实世界的能动反映和创造性加工，而不是直观反映，B 错误。科幻作品中对于未来的想象并非最终都能实现，D 过于绝对，错误。\"},{\"id\":\"第8套-多选3\",\"set\":8,\"type\":\"多选\",\"idx\":3,\"no\":19,\"stem\":\"马克思通过分析剩余价值的生产、积累、流通以及分配过程，揭示了剩余价值的运动规律及其作用，创立了剩余价值理论。剩余价值理论（ ）\",\"opts\":[[\"A\",\"深刻揭露了资本主义生产关系的剥削本质\"],[\"B\",\"阐明了资产阶级与无产阶级之间阶级斗争的经济根源\"],[\"C\",\"指出了无产阶级革命的历史必然性\"],[\"D\",\"是马克思经济学说的核心内容和基石，是“理解政治经济学的枢纽”\"]],\"ans\":\"ABC\",\"exp\":\"剩余价值理论深刻揭露了资本主义生产关系的剥削本质，阐明了资产阶级与无产阶级之间阶级斗争的经济根源，指出了无产阶级革命的历史必然性。剩余价值理论是马克思经济学说的核心内容和基石，是无产阶级反对资产阶级、揭示资本主义制度剥削本质的锐利武器。由于唯物史观和剩余价值理论的发现，社会主义由空想变为科学。A、B、C 正确。劳动二重性理论是“理解政治经济学的枢纽”，D 错误。\"},{\"id\":\"第8套-多选4\",\"set\":8,\"type\":\"多选\",\"idx\":4,\"no\":20,\"stem\":\"进入 21 世纪以来，资本主义呈现出一些新变化、新特征。国际金融垄断资本主义影响日益显现，国际金融资本的垄断成为当代资本主义最突出、最鲜明、最主要的特征，这表现在（ ）\",\"opts\":[[\"A\",\"金融垄断寡头化\"],[\"B\",\"金融垄断国际化\"],[\"C\",\"金融垄断政治化\"],[\"D\",\"经济虚拟化、产业空心化\"]],\"ans\":\"ABD\",\"exp\":\"进入 21 世纪以来，国际金融垄断资本主义影响日益显现。资本主义生产方式新变化在有效降低信息获取、资源匹配和商品交换成本，有力推动物质财富的创造和积累的同时，也推动资本积累方式从一般产业资本积累向国际金融垄断资本积累转变，国际金融资本的垄断成为当代资本主义最突出、最鲜明、最主要的特征。一是金融垄断寡头化；二是金融垄断国际化；三是经济虚拟化、产业空心化。A、B、D 正确，C 错误。\"},{\"id\":\"第8套-多选6\",\"set\":8,\"type\":\"多选\",\"idx\":6,\"no\":22,\"stem\":\"社会主义改革开放理论是邓小平理论的主要内容之一。邓小平指出：“改革的性质同过去的革命一样，也是为了扫除发展社会生产力的障碍，使中国摆脱贫穷落后的状态。从这个意义上说，改革也可以叫革命性的变革。”改革不是原有经济体制的细枝末节的修补，它的实质和目标是要（ ）\",\"opts\":[[\"A\",\"从根本上改变束缚我国生产力发展的经济体制\"],[\"B\",\"建立充满生机和活力的社会主义新经济体制\"],[\"C\",\"相应地改革政治体制和其他方面的体制\"],[\"D\",\"实现中国的社会主义现代化\"]],\"ans\":\"ABCD\",\"exp\":\"社会主义改革开放理论是邓小平理论的主要内容之一。改革是一场深刻的社会变革，是中国的第二次革命，是实现中国现代化的必由之路。改革不是原有经济体制的细枝末节的修补，它的实质和目标是要从根本上改变束缚我国生产力发展的经济体制，建立充满生机和活力的社会主义新经济体制，同时相应地改革政治体制和其他方面的体制，以实现中国的社会主义现代化。改革是一场新的革命。但改革不是一个阶级推翻另一个阶级那种原来意义上的革命，不是也不允许否定和抛弃我们建立起来的社会主义基本制度，而是社会主义制度的自我完善和发展。A、B、C、D 全选。\"},{\"id\":\"第8套-多选7\",\"set\":8,\"type\":\"多选\",\"idx\":7,\"no\":23,\"stem\":\"随着经济社会发展、居民收入水平提高，服务业在国家发展大局中扮演着愈发举足轻重的角色，已经成为我国国民经济的第一大产业，这彰显了以习近平同志为核心的党中央对服务业的高度重视。服务业是（ ）\",\"opts\":[[\"A\",\"经济发展的“主动力”“主引擎”\"],[\"B\",\"科技创新的“催化剂”、制造价值的“倍增器”\"],[\"C\",\"就业的“蓄水池”“稳定器”\"],[\"D\",\"现代化产业体系的骨干\"]],\"ans\":\"ABC\",\"exp\":\"随着经济社会发展、居民收入水平提高，服务业在国家发展大局中扮演着愈发举足轻重的角色。服务业是经济发展的“主动力”“主引擎”。当前，服务业对国民经济增长的贡献率超过 60%。服务业是科技创新的“催化剂”、制造价值的“倍增器”。我国制造业增加值规模连续 16 年位居世界第一的背后，生产性服务业的贡献功不可没。服务业是就业的“蓄水池”“稳定器”。服务业门类多、领域广、方式灵活、就业弹性系数大，吸纳就业作用显著。2024 年末，服务业就业人员达到 3.6 亿人，占全国就业人员总数的 48.8%。A、B、C 正确。现代化产业体系的骨干是先进制造业。D 错误。\"},{\"id\":\"第8套-多选8\",\"set\":8,\"type\":\"多选\",\"idx\":8,\"no\":24,\"stem\":\"习近平总书记深刻总结近年来的实践，提出了做好新形势下经济工作的“五个必须”，必须做到既“放得活”又“管得好”是其中之一。做到既“放得活”又“管得好”，就是要正确处理政府和市场关系这一经济体制改革的核心问题，让市场“无形之手”与政府“有形之手”各负其责，持续增强高质量发展动力和活力。以下选项内容正确的有（ ）\",\"opts\":[[\"A\",\"“放”就是让市场在资源配置中起全部作用，充分激发各类经营主体活力\"],[\"B\",\"“管”针对的是破坏市场秩序、扰乱市场预期等行为\"],[\"C\",\"“管”的本质要求是建设法治经济\"],[\"D\",\"检验是否做到既“放得活”又“管得好”，关键看是否有效推动经济高质量发展\"]],\"ans\":\"BCD\",\"exp\":\"市场在资源配置中起决定性作用，并不是起全部作用。我国实行的是社会主义市场经济体制，仍然要坚持发挥社会主义制度的优越性、发挥党和政府的积极作用。A 错误。“管”针对的是破坏市场秩序、扰乱市场预期等行为，本质要求是建设法治经济。检验是否做到既“放得活”又“管得好”，关键看是否有效推动经济高质量发展。B、C、D 正确。\"},{\"id\":\"第8套-多选9\",\"set\":8,\"type\":\"多选\",\"idx\":9,\"no\":25,\"stem\":\"人民政协是中国共产党领导的政治组织，是最广泛的爱国统一战线组织，是社会主义协商民主的重要渠道和专门协商机构。70 多年来的实践充分证明，人民政协在人类政治制度发展史上具有独特政治价值，已经并将不断展现出旺盛生命力。人民政协的独特政治价值在于有利于（ ）\",\"opts\":[[\"A\",\"保证国家沿着社会主义道路前进，跳出治乱兴衰的历史周期率\"],[\"B\",\"完善人民当家作主的制度体系，更好保障最广大人民整体利益、根本利益、长远利益\"],[\"C\",\"最大限度把全体中华儿女的智慧和力量汇聚起来，形成心往一处想、劲往一处使的生动局面\"],[\"D\",\"促进科学决策、有效施策，提升国家治理效能\"]],\"ans\":\"BCD\",\"exp\":\"人民政协作为中国共产党领导的政治组织，有利于完善人民当家作主的制度体系，更好保障最广大人民整体利益、根本利益、长远利益；作为最广泛的爱国统一战线组织，有利于最大限度把全体中华儿女智慧和力量汇聚起来，形成心往一处想、劲往一处使的生动局面；作为社会主义协商民主的重要渠道和专门协商机构，有利于促进科学决策、有效施策，提升国家治理效能。B、C、D 正确。人民代表大会制度是我国的根本政治制度，这一根本制度有效保证国家沿着社会主义道路前进，有效保证国家治理跳出治乱兴衰的历史周期率，有效保证国家政治生活既充满活力又安定有序。A 不符合题意。\"},{\"id\":\"第8套-多选11\",\"set\":8,\"type\":\"多选\",\"idx\":11,\"no\":27,\"stem\":\"随着中国工人阶级开始作为独立的政治力量登上历史舞台和马克思主义在中国的逐步传播，建立一个以马克思主义为指导的工人阶级政党的任务被提上了日程。1920 年 8 月，共产党早期组织在上海《新青年》编辑部成立。同年 10 月，李大钊等在北京成立共产党早期组织。从 1920 年秋至 1921 年春，武汉、长沙、济南、广州，都成立了共产党早期组织。在日本、法国成立了由留学生和华侨中先进分子组成的共产党早期组织。中国共产党早期组织成立后，进行多方面的活动，使在中国创建共产党的条件基本具备了。共产党早期组织成立后，着重进行的工作主要有（ ）\",\"opts\":[[\"A\",\"研究和宣传马克思主义，研究中国实际问题\"],[\"B\",\"到工人中去进行宣传和组织工作\"],[\"C\",\"提出反帝反封建的民主革命纲领\"],[\"D\",\"进行关于建党问题的讨论和实际组织工作\"]],\"ans\":\"ABD\",\"exp\":\"共产党早期组织成立后，着重进行了以下几方面的工作：第一，研究和宣传马克思主义，研究中国实际问题。第二，到工人中去进行宣传和组织工作。第三，进行关于建党问题的讨论和实际组织工作。A、B、D 正确。中共二大第一次提出了反帝反封建的民主革命纲领，为中国人民指出了明确的斗争目标。C 错误。\"},{\"id\":\"第8套-多选12\",\"set\":8,\"type\":\"多选\",\"idx\":12,\"no\":28,\"stem\":\"1941 年 5 月，毛泽东作了《改造我们的学习》的报告。整风运动首先在党的高级干部中进行。1942 年 2 月，毛泽东先后作了《整顿党的作风》和《反对党八股》的讲演，整风运动在全党范围普遍展开。任弼时在《学习毛泽东整顿三风报告的笔记》中记录了参加整风运动的体会：“毛泽东同志整顿三风报告中，关于反对主观主义的主要精神，是正确地提出了对待马列主义态度问题。告诉我们学习马列主义，不是学它的字句，而是要学会用它的立场、观点和方法去解决革命中的实际问题，找出革命的发展规律，来便于我们具体决定政策。”整风运动（ ）\",\"opts\":[[\"A\",\"使实事求是的思想路线在全党范 /* ---------- 存储 ---------- */
function blank(){ return { v:1, rec:{}, mocks:[] }; }
let DB = (function(){
  try { const o = JSON.parse(localStorage.getItem(KEY)); if(o && o.v===1) return o; } catch(e){}
  return blank();
})();
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(DB)); }catch(e){ alert("本地保存失败，可能是浏览器隐私模式。"); } }
function rec(id){
  if(!DB.rec[id]) DB.rec[id] = { a:0,r:0,w:0,streak:0,guess:false,out:false,last:"",ok:false,ts:0 };
  return DB.rec[id];
}

/* 首次打开时，把预置的错题种进错题本（只种一次） */

  (CFG.seed||[]).forEach(function(id){
    if(!DB.rec[id]) DB.rec[id] = { a:1,r:0,w:1,streak:0,guess:false,out:false,last:"",ok:false,ts:0 };

/* ---------- 工具 ---------- */
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function fmtExp(t){
  return esc(t).replace(/([ABCD])\s*(正确|错误)/g, (m, k, v) =>
    v === "正确" ? `<b class="v-ok">${k} 正确</b>` : `<b class="v-bad">${k} 错误</b>`);
}
function acc(ids){
  let a=0,r=0;
  ids.forEach(id=>{ const x=DB.rec[id]; if(x){ a+=x.a; r+=x.r; } });
  return a ? r/a : 0;
}
function setIds(n){ return QUESTIONS.filter(q=>q.set===n).map(q=>q.id); }
function wrongIds(){
  return QUESTIONS.filter(q=>{
    const x = DB.rec[q.id];
    if(!x) return false;
    if(x.out) return false;
    if(x.streak >= 2) return false;
    return x.w > 0 || x.guess;
  }).map(q=>q.id);
}
const $ = sel => document.querySelector(sel);

/* ---------- 路由 ---------- */
let ROUTE = { name:"home" };
let QUIZ = null;

function go(name, params){
  ROUTE = Object.assign({ name }, params||{});
  QUIZ = null;
  render();
  window.scrollTo(0,0);
}

function render(){
  const v = ROUTE.name;
  let html = "";
  if(v==="home") html = viewHome();
  else if(v==="picker") html = viewPicker();
  else if(v==="quiz") html = viewQuiz();
  else if(v==="result") html = viewResult();
  else if(v==="wrong") html = viewWrong();
  else if(v==="stats") html = viewStats();
  else if(v==="settings") html = viewSettings();
  $("#app").innerHTML = html;
  if(v==="quiz" && QUIZ && QUIZ.mode==="mock") startTimer();
}

  const rows = ids.length ? ids.map(id=>{

    </div>

/* ---------- 选套 ---------- */
function viewPicker(){
  const mode = ROUTE.mode;
  const title = mode==="mock" ? "整套模考" : "分套练习";
  let rows = "";
  SETS.forEach(n=>{
    const ids = setIds(n);
    const a = acc(ids);

    rows += `<button class="setrow" data-act="start" data-mode="${mode}" data-set="${n}">
      <div class="no">${n}</div>

        <div class="muted">已练 ${done}/33 ｜ 正确率 ${a?(a*100).toFixed(0)+"%":"—"}</div>

  });
  return `
  <div class="topbar"><div class="in">
    <button class="btn sm ghost" data-act="go" data-to="home">←</button>
    <h1>${title}</h1>
  </div></div>
  <div class="wrap">${rows}</div>`;
}

}
