<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1f2937">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="肖八刷题">
<title>肖八选择题 · 2027 考研政治</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#f5f6f8;--card:#fff;--ink:#16181d;--sub:#6b7280;--line:#e5e7eb;
  --brand:#2563eb;--brand-soft:#eff6ff;--ok:#16a34a;--ok-soft:#f0fdf4;
  --bad:#dc2626;--bad-soft:#fef2f2;--warn:#d97706;
}
html,body{margin:0;padding:0}
body{
  background:var(--bg);color:var(--ink);
  font:16px/1.6 -apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  -webkit-text-size-adjust:100%;
}
.topbar{
  position:sticky;top:0;z-index:20;background:rgba(245,246,248,.92);
  backdrop-filter:saturate(180%) blur(12px);-webkit-backdrop-filter:saturate(180%) blur(12px);
  border-bottom:1px solid var(--line);
}
.topbar .in{max-width:680px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:10px}
.topbar h1{font-size:16px;margin:0;font-weight:600;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wrap{max-width:680px;margin:0 auto;padding:16px 16px 120px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:12px}
.row{display:flex;gap:10px;align-items:center}
.muted{color:var(--sub);font-size:13px}
h2{font-size:15px;margin:0 0 10px;font-weight:600}
button{font:inherit;color:inherit;cursor:pointer;border:none;background:none}
.btn{
  display:flex;align-items:center;justify-content:center;gap:8px;
  width:100%;min-height:48px;padding:12px 16px;border-radius:12px;
  background:var(--card);border:1px solid var(--line);font-weight:500;text-align:center;
}
.btn:active{transform:scale(.985)}
.btn.primary{background:var(--brand);border-color:var(--brand);color:#fff}
.btn.ghost{background:transparent}
.btn.sm{min-height:36px;padding:6px 12px;width:auto;border-radius:9px;font-size:14px}
.btn:disabled{opacity:.45}
.modes{display:grid;gap:10px}
.mode{
  display:flex;align-items:center;gap:14px;text-align:left;width:100%;
  background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;
}
.mode .ic{width:40px;height:40px;border-radius:11px;display:grid;place-items:center;font-size:19px;flex:none}
.mode .tt{font-weight:600;font-size:15px}
.mode .ds{font-size:12.5px;color:var(--sub);margin-top:2px}
.ic.blue{background:var(--brand-soft);color:var(--brand)}
.ic.green{background:var(--ok-soft);color:var(--ok)}
.ic.red{background:var(--bad-soft);color:var(--bad)}
.ic.amber{background:#fffbeb;color:var(--warn)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px}
.stat .n{font-size:22px;font-weight:700;letter-spacing:-.5px}
.stat .l{font-size:12.5px;color:var(--sub)}
.setrow{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:8px}
.setrow .no{width:34px;height:34px;border-radius:9px;background:var(--bg);display:grid;place-items:center;font-weight:600;font-size:14px;flex:none}
.bar{height:6px;border-radius:3px;background:var(--line);overflow:hidden;margin-top:6px}
.bar>i{display:block;height:100%;background:var(--brand);border-radius:3px}
.qmeta{display:flex;gap:8px;align-items:center;font-size:12.5px;color:var(--sub);margin-bottom:10px;flex-wrap:wrap}
.tag{padding:2px 8px;border-radius:6px;background:var(--bg);border:1px solid var(--line);font-size:12px}
.tag.b{background:var(--brand-soft);border-color:#dbeafe;color:var(--brand)}
.stem{font-size:16px;line-height:1.78;margin-bottom:14px;white-space:pre-wrap}
.stmts{margin:0 0 14px;padding-left:0;list-style:none;color:#374151;font-size:14.5px;line-height:1.7}
.stmts li{margin-bottom:4px}
.opt{
  display:flex;gap:11px;align-items:flex-start;width:100%;text-align:left;
  background:var(--card);border:1.5px solid var(--line);border-radius:12px;
  padding:12px 14px;margin-bottom:9px;line-height:1.65;transition:border-color .12s,background .12s;
}
.opt .k{
  flex:none;width:24px;height:24px;border-radius:50%;border:1.5px solid var(--line);
  display:grid;place-items:center;font-size:13px;font-weight:600;margin-top:1px;color:var(--sub);
}
.opt.sel{border-color:var(--brand);background:var(--brand-soft)}
.opt.sel .k{background:var(--brand);border-color:var(--brand);color:#fff}
.opt.ok{border-color:var(--ok);background:var(--ok-soft)}
.opt.ok .k{background:var(--ok);border-color:var(--ok);color:#fff}
.opt.bad{border-color:var(--bad);background:var(--bad-soft)}
.opt.bad .k{background:var(--bad);border-color:var(--bad);color:#fff}
.exp{background:#f9fafb;border:1px solid var(--line);border-left:3px solid var(--brand);border-radius:10px;padding:12px 14px;font-size:14px;line-height:1.72;margin-top:4px}
.exp b.v-ok{color:var(--ok)}
.exp b.v-bad{color:var(--bad)}
.exp .ans{font-weight:600;margin-bottom:6px;font-size:14.5px}
.exp .ans b{color:var(--ok);font-size:16px}
.banner{padding:12px 14px;border-radius:10px;font-size:14.5px;font-weight:600;margin-bottom:12px;line-height:1.5;display:block}
.banner.ok{background:var(--ok-soft);color:var(--ok);border:1px solid #dcfce7}
.banner.bad{background:var(--bad-soft);color:var(--bad);border:1px solid #fee2e2}
.qnav{display:flex;flex-wrap:wrap;gap:6px}
.qnav button{width:34px;height:34px;border-radius:8px;background:var(--card);border:1px solid var(--line);font-size:12.5px;color:var(--sub)}
.qnav button.done{background:var(--brand-soft);border-color:#dbeafe;color:var(--brand);font-weight:600}
.qnav button.cur{background:var(--brand);border-color:var(--brand);color:#fff;font-weight:600}
.footbar{
  position:fixed;left:0;right:0;bottom:0;z-index:30;
  background:rgba(255,255,255,.96);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  border-top:1px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom));
}
.footbar .in{max-width:680px;margin:0 auto;display:flex;gap:10px}
.footbar .btn{min-height:46px}
.progress{height:3px;background:var(--line)}
.progress>i{display:block;height:100%;background:var(--brand);transition:width .2s}
.wlist{display:flex;gap:12px;align-items:center;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:13px;margin-bottom:8px}
.wlist .txt{flex:1;min-width:0}
.wlist .stem1{font-size:14px;line-height:1.5;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.empty{text-align:center;color:var(--sub);font-size:14px;padding:48px 0}
.kv{display:flex;justify-content:space-between;font-size:14px;padding:11px 0;border-bottom:1px solid var(--line)}
.kv:last-child{border-bottom:none}
textarea{width:100%;min-height:120px;font:12px/1.5 ui-monospace,monospace;border:1px solid var(--line);border-radius:10px;padding:10px}
.hint{font-size:12.5px;color:var(--sub);line-height:1.7}
.guessbtn{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--sub);padding:8px 12px;border:1px solid var(--line);border-radius:9px;background:var(--card)}
.guessbtn.on{color:var(--warn);border-color:#fde68a;background:#fffbeb}
</style>
</head>
